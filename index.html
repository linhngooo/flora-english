    <div class="panel" style="cursor:pointer" data-go="videos"><span class="eyebrow">Content</span><h2 style="margin:4px 0">${S.videos.filter(v=>v.approved).length} approved videos</h2><p class="small muted" style="margin:0">${S.extgames.length} online games · ${S.library.length} resources</p></div>
  </div>
  <div class="split">
    <div class="panel"><h2>Quick tools</h2>
      <div class="grid g3">${[['Take attendance','calendar-check','classes'],['Assign homework','clipboard-plus','homework'],['Make a worksheet','file-text','worksheets'],['Play a class game','gamepad-2','classroom-games'],['Message parents','message-circle-heart','parents'],['Ask the AI assistant','sparkles','assistant']].map(([l,i,r])=>`<button class="btn" style="justify-content:flex-start;padding:12px" data-go="${r}">${ic(i)} ${l}</button>`).join('')}</div></div>
    <div class="panel"><h2>Recent activity</h2><div class="list">${acts.map(a=>`<div class="li">${ic(a.icon||'dot')}<div class="grow small">${esc(a.text)}</div><span class="muted small num">${fmtD(a.date.slice(0,10)).replace(/ \d{4}$/,'')}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div>
  </div>`;
};

// ---------- Classes & students ----------
let classTab='classes', stuQ='', stuCls='';
VIEWS['classes']=()=>{
  if(ARG.startsWith('student-'))return studentProfile(ARG.slice(8));
  if(ARG.startsWith('class-'))return classDetail(ARG.slice(6));
  const tabs=`<div class="tabs" role="tablist"><button class="${classTab==='classes'?'on':''}" onclick="classTab='classes';render()">Classes (${S.classes.length})</button><button class="${classTab==='students'?'on':''}" onclick="classTab='students';render()">Students (${S.students.length})</button></div>`;
  if(classTab==='classes'){
    return `${head('Classes & Students','Manage classes, timetables, attendance and each child\'s profile.',`<button class="btn pri" onclick="A.editClass()">${ic('plus')} Add class</button>`)}${tabs}
    <div class="grid g3">${S.classes.map(c=>{const n=studentsOf(c.id).length;return `<div class="card hover" data-go="classes-class-${c.id}"><div class="classhead c-${c.color}"><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:1.15rem">${esc(c.name)}</b><span class="chip">${esc(c.level)}</span></div><div class="small" style="opacity:.85">${(c.days||[]).map(d=>DOW[d]).join(', ')} · ${esc(c.time||'')}</div></div>
      <div class="row small muted" style="justify-content:space-between"><span>${ic('users')} ${n} students</span><span>${ic('map-pin')} ${esc(c.room||'—')}</span></div>${c.active===false?'<span class="chip">Paused</span>':''}</div>`}).join('')||'<div class="empty">No classes yet. Click "Add class" to create your first one.</div>'}</div>`;
  }
  const list=S.students.filter(s=>(!stuCls||s.classId===stuCls)&&(!stuQ||(s.name+' '+(s.eng||'')).toLowerCase().includes(stuQ.toLowerCase())));
  return `${head('Classes & Students','Manage classes, timetables, attendance and each child\'s profile.',`<button class="btn" data-go="data">${ic('upload')} Import from Excel</button><button class="btn pri" onclick="A.editStudent()">${ic('user-plus')} Add student</button>`)}${tabs}
  <div class="row"><div class="search">${ic('search')}<input type="search" id="stuQ" placeholder="Search by name…" value="${esc(stuQ)}" aria-label="Search students"></div><select id="stuCls" style="width:auto" aria-label="Filter by class">${classOpts(stuCls,'All classes')}</select></div>
  <div class="tablewrap"><table><thead><tr><th>Student</th><th>Class</th><th>Age</th><th>Level</th><th>Skills</th><th>Homework</th><th></th></tr></thead><tbody>
  ${list.map(s=>{const a=avgScore(latestAssess(s.id));const h=hwStats(s.id);return `<tr class="click" data-go="classes-student-${s.id}"><td><div class="row" style="flex-wrap:nowrap">${avatar(s)}<div><b>${esc(s.name)}</b><div class="muted small">${esc(s.eng||'')}</div></div></div></td><td>${esc(clsName(s.classId))}</td><td class="num">${esc(s.age||'')}</td><td>${esc(s.level||'')}</td><td>${a!==null?shields(a):'<span class="muted small">Not assessed</span>'}</td><td class="num">${h.rate!==null?h.rate+'%':'—'}</td><td><button class="icon-btn" onclick="event.stopPropagation();A.editStudent('${s.id}')" aria-label="Edit">${ic('pencil')}</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">No students found.</div></td></tr>'}
  </tbody></table></div>`;
};
VIEWS['classes:after']=()=>{const q=$('#stuQ');if(q){q.oninput=e=>{stuQ=e.target.value;const p=q.selectionStart;render();const n=$('#stuQ');n.focus();n.setSelectionRange(p,p)};$('#stuCls').onchange=e=>{stuCls=e.target.value;render()}}
  const ad=$('#attDate');if(ad)ad.onchange=e=>{attDate=e.target.value;render()}};

A.editClass=id=>{const c=id?cls(id):{color:pick(COLORS),days:[],active:true,duration:90};
  formModal({title:id?'Edit class':'New class',data:c,fields:[
    {k:'name',label:'Class name',ph:'e.g. Movers 2A'},{k:'level',label:'Level / programme',type:'select',opts:v=>opt(LEVELS,v)},
    {k:'days',label:'Days of the week',type:'days',full:true},{k:'time',label:'Start time',type:'time'},{k:'duration',label:'Length (minutes)',type:'number'},
    {k:'room',label:'Room / location'},{k:'color',label:'Class colour',type:'color'},{k:'note',label:'Notes',type:'textarea',full:true}],
    extraFooter:id?`<button class="btn danger" style="margin-right:auto" onclick="A.toggleClass('${id}')">${c.active===false?'Reopen class':'Pause class'}</button>`:'',
    onSave:o=>{if(id){Object.assign(c,o)}else{o.id=uid('c');S.classes.push(o);log(`Created class ${o.name}`,'users')}save('classes');render();toast('Class saved')}})};
A.toggleClass=id=>{const c=cls(id);c.active=c.active===false;save('classes');$$('.modal-bg').forEach(m=>m.remove());render()};
A.delClass=id=>confirmBox(`Delete the class "${clsName(id)}"? Its students will be kept without a class.`,()=>{S.classes=S.classes.filter(c=>c.id!==id);S.students.forEach(s=>{if(s.classId===id)s.classId=''});save('classes','students');go('classes')});
A.editStudent=(id,cid)=>{const s=id?stu(id):{classId:cid||stuCls||S.classes[0]?.id||'',history:[]};
  formModal({title:id?'Edit student':'Add student',data:s,fields:[
    {k:'name',label:'Full name',ph:'e.g. Nguyen Bao Anh'},{k:'eng',label:'English name',ph:'e.g. Annie'},
    {k:'classId',label:'Class',type:'select',opts:v=>classOpts(v,'— No class —')},{k:'age',label:'Age',type:'number'},
    {k:'level',label:'Level',type:'select',opts:v=>opt(LEVELS,v||cls(s.classId)?.level)},{k:'parent',label:'Parent / guardian',ph:'e.g. Mother – Ms Huong'},
    {k:'phone',label:'Phone / Zalo',type:'tel'},{k:'strengths',label:'Strengths',type:'textarea'},{k:'weaknesses',label:'Areas to improve',type:'textarea'},{k:'notes',label:'Learning notes',type:'textarea',full:true}],
    extraFooter:id?`<button class="btn danger" style="margin-right:auto" onclick="A.delStudent('${id}')">${ic('trash-2')} Delete</button>`:'',
    onSave:o=>{if(id)Object.assign(s,o);else{o.id=uid('s');o.history=[];S.students.push(o);log(`Added student ${o.name}`,'user-plus')}save('students');render();toast('Student saved')}})};
A.delStudent=id=>{$$('.modal-bg').forEach(m=>m.remove());confirmBox(`Delete "${stu(id)?.name}" and their assessments?`,()=>{S.students=S.students.filter(s=>s.id!==id);S.assessments=S.assessments.filter(a=>a.studentId!==id);S.kidprogress=S.kidprogress.filter(k=>k.id!==id);save('students','assessments','kidprogress');go('classes')})};

let attDate=todayISO();
function classDetail(id){const c=cls(id);if(!c)return '<div class="empty">Class not found.</div>';
  const st=studentsOf(id);const rec=S.attendance.find(a=>a.classId===id&&a.date===attDate);
  const hist=S.attendance.filter(a=>a.classId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  return `<div><a href="#classes" class="btn ghost sm">${ic('arrow-left')} All classes</a></div>
  <div class="classhead c-${c.color}" style="padding:20px"><div class="pagehead"><div><h1>${esc(c.name)}</h1><p>${esc(c.level)} · ${(c.days||[]).map(d=>DOW[d]).join(', ')} · ${esc(c.time||'')} (${esc(c.duration||'')} min) · ${esc(c.room||'')}</p></div>
  <div class="row"><button class="btn" onclick="A.editClass('${id}')">${ic('pencil')} Edit class</button><button class="btn danger" onclick="A.delClass('${id}')" aria-label="Delete class">${ic('trash-2')}</button></div></div>${c.note?`<p class="small" style="margin:8px 0 0">${esc(c.note)}</p>`:''}</div>
  <div class="split">
   <div class="panel"><div class="ph"><h2>Attendance</h2><div class="row"><input type="date" id="attDate" value="${attDate}" style="width:auto" aria-label="Attendance date"><button class="btn sm" onclick="A.attAll('${id}','present')">Mark all present</button></div></div>
    ${st.length?`<div class="list">${st.map(s=>{const v=rec?.records?.[s.id]||'';return `<div class="li">${avatar(s)}<div class="grow"><b>${esc(s.name)}</b> <span class="muted small">${esc(s.eng||'')}</span></div><div class="row" style="gap:4px">${[['present','Present','good'],['late','Late','warn'],['absent','Absent','bad']].map(([k,l,t])=>`<button class="chip ${v===k?t:''}" style="border:1px solid var(--line);cursor:pointer" aria-pressed="${v===k}" onclick="A.att('${id}','${s.id}','${k}')">${l}</button>`).join('')}</div></div>`}).join('')}</div>`:'<div class="empty">This class has no students yet.</div>'}
    <div class="row" style="margin-top:12px"><button class="btn" onclick="A.editStudent(null,'${id}')">${ic('user-plus')} Add a student to this class</button></div></div>
   <div class="panel"><h2>Attendance history</h2><div class="list">${hist.map(a=>{const v=Object.values(a.records||{});const p=v.filter(x=>x!=='absent').length;return `<div class="li"><span class="num" style="width:96px">${fmtDs(a.date)}</span><div class="grow">${bar(v.length?p/v.length*100:0,'var(--good)')}</div><span class="num small">${p}/${v.length}</span></div>`}).join('')||'<div class="empty">No attendance recorded yet.</div>'}</div></div>
  </div>
  <div class="panel"><div class="ph"><h2>Students in this class</h2></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Attendance</th><th>Homework</th><th>Skills</th><th>Needs attention</th></tr></thead><tbody>${st.map(s=>{const a=avgScore(latestAssess(s.id));const at=attRate(s.id);const h=hwStats(s.id);return `<tr class="click" data-go="classes-student-${s.id}"><td><div class="row" style="flex-wrap:nowrap">${avatar(s)}<b>${esc(s.name)}</b></div></td><td class="num">${at!==null?at+'%':'—'}</td><td class="num">${h.rate!==null?h.rate+'%':'—'}</td><td>${a!==null?shields(a):'—'}</td><td>${needsSupport(s).map(r=>`<span class="chip warn">${r}</span>`).join(' ')}</td></tr>`}).join('')}</tbody></table></div></div>`;
}
A.att=(cid,sid,v)=>{let r=S.attendance.find(a=>a.classId===cid&&a.date===attDate);if(!r){r={id:uid('t'),classId:cid,date:attDate,records:{}};S.attendance.push(r)}r.records[sid]=v;save('attendance');render()};
A.attAll=(cid,v)=>{studentsOf(cid).forEach(s=>{let r=S.attendance.find(a=>a.classId===cid&&a.date===attDate);if(!r){r={id:uid('t'),classId:cid,date:attDate,records:{}};S.attendance.push(r)}r.records[s.id]=v});log(`Took attendance for ${clsName(cid)} on ${fmtD(attDate)}`,'calendar-check');save('attendance');render()};

function studentProfile(id){const s=stu(id);if(!s)return '<div class="empty">Student not found.</div>';
  const as=S.assessments.filter(a=>a.studentId===id).sort((a,b)=>a.date.localeCompare(b.date));const last=as[as.length-1];
  const h=hwStats(id);const at=attRate(id);const kp=S.kidprogress.find(k=>k.id===id);
  const hwl=S.homework.filter(x=>x.records?.[id]).sort((a,b)=>b.due.localeCompare(a.due)).slice(0,6);
  const obs=S.observations.filter(o=>o.studentId===id).slice(-5).reverse();
  return `<div><a href="#classes" class="btn ghost sm" onclick="classTab='students'">${ic('arrow-left')} Student list</a></div>
  <div class="pagehead"><div class="row" style="flex-wrap:nowrap">${avatar(s,1)}<div><h1>${esc(s.name)}</h1><p class="muted" style="margin:0">${esc(s.eng||'')} · age ${esc(s.age||'?')} · ${esc(clsName(s.classId))} · ${esc(s.level||'')}</p></div></div>
  <div class="row"><button class="btn" onclick="A.reportStudent('${id}')">${ic('file-down')} Download report</button><button class="btn" data-go="parents-${id}">${ic('message-circle-heart')} Message parents</button><button class="btn" onclick="A.editStudent('${id}')">${ic('pencil')} Edit</button><button class="btn pri" onclick="A.addAssess('${id}')">${ic('plus')} New assessment</button></div></div>
  <div class="grid g4"><div class="stat"><span class="v">${at!==null?at+'%':'—'}</span><span class="l">Attendance</span></div><div class="stat"><span class="v">${h.rate!==null?h.rate+'%':'—'}</span><span class="l">Homework done (${h.done}/${h.total})</span></div><div class="stat"><span class="v">${last?avgScore(last).toFixed(1):'—'}</span><span class="l">Average shields (/5)</span></div><div class="stat"><span class="v">${kp?kp.stars||0:0} ★</span><span class="l">Kids World stars</span></div></div>
  <div class="split"><div class="panel"><div class="ph"><h2>Current skills</h2>${last?`<span class="muted small">Updated ${fmtD(last.date)}</span>`:''}</div>
    ${last?`<div class="list">${SKILLS.map(([k,l])=>`<div class="li"><span style="width:140px">${l}</span><div class="grow">${shields(last.scores?.[k])}</div></div>`).join('')}</div>`:'<div class="empty">No assessment yet. Click "New assessment".</div>'}
    ${as.length>1?`<h3 style="margin:16px 0 8px">Progress over time</h3>${lineChart(as)}`:''}</div>
   <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><h2>Personal recommendations</h2>${recos(s,last)}</div>
    <div class="panel"><h2>Strengths & areas to improve</h2><p class="small"><b>Strengths:</b> ${esc(s.strengths||'—')}</p><p class="small"><b>To improve:</b> ${esc(s.weaknesses||'—')}</p><p class="small" style="margin:0"><b>Notes:</b> ${esc(s.notes||'—')}</p></div>
   </div></div>
  <div class="grid g2"><div class="panel"><h2>Recent homework</h2><div class="list">${hwl.map(x=>{const r=x.records[id];const st=HW_ST[r.status]||HW_ST.pending;return `<div class="li"><div class="grow"><b class="ellip" style="display:block">${esc(x.title)}</b><span class="muted small">Due ${fmtD(x.due)}${r.comment?' · '+esc(r.comment):''}</span></div>${r.score!==''&&r.score!=null?`<span class="num">${esc(r.score)}/10</span>`:''}<span class="chip ${st[1]}">${st[0]}</span></div>`}).join('')||'<div class="empty">No homework yet.</div>'}</div></div>
   <div class="panel"><div class="ph"><h2>Learning journal</h2></div><div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><input id="histIn" placeholder="Quick note: read aloud with great confidence today…" aria-label="Journal note"><button class="btn" onclick="A.addHist('${id}')" aria-label="Add note">${ic('plus')}</button></div>
    <div class="list">${(s.history||[]).slice().reverse().map(x=>`<div class="li"><span class="muted small num" style="width:60px">${fmtD(x.date).replace(/ \d{4}$/,'')}</span><div class="grow small">${esc(x.text)}</div></div>`).join('')||'<div class="empty">No notes yet.</div>'}</div></div></div>
  ${obs.length?`<div class="panel"><h2>GrapeSEED observations</h2><div class="list">${obs.map(o=>`<div class="li"><span class="muted small num" style="width:90px">${fmtD(o.date)}</span><div class="grow small"><b>${esc(o.lessonLabel||'')}</b> ${esc(o.note||'')}</div><span class="chip">${'★'.repeat(o.rating||0)}</span></div>`).join('')}</div></div>`:''}
  <div class="panel"><h2>Assessment history</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th>${SKILLS.map(s=>`<th title="${s[1]}">${s[1].split(' ')[0]}</th>`).join('')}<th></th></tr></thead><tbody>${as.slice().reverse().map(a=>`<tr><td class="num">${fmtD(a.date)}</td><td>${esc(a.type||'')}</td>${SKILLS.map(([k])=>`<td class="num">${a.scores?.[k]||'—'}</td>`).join('')}<td><button class="icon-btn" onclick="A.addAssess('${id}','${a.id}')" aria-label="Edit">${ic('pencil')}</button></td></tr>`).join('')||`<tr><td colspan="${SKILLS.length+3}" class="muted">None yet</td></tr>`}</tbody></table></div></div>`;
}
A.addHist=id=>{const v=$('#histIn').value.trim();if(!v)return;const s=stu(id);(s.history=s.history||[]).push({date:todayISO(),text:v});save('students');render()};

function lineChart(as){const W=560,H=200,P=30;const xs=i=>P+(as.length===1?0:i*(W-P*2)/(as.length-1));const ys=v=>H-24-(v-1)/4*(H-48);
  const avgPts=as.map((a,i)=>[xs(i),ys(avgScore(a)||1)]);
  const keys=[['vocab','var(--accent)'],['pron','#C98AD6'],['listen','#4F9BD9'],['write','#E0894F']];
  const lines=keys.map(([k,c])=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" stroke-opacity=".55" points="${as.map((a,i)=>xs(i)+','+ys(a.scores?.[k]||1)).join(' ')}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Skill progress chart">${[1,2,3,4,5].map(v=>`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="6" y="${ys(v)+4}">${v}</text>`).join('')}
  ${lines}<polygon fill="var(--accent-soft)" opacity=".6" points="${P},${ys(1)} ${avgPts.map(p=>p.join(',')).join(' ')} ${xs(as.length-1)},${ys(1)}"/><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${avgPts.map(p=>p.join(',')).join(' ')}"/>${avgPts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===avgPts.length-1?5:3}" fill="var(--accent)"/><text x="${p[0]}" y="${H-6}" text-anchor="middle">${fmtD(as[i].date).replace(/ \d{4}$/,'')}</text>`).join('')}</svg>
  <div class="row small muted"><span><span class="dot" style="background:var(--accent)"></span> Average</span>${keys.slice(1).map(([k,c])=>`<span><span class="dot" style="background:${c}"></span> ${SKILLS.find(s=>s[0]===k)[1]}</span>`).join('')}<span><span class="dot" style="background:var(--accent);opacity:.55"></span> Vocabulary</span></div></div>`}
const RECO={vocab:'Review vocabulary for 10 minutes a day with picture cards; play "What\'s the picture?" and "Memory Match" in class.',pron:'Short phonics practice for initial sounds; listen and repeat (shadowing) with read-aloud stories.',fluency:'Encourage full-sentence answers; use speaking cards in pairs.',listen:'Listen to a story twice: first look at the pictures, then answer questions; play "Listen and Choose".',read:'Read one short page aloud each evening, pointing at each word; guess meanings from pictures.',write:'Write three model sentences such as "I like… / I can…"; copy key words carefully.',grammar:'Practise one sentence pattern per lesson with sentence-building games; recast mistakes gently.',partic:'Give small classroom jobs (card helper, score keeper) and praise every raised hand.',hw:'Remind parents of the homework routine; split tasks into 10–15 minute chunks.'};
function recos(s,last){if(!last)return '<p class="muted small" style="margin:0">Recommendations appear after the first assessment.</p>';
  const low=SKILLS.map(([k,l])=>({k,l,v:last.scores?.[k]||0})).filter(x=>x.v>0).sort((a,b)=>a.v-b.v).slice(0,3);
  const top=SKILLS.map(([k,l])=>({k,l,v:last.scores?.[k]||0})).sort((a,b)=>b.v-a.v)[0];
  return `<div class="list">${low.map(x=>`<div class="li" style="align-items:flex-start"><span class="chip ${x.v<3?'warn':'acc'}">${x.l}</span><div class="grow small">${RECO[x.k]}</div></div>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Strongest skill: <b>${top.l}</b> – let this child be a "little helper" in this area.</p>`}
A.addAssess=(sid,aid)=>{const a=aid?S.assessments.find(x=>x.id===aid):{studentId:sid,date:todayISO(),type:'Regular check',scores:{...(latestAssess(sid)?.scores||{})}};
  const sc={...a.scores};
  modal({title:(aid?'Edit assessment – ':'Assessment – ')+(stu(sid)?.name||''),body:`<div class="fgrid"><label class="f">Date<input type="date" id="asD" value="${a.date}"></label><label class="f">Type<select id="asT">${opt(['Regular check','Mid-term test','End-of-term test','Cambridge mock test','Classroom observation'],a.type)}</select></label></div>
   <p class="small muted" style="margin:0">Scored on the Cambridge Young Learners 5-shield scale.</p>
   <div class="list">${SKILLS.map(([k,l])=>`<div class="li"><span style="width:150px">${l}</span><span class="shpick" data-k="${k}">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" aria-label="${i} shields">${shieldSvg(i<=(sc[k]||0))}</button>`).join('')}</span></div>`).join('')}</div>
   <label class="f">Comment<textarea id="asN">${esc(a.note||'')}</textarea></label>`,
   footer:`${aid?`<button class="btn danger" style="margin-right:auto" id="asDel">${ic('trash-2')} Delete</button>`:''}<button class="btn" data-x>Cancel</button><button class="btn pri" id="asSave">${ic('check')} Save assessment</button>`,
   onMount:(m,close)=>{$$('.shpick',m).forEach(p=>p.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=p.dataset.k;sc[k]=+b.dataset.v;$$('button',p).forEach((x,i)=>x.innerHTML=shieldSvg(i<sc[k]))});

  <div class="grid g2">${LES_FIELDS.map(([k,lb])=>l[k]?`<div class="panel" ${k==='script'||k==='objectives'?'style="grid-column:1/-1"':''}><span class="eyebrow">${lb}</span><p style="margin:6px 0 0;white-space:pre-wrap">${esc(l[k])}</p></div>`:'').join('')}</div>`}

let hwCls='';
VIEWS['homework']=()=>{
  if(ARG)return hwDetail(ARG);
  const t=todayISO();

  const rows=list.map(h=>{const ids=hwTargets(h);const c={done:0,partial:0,missing:0,pending:0};ids.forEach(i=>c[h.records?.[i]?.status||'pending']++);return {h,ids,c}});
  const missingAll=[];rows.forEach(({h,ids})=>ids.forEach(i=>{const st=h.records?.[i]?.status;if((st==='missing'||st==='partial')||(!st||st==='pending')&&h.due<t)missingAll.push({h,s:stu(i),st:st||'pending'})}));
  return `${head('Homework','Assign work to a whole class or individual students, track submissions, score and comment.',`<button class="btn" onclick="A.hwReport()">${ic('file-spreadsheet')} Export report</button><button class="btn pri" onclick="A.editHw()">${ic('plus')} Assign homework</button>`)}
  <div class="row"><select id="hwCls" style="width:auto" aria-label="Filter by class">${classOpts(hwCls,'All classes')}</select></div>
  <div class="split"><div class="panel"><h2>Assigned homework</h2><div class="list">${rows.map(({h,ids,c})=>{const pct=ids.length?Math.round((c.done+c.partial*.5)/ids.length*100):0;const late=h.due<t;return `<div class="li" style="cursor:pointer" data-go="homework-${h.id}"><div class="grow"><b class="ellip" style="display:block">${esc(h.title)}</b><span class="muted small">${esc(clsName(h.classId))}${h.scope==='students'?' · '+ids.length+' students':''} · Due ${fmtDs(h.due)}</span><div class="row" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1">${bar(pct,pct<60?'var(--bad)':pct<85?'var(--warn)':'var(--good)')}</div><span class="small num">${c.done}/${ids.length}</span></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${c.missing?`<span class="chip bad">${c.missing} missing</span>`:''}${c.pending?`<span class="chip ${late?'warn':''}">${c.pending} to grade</span>`:''}</div></div>`}).join('')||'<div class="empty">No homework assigned yet.</div>'}</div></div>
  <div class="panel"><h2>Missing or incomplete</h2><div class="list">${missingAll.slice(0,14).map(({h,s,st})=>s?`<div class="li">${avatar(s)}<div class="grow"><b>${esc(s.name)}</b><div class="muted small ellip">${esc(h.title)}</div></div><span class="chip ${HW_ST[st][1]||'warn'}">${HW_ST[st][0]}</span></div>`:'').join('')||'<div class="empty">Nothing is missing.</div>'}</div></div></div>`;
};

   <label class="f full">Instructions<textarea id="hDesc">${esc(h.desc||'')}</textarea></label></div>`,

     if(!id){h.id=uid('h');S.homework.push(h);log(`Assigned "${t}" to ${clsName(h.classId)}`,'clipboard-plus')}save('homework');close();go('homework-'+h.id)}}})};

function gameStage(k){const g=GAMES[k];if(GM.st._g!==k){clearInterval(GM.st.iv);GM.st={_g:k}}const set=getSet(GM.set);let body;try{body=GR[k](set)}catch(e){console.error(e);body='<p>Sorry, this game could not open.</p>'}
  return `${GM.fs?'':`<div class="row" style="justify-content:space-between"><a href="#classroom-games" class="btn ghost sm" onclick="GM.st={}">${ic('arrow-left')} All games</a><span class="muted small">Word set: <b>${esc(set.name)}</b></span></div>`}
  <div class="stage ${GM.fs?'fs':''}" id="stage"><div class="row" style="justify-content:space-between"><h2>${g.e} ${esc(g.t)}</h2><div class="row"><button class="sbtn" style="font-size:1rem;padding:6px 12px" onclick="A.gResetScore()">Reset scores</button><button class="sbtn y" style="font-size:1rem;padding:6px 12px" onclick="A.gReset()">New round</button><button class="sbtn b" style="font-size:1rem;padding:6px 12px" onclick="A.gFs()">${GM.fs?'Exit full screen':'Full screen'}</button>${GM.fs?`<button class="sbtn" style="font-size:1rem;padding:6px 12px" onclick="GM.fs=false;GM.st={};go(isKid()?'kids-games':'classroom-games')">Exit</button>`:''}</div></div>
  ${teamsBar()}<div style="flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center">${body}</div></div>`}

const GR={};
// --- wheel
GR.wheel=set=>{const st=GM.st;if(!st.items){
   const fromCls=GM.src==='students'&&GM.cls?studentsOf(GM.cls).map(s=>({label:s.eng||s.name.split(' ').pop(),full:s.name})):null;
   st.items=fromCls&&fromCls.length?fromCls:shuffle(set.words).slice(0,12).map(w=>({label:w.en,e:w.e}));st.rot=0;st.win=null}
  return `<div class="row" style="justify-content:center"><select id="wSrc" style="width:auto;font-family:var(--f-body)">${opt([['words','Spin words'],['students','Spin student names']],GM.src)}</select>${GM.src==='students'?`<select id="wCls" style="width:auto;font-family:var(--f-body)">${classOpts(GM.cls,'— Choose a class —')}</select>`:''}</div>
  <div class="wheelwrap"><div class="pin"></div><canvas id="wheel" width="600" height="600" style="transform:rotate(${st.rot}deg)"></canvas></div>
  <div style="text-align:center;min-height:90px">${st.win?`<div style="font-size:2.6rem;font-weight:800">${st.win.e?st.win.e+' ':''}${esc(st.win.label)}</div>${st.items.length>2?`<button class="sbtn" style="font-size:1rem" onclick="A.wRemove()">Remove from wheel</button>`:''}`:'<div style="font-size:1.3rem;opacity:.7">Press SPIN to start!</div>'}</div>
  <div style="text-align:center"><button class="sbtn y" style="font-size:1.6rem;padding:12px 40px" onclick="A.wSpin()" id="wBtn">SPIN 🎡</button></div>`};
GAMES.wheel.mount=()=>{const c=$('#wheel');if(!c)return;const st=GM.st;const x=c.getContext('2d');const n=st.items.length;const seg=Math.PI*2/n;const cols=['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'];
  x.clearRect(0,0,600,600);st.items.forEach((it,i)=>{const a0=-Math.PI/2+i*seg;x.beginPath();x.moveTo(300,300);x.arc(300,300,290,a0,a0+seg);x.closePath();x.fillStyle=cols[i%cols.length];if(n%6===1&&i===n-1)x.fillStyle=cols[2];x.fill();x.lineWidth=4;x.strokeStyle='#2B2340';x.stroke();
   x.save();x.translate(300,300);x.rotate(a0+seg/2);x.textAlign='right';x.fillStyle='#2B2340';const fs=n>10?24:30;x.font=`800 ${fs}px "Baloo 2", sans-serif`;x.fillText((it.e?it.e+' ':'')+it.label.slice(0,14),270,fs/3);x.restore()});
  x.beginPath();x.arc(300,300,34,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.lineWidth=5;x.stroke();
  const s=$('#wSrc');if(s)s.onchange=e=>{GM.src=e.target.value;GM.st={};render()};const cs=$('#wCls');if(cs)cs.onchange=e=>{GM.cls=e.target.value;GM.st={};render()}};
A.wSpin=()=>{const st=GM.st;const c=$('#wheel');if(!c||st.spinning)return;st.spinning=true;st.win=null;const add=360*5+Math.random()*360;st.rot+=add;c.style.transition='transform 4.2s cubic-bezier(.17,.67,.12,1)';c.style.transform=`rotate(${st.rot}deg)`;
  let ticks=0;const tk=setInterval(()=>{sfx('tick');if(++ticks>14)clearInterval(tk)},250);
  setTimeout(()=>{st.spinning=false;const n=st.items.length;const segD=360/n;const a=(360-(st.rot%360))%360;st.win=st.items[Math.floor(a/segD)%n];sfx('win');if(st.win&&!GM.src.startsWith('stu'))speak(st.win.label);else if(st.win)speak(st.win.label);render()},4300)};
A.wRemove=()=>{const st=GM.st;st.items=st.items.filter(i=>i!==st.win);st.win=null;render()};

// --- mystery boxes
GR.boxes=set=>{const st=GM.st;if(!st.boxes){const ws=shuffle(set.words);const specials=shuffle([{k:'gift',p:2},{k:'gift',p:3},{k:'bomb',p:-1},{k:'swap'}]);st.boxes=[...Array(12)].map((_,i)=>i<4?specials[i]:{k:'word',w:ws[i%ws.length]});st.boxes=shuffle(st.boxes);st.open=[];st.cur=null;st.ans=false}
  if(st.cur!==null){const b=st.boxes[st.cur];let inner;
    if(b.k==='word')inner=`<div class="bigemo">${emo(b.w)}</div><div style="text-align:center;font-size:1.5rem">${esc(GM.teams[GM.turn]?.n||'')}: What is it?</div><div style="text-align:center;font-size:3rem;font-weight:800;min-height:70px">${st.ans?esc(b.w.en):'? ? ?'}</div>
      <div class="row" style="justify-content:center">${st.ans?'':`<button class="sbtn b" onclick="GM.st.ans=true;speak('${esc(b.w.en).replace(/'/g,"\\'")}');render()">Show answer</button>`}<button class="sbtn g" onclick="A.boxDone(1)">Correct +1 ⭐</button><button class="sbtn p" onclick="A.boxDone(0)">Not yet</button></div>`;
    else if(b.k==='gift')inner=`<div class="bigemo">🎁</div><div style="text-align:center;font-size:3rem;font-weight:800">Gift! +${b.p} points</div><div style="text-align:center"><button class="sbtn g" onclick="A.boxDone(${b.p})">Collect</button></div>`;
    else if(b.k==='bomb')inner=`<div class="bigemo">💣</div><div style="text-align:center;font-size:3rem;font-weight:800">Oh no, a bomb! −1 point</div><div style="text-align:center"><button class="sbtn p" onclick="A.boxDone(-1)">Continue</button></div>`;
    else inner=`<div class="bigemo">🔄</div><div style="text-align:center;font-size:2.4rem;font-weight:800">Swap scores with another team!</div><div class="row" style="justify-content:center">${GM.teams.map((t,i)=>i===GM.turn?'':`<button class="sbtn v" onclick="A.boxSwap(${i})">Swap with ${esc(t.n)}</button>`).join('')}<button class="sbtn" onclick="A.boxDone(0)">Skip</button></div>`;
    return inner}
  return `<div style="text-align:center;font-size:1.3rem"><b>${esc(GM.teams[GM.turn]?.n||'')}</b>, pick a box!</div><div class="boxes">${st.boxes.map((b,i)=>`<button class="mbox ${st.open.includes(i)?'open':''} c-${COLORS[i%6]}" style="background:${['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'][i%6]}" ${st.open.includes(i)?'disabled':''} onclick="A.boxOpen(${i})">${st.open.includes(i)?(b.k==='word'?emo(b.w):b.k==='gift'?'🎁':b.k==='bomb'?'💣':'🔄'):i+1}</button>`).join('')}</div>`};
A.boxOpen=i=>{GM.st.cur=i;GM.st.ans=false;GM.st.open.push(i);sfx('pop');render()};
A.boxDone=p=>{if(p&&GM.teams[GM.turn]){GM.teams[GM.turn].s+=p;p>0?(sfx('win'),confetti(30)):sfx('bad')}GM.st.cur=null;A.gNext();render()};
A.boxSwap=j=>{const a=GM.teams[GM.turn],b=GM.teams[j];[a.s,b.s]=[b.s,a.s];sfx('pop');GM.st.cur=null;A.gNext();render()};

// --- picture reveal
GR.reveal=set=>{const st=GM.st;if(!st.w||st.next){const pool=set.words.filter(w=>w!==st.w);st.w=pick(pool);st.opts=shuffle([st.w,...shuffle(pool.filter(w=>w!==st.w)).slice(0,3)]);st.gone=[];st.done=false;st.bad=[];st.next=false;st.tc=shuffle([...Array(16).keys()])}
  return `<div class="reveal"><span class="rv-emo">${emo(st.w)}</span><div class="tiles">${[...Array(16)].map((_,i)=>`<button class="${st.gone.includes(i)||st.done?'gone':''}" style="background:${['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'][i%6]}" onclick="A.rvTile(${i})">${i+1}</button>`).join('')}</div></div>
  <div class="opts">${st.opts.map((o,i)=>`<button class="sbtn ${st.done&&o===st.w?'right':st.bad.includes(i)?'wrong':''}" onclick="A.rvPick(${i})">${esc(o.en)}</button>`).join('')}</div>
  <div style="text-align:center">${st.done?`<button class="sbtn y" onclick="GM.st.next=true;render()">Next picture ➜</button>`:`<span style="opacity:.75">${esc(GM.teams[GM.turn]?.n||'')}: open a tile, then guess</span>`}</div>`};
A.rvTile=i=>{GM.st.gone.push(i);sfx('pop');render()};
A.rvPick=i=>{const st=GM.st;if(st.done)return;if(st.opts[i]===st.w){st.done=true;A.gWin(Math.max(1,Math.round((16-st.gone.length)/4)));speak(st.w.en)}else{st.bad.push(i);sfx('bad');A.gNext()}render()};

// --- memory
GR.memory=set=>{const st=GM.st;if(!st.cards){const n=window.innerWidth<700?6:8;const ws=shuffle(set.words).slice(0,n);st.cards=shuffle(ws.flatMap((w,i)=>[{p:i,t:'e',w},{p:i,t:'w',w}]));st.up=[];st.done=[];st.lock=false}
  const all=st.done.length===st.cards.length;
  return `${all?'<div style="text-align:center;font-size:2.4rem;font-weight:800">All matched! 🎉</div>':''}<div class="mgrid">${st.cards.map((c,i)=>`<div class="mcard ${st.up.includes(i)||st.done.includes(i)?'flip':''} ${st.done.includes(i)?'done':''}" onclick="A.memFlip(${i})"><div class="fr" style="background:${['#7FD3FF','#FFD447','#FF8FB1','#8EE59B'][i%4]}">?</div><div class="bk">${c.t==='e'?`<span style="font-size:clamp(2.2rem,6vw,4rem)">${emo(c.w)}</span>`:esc(c.w.en)}</div></div>`).join('')}</div>`};
A.memFlip=i=>{const st=GM.st;if(st.lock||st.up.includes(i)||st.done.includes(i))return;st.up.push(i);sfx('tick');
  if(st.up.length===2){const [a,b]=st.up.map(x=>st.cards[x]);if(a.p===b.p){st.done.push(...st.up);st.up=[];if(GM.teams[GM.turn])GM.teams[GM.turn].s++;sfx('ok');speak(a.w.en);if(st.done.length===st.cards.length)setTimeout(()=>{sfx('win');confetti(80)},300)}else{st.lock=true;setTimeout(()=>{st.up=[];st.lock=false;A.gNext();render()},1100)}}
  render()};

// --- listen and choose
GR.listen=set=>{const st=GM.st;if(!st.w||st.next){const pool=set.words;st.w=pick(pool.filter(w=>w!==st.w));st.opts=shuffle([st.w,...shuffle(pool.filter(w=>w!==st.w)).slice(0,3)]);st.done=false;st.bad=[];st.next=false;st.say=true}
  return `<div style="text-align:center"><button class="sbtn y" style="font-size:2rem;padding:16px 36px" onclick="speak('${esc(st.w.en).replace(/'/g,"\\'")}',{rate:.75})">🔊 Listen again</button></div>
  <div class="opts">${st.opts.map((o,i)=>`<button class="sbtn ${st.done&&o===st.w?'right':st.bad.includes(i)?'wrong':''}" style="font-size:clamp(3rem,9vw,5.5rem);padding:10px" onclick="A.lsPick(${i})" aria-label="Choice ${i+1}">${emo(o)}</button>`).join('')}</div>
  <div style="text-align:center;min-height:60px">${st.done?`<div style="font-size:2.4rem;font-weight:800">${esc(st.w.en)}</div><button class="sbtn y" onclick="GM.st.next=true;render()">Next word ➜</button>`:`<span style="opacity:.75">${esc(GM.teams[GM.turn]?.n||'')}\'s turn</span>`}</div>`};
GAMES.listen.mount=()=>{if(GM.st.say){GM.st.say=false;setTimeout(()=>speak(GM.st.w.en,{rate:.75}),350)}};
A.lsPick=i=>{const st=GM.st;if(st.done)return;if(st.opts[i]===st.w){st.done=true;A.gWin()}else{st.bad.push(i);sfx('bad');A.gNext()}render()};

// --- hangman balloons
GR.hangman=set=>{const st=GM.st;if(!st.w||st.next){st.w=pick(set.words.filter(w=>w!==st.w&&/^[a-z ]+$/i.test(w.en)));st.g=[];st.miss=0;st.next=false;st.hint=false}
  const word=st.w.en.toLowerCase();const letters=[...new Set(word.replace(/ /g,''))];const won=letters.every(l=>st.g.includes(l));const lost=st.miss>=6;
  return `<div class="balloons">${[...Array(6)].map((_,i)=>`<span class="${i<st.miss?'pop':''}" style="${i<st.miss?'opacity:0':''}">🎈</span>`).join('')}</div>
  ${st.hint||won||lost?`<div style="text-align:center;font-size:4rem">${emo(st.w)}</div>`:''}
  <div class="blanks">${[...word].map(ch=>ch===' '?'<span style="border:0;width:24px"></span>':`<span>${st.g.includes(ch)||lost?ch:''}</span>`).join('')}</div>
  ${won?`<div style="text-align:center;font-size:2.4rem;font-weight:800">Well done! 🎉</div>`:lost?`<div style="text-align:center;font-size:2rem;font-weight:800">All the balloons popped! The word was "${esc(st.w.en)}"</div>`:''}
  ${won||lost?`<div style="text-align:center"><button class="sbtn y" onclick="GM.st.next=true;render()">Next word ➜</button></div>`:`<div class="keys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(l=>`<button ${st.g.includes(l)?'disabled':''} onclick="A.hmGuess('${l}')">${l}</button>`).join('')}</div><div style="text-align:center"><button class="sbtn" style="font-size:1rem" onclick="GM.st.hint=true;render()">Picture hint 💡</button></div>`}`};
A.hmGuess=l=>{const st=GM.st;st.g.push(l);const word=st.w.en.toLowerCase();if(word.includes(l)){sfx('ok');const letters=[...new Set(word.replace(/ /g,''))];if(letters.every(x=>st.g.includes(x))){A.gWin();speak(st.w.en)}}else{st.miss++;sfx('bad');A.gNext()}render()};

// --- spelling tiles
GR.spell=set=>{const st=GM.st;if(!st.w||st.next){st.w=pick(set.words.filter(w=>w!==st.w&&/^[a-z]+$/i.test(w.en)&&w.en.length<=10));let sh;do{sh=shuffle([...st.w.en.toLowerCase()])}while(sh.join('')===st.w.en.toLowerCase()&&st.w.en.length>1);st.pool=sh.map((c,i)=>({c,i}));st.ans=[];st.next=false;st.res=null}
  const full=st.ans.length===st.w.en.length;
  return `<div style="text-align:center;font-size:5rem">${emo(st.w)}</div>
  <div class="tilesrow">${st.w.en.split('').map((_,i)=>st.ans[i]?`<button class="ltile" style="${st.res==='ok'?'background:#8EE59B':st.res==='bad'?'background:#FF8A80':''}" onclick="A.spBack(${i})">${st.ans[i].c}</button>`:`<span class="ltile slot"></span>`).join('')}</div>
  <div class="tilesrow">${st.pool.map((t,i)=>st.ans.includes(t)?'<span style="width:58px"></span>':`<button class="ltile" style="background:#7FD3FF" onclick="A.spPick(${i})">${t.c}</button>`).join('')}</div>
  <div style="text-align:center">${st.res==='ok'?`<button class="sbtn y" onclick="GM.st.next=true;render()">Next word ➜</button>`:full?`<button class="sbtn g" onclick="A.spCheck()">Check ✔</button>`:`<span style="opacity:.75">${esc(GM.teams[GM.turn]?.n||'')}\'s turn</span>`}</div>`};
A.spPick=i=>{const st=GM.st;st.res=null;st.ans.push(st.pool[i]);sfx('tick');render()};
A.spBack=i=>{const st=GM.st;if(st.res==='ok')return;st.res=null;st.ans.splice(i,1);render()};
A.spCheck=()=>{const st=GM.st;if(st.ans.map(t=>t.c).join('')===st.w.en.toLowerCase()){st.res='ok';A.gWin();speak(st.w.en)}else{st.res='bad';sfx('bad');A.gNext()}render()};

// --- sentence builder
GR.sentence=()=>{const st=GM.st;if(!st.s||st.next){st.s=pick(SENTS.filter(x=>x!==st.s));const ws=st.s[0].split(' ');let sh;do{sh=shuffle(ws.map((w,i)=>({w,i})))}while(sh.every((t,i)=>t.i===i)&&ws.length>1);st.pool=sh;st.ans=[];st.res=null;st.next=false}
  const full=st.ans.length===st.pool.length;
  return `<div style="text-align:center;font-size:4.5rem">${st.s[1]}</div>
  <div class="tilesrow" style="min-height:76px;border-bottom:4px dashed #2B2340;padding-bottom:10px">${st.ans.map((t,i)=>`<button class="sbtn ${st.res==='ok'?'g':st.res==='bad'?'p':'y'}" onclick="A.snBack(${i})">${esc(t.w)}</button>`).join('')}</div>
  <div class="tilesrow">${st.pool.map((t,i)=>st.ans.includes(t)?'':`<button class="sbtn b" onclick="A.snPick(${i})">${esc(t.w)}</button>`).join('')}</div>
  <div style="text-align:center">${st.res==='ok'?`<button class="sbtn y" onclick="GM.st.next=true;render()">Next sentence ➜</button>`:full?`<button class="sbtn g" onclick="A.snCheck()">Check ✔</button>`:''}</div>`};
A.snPick=i=>{const st=GM.st;st.res=null;st.ans.push(st.pool[i]);sfx('tick');render()};
A.snBack=i=>{const st=GM.st;if(st.res==='ok')return;st.res=null;st.ans.splice(i,1);render()};
A.snCheck=()=>{const st=GM.st;if(st.ans.map(t=>t.w).join(' ')===st.s[0]){st.res='ok';A.gWin();speak(st.s[0])}else{st.res='bad';sfx('bad');A.gNext()}render()};

// --- what's missing
GR.missing=set=>{const st=GM.st;if(!st.items||st.next){st.items=shuffle(set.words).slice(0,6);st.phase='look';st.gone=null;st.next=false}
  if(st.phase==='hide')return `<div class="bigemo">🙈</div><div style="text-align:center;font-size:3rem;font-weight:800">Close your eyes!</div>`;
  const shown=st.phase==='guess'?st.items.filter(w=>w!==st.gone):st.items;
  return `<div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${shown.map(w=>`<div class="sbtn" style="cursor:default;text-align:center;box-shadow:none"><div style="font-size:clamp(2.6rem,7vw,4.4rem)">${emo(w)}</div>${esc(w.en)}</div>`).join('')}${st.phase==='guess'?`<div class="sbtn" style="cursor:default;text-align:center;box-shadow:none;border-style:dashed;display:grid;place-items:center;font-size:3rem">${st.reveal?emo(st.gone)+'<div style="font-size:1.3rem">'+esc(st.gone.en)+'</div>':'?'}</div>`:''}</div>
  <div class="row" style="justify-content:center">${st.phase==='look'?`<button class="sbtn y" onclick="A.msHide()">Close your eyes! 🙈</button>`:st.reveal?`<button class="sbtn g" onclick="A.gWin();GM.st.next=true;render()">${esc(GM.teams[GM.turn]?.n||'')} got it +1</button><button class="sbtn y" onclick="GM.st.next=true;A.gNext();render()">New round ➜</button>`:`<button class="sbtn b" onclick="GM.st.reveal=true;speak(GM.st.gone.en);render()">Show the answer</button>`}</div>`};
A.msHide=()=>{const st=GM.st;st.phase='hide';st.reveal=false;render();setTimeout(()=>{st.gone=pick(st.items);st.phase='guess';sfx('pop');render()},2500)};

// --- time bomb
GR.bomb=set=>{const st=GM.st;if(!st.w){st.w=pick(set.words);st.on=false;st.boom=false}
  if(st.boom)return `<div class="bigemo" style="animation:shake .4s 3">💥</div><div style="text-align:center;font-size:3rem;font-weight:800">BOOM! ${esc(GM.teams[GM.turn]?.n||'')} −1</div><div style="text-align:center"><button class="sbtn y" onclick="GM.st={};render()">Play again</button></div>`;
  return `<div class="bigemo">${st.on?emo(st.w):'💣'}</div><div style="text-align:center;font-size:3rem;font-weight:800">${st.on?esc(st.w.en):'Ready?'}</div>
  <div style="text-align:center;opacity:.8;font-size:1.2rem">${st.on?`<b>${esc(GM.teams[GM.turn]?.n||'')}</b>: say a sentence with this word, then press Pass!`:'The bomb goes off at a surprise moment (10–30 seconds).'}</div>
  <div style="text-align:center">${st.on?`<button class="sbtn g" style="font-size:2rem;padding:14px 40px" onclick="A.bmPass()">Pass! ➜</button>`:`<button class="sbtn p" style="font-size:2rem;padding:14px 40px" onclick="A.bmStart()">Start 💣</button>`}</div>`};
A.bmStart=()=>{const st=GM.st;st.on=true;const total=10000+Math.random()*20000;const t0=Date.now();clearInterval(st.iv);
  st.iv=setInterval(()=>{if(!gameOn('bomb')){clearInterval(st.iv);return}const left=total-(Date.now()-t0);sfx('tick');if(left<=0){clearInterval(st.iv);st.boom=true;if(GM.teams[GM.turn])GM.teams[GM.turn].s--;sfx('bad');sfx('bad');render()}},Math.max(180,600));render()};
A.bmPass=()=>{const st=GM.st;st.w=pick(getSet(GM.set).words.filter(w=>w!==st.w));A.gNext();sfx('pop');render()};

// --- flash cards
GR.flash=set=>{const st=GM.st;if(!st.list){st.list=shuffle(set.words);st.i=0;st.show=false;st.auto=false}
  const w=st.list[st.i%st.list.length];
  return `<div class="bigemo" style="cursor:pointer" onclick="GM.st.show=!GM.st.show;render()">${emo(w)}</div><div style="text-align:center;font-size:3.4rem;font-weight:800;min-height:80px">${st.show?esc(w.en):'<span style="opacity:.35">tap the picture to show the word</span>'}</div>
  <div class="row" style="justify-content:center"><button class="sbtn" onclick="A.flMove(-1)">◀</button><button class="sbtn b" onclick="speak('${esc(w.en).replace(/'/g,"\\'")}');GM.st.show=true;render()">🔊 Say it</button><button class="sbtn ${st.auto?'p':'g'}" onclick="A.flAuto()">${st.auto?'⏸ Pause':'▶ Auto play'}</button><button class="sbtn" onclick="A.flMove(1)">▶</button></div>
  <div style="text-align:center;opacity:.7">${st.i%st.list.length+1}/${st.list.length}</div>`};
A.flMove=d=>{const st=GM.st;st.i=(st.i+d+st.list.length)%st.list.length;st.show=false;render()};
A.flAuto=()=>{const st=GM.st;st.auto=!st.auto;clearInterval(st.iv);if(st.auto){const step=()=>{if(!gameOn('flash')||!st.auto){clearInterval(st.iv);return}const w=st.list[st.i%st.list.length];if(!st.show){st.show=true;speak(w.en)}else{st.i=(st.i+1)%st.list.length;st.show=false}render()};step();st.iv=setInterval(step,2200)}render()};

  else{const sc=st.scenes[SP.i];const words=sc.t.split(/\s+/);
   inner=`<div class="scene bg-${sc.bg}" key="${SP.i}">${(sc.d||[]).map(([e,x,y])=>`<span class="deco" style="left:${x}%;top:${y}%">${e}</span>`).join('')}<div class="actors">${(sc.a||[]).map(([e,an])=>`<span class="actor ${an||''}">${e}</span>`).join('')}</div><div class="caption" id="cap">${words.map((w,i)=>`<span class="w ${SP.hl===i?'hl':''}" data-i="${i}" onclick="speak(${esc(JSON.stringify(w.replace(/[^\w']/g,'')))})">${esc(w)}</span>`).join(' ')}</div></div>`}
  return `${SP.fs?'':`<div class="row" style="justify-content:space-between"><a href="#stories" class="btn ghost sm">${ic('arrow-left')} All stories</a><div class="row">${st.custom?`<button class="btn sm" onclick="A.editStory('${st.id}')">${ic('pencil')} Edit story</button>`:`<button class="btn sm" onclick="A.copyStory('${st.id}')">${ic('copy')} Copy to edit</button>`}<button class="btn sm" onclick="A.storyWs('${st.id}')">${ic('file-text')} Make a reading worksheet</button></div></div>`}
  <div class="story ${SP.fs?'fs':''}" id="storyBox">${inner}<span class="pg">${SP.quiz?'Questions':`${SP.i+1}/${n}`}</span>
   <div class="sctl"><button onclick="A.spGo(-1)" aria-label="Previous scene">${ic('chevron-left')}</button><button onclick="A.spRead()" aria-label="Read aloud">${ic('volume-2')}</button><button onclick="A.spAuto()" aria-label="${SP.auto?'Pause':'Auto play'}">${ic(SP.auto?'pause':'play')}</button><button onclick="A.spGo(1)" aria-label="Next scene">${ic('chevron-right')}</button><button onclick="SP.fs=!SP.fs;render()" aria-label="Full screen">${ic(SP.fs?'minimize-2':'maximize-2')}</button></div></div>
  ${SP.fs?'':`<div class="split"><div class="panel"><h2>${esc(st.title)}</h2><p class="muted small" style="margin:4px 0 10px">${esc(st.level||'')} · ${esc(st.topic||'')}. Press ▶ to play it like a film: each sentence is read aloud with words highlighted, then the next scene appears. Tap a word to hear it alone.</p>
   <div class="row">${st.scenes.map((s,i)=>`<button class="chip" style="cursor:pointer;border:1px solid ${i===SP.i&&!SP.quiz?'var(--accent)':'var(--line)'}" onclick="SP.quiz=false;SP.i=${i};SP.hl=-1;render()">Scene ${i+1}</button>`).join('')}<button class="chip acc" style="cursor:pointer" onclick="SP.quiz=true;speechSynthesis&&speechSynthesis.cancel();render()">Questions</button></div></div>
   <div class="panel"><h2>Full story text</h2><ol class="small" style="margin:0;padding-left:20px">${st.scenes.map(s=>`<li>${esc(s.t)}</li>`).join('')}</ol></div></div>`}`}
A.spGo=d=>{const st=allStories().find(s=>s.id===SP.id);if(!st)return;try{speechSynthesis.cancel()}catch(e){}SP.hl=-1;
  if(SP.quiz){if(d<0){SP.quiz=false;SP.i=st.scenes.length-1}}else{const ni=SP.i+d;if(ni>=st.scenes.length){SP.quiz=true;SP.auto=false}else SP.i=Math.max(0,ni)}render()};
A.spRead=(after)=>{const st=allStories().find(s=>s.id===SP.id);if(!st||SP.quiz)return;const text=st.scenes[SP.i].t;const words=text.split(/\s+/);const starts=[];let p=0;words.forEach(w=>{const at=text.indexOf(w,p);starts.push(at);p=at+w.length});
  const mark=i=>{SP.hl=i;$$('#cap .w').forEach(el=>el.classList.toggle('hl',+el.dataset.i===i))};
  const u=speak(text,{rate:.8,onboundary:e=>{const ci=e.charIndex;let wi=0;starts.forEach((s,i)=>{if(s<=ci)wi=i});mark(wi)},onend:()=>{mark(-1);after&&after()}});
  if(!u){let i=0;const iv=setInterval(()=>{mark(i++);if(i>words.length){clearInterval(iv);mark(-1);after&&after()}},420)}};
A.spAuto=()=>{SP.auto=!SP.auto;if(!SP.auto){try{speechSynthesis.cancel()}catch(e){}render();return}
  const step=()=>{if(!SP.auto||!['stories','kids-story'].includes(ROUTE)||SP.quiz)return;A.spRead(()=>setTimeout(()=>{if(!SP.auto||!['stories','kids-story'].includes(ROUTE))return;A.spGo(1);setTimeout(step,500)},1100))};render();setTimeout(step,300)};
A.spAns=(qi,o)=>{const st=allStories().find(s=>s.id===SP.id);SP.ans[qi]=o;if(o===st.q[qi][1]){sfx('ok');if(Object.keys(SP.ans).length===st.q.length&&st.q.every((q,i)=>SP.ans[i]===q[1]))confetti(70)}else sfx('bad');render()};

  modal({title:id?'Edit story':'Write a new story',wide:true,body:`<div class="fgrid"><label class="f">Story title<input id="sT" value="${esc(s.title)}" placeholder="e.g. The Lost Kitten"></label><label class="f">Level<select id="sL">${opt(LEVELS,s.level)}</select></label><label class="f">Topic<input id="sTp" value="${esc(s.topic||'')}"></label><label class="f">Cover emoji<input id="sC" value="${esc(s.cover||'📖')}"></label></div>
   <div id="scList" style="display:flex;flex-direction:column;gap:10px">${s.scenes.map(sceneHtml).join('')}</div><button type="button" class="btn" id="scAdd">${ic('plus')} Add scene</button>
   <label class="f">End-of-story questions. One per line: Question | correct answer | wrong answer 1 | wrong answer 2<textarea id="sQ" rows="4" placeholder="What colour is the ball? | red | blue | green">${esc((s.q||[]).map(q=>[q[0],q[1],...q[2]].join(' | ')).join('\n'))}</textarea></label>
   <p class="small muted" style="margin:0">Tip for Windows: press the Windows key + full stop (.) to open the emoji panel.</p>`,
   footer:`${id?`<button class="btn danger" style="margin-right:auto" id="sDel">${ic('trash-2')} Delete story</button>`:''}<button class="btn" data-x>Cancel</button><button class="btn pri" id="sSave">${ic('check')} Save story</button>`,
   onMount:(m,close)=>{const anims=['a-enter','a-bounce','a-wiggle','a-float','a-walk',''];
    const collect=()=>$$('[data-sc]',m).map((p,i)=>{const g=k=>$(`[data-k="${k}"]`,p).value;const em=v=>[...v.split(/\s+/)].filter(Boolean);return {bg:g('bg'),a:em(g('a')).map((e,j)=>[e,anims[(i+j)%anims.length]]),d:em(g('d')).map((e,j)=>[e,[8,78,40,20,64][j%5],[6,10,4,14,8][j%5]]),t:g('t').trim()}});
    const bind=()=>$$('[data-del]',m).forEach(b=>b.onclick=()=>{const sc=collect();if(sc.length<2)return toast('A story needs at least one scene');sc.splice(+b.dataset.del,1);$('#scList',m).innerHTML=sc.map(sceneHtml).join('');icons();bind()});bind();
    $('#scAdd',m).onclick=()=>{const sc=collect();sc.push({bg:sc[sc.length-1]?.bg||'park',a:[],d:[],t:''});$('#scList',m).innerHTML=sc.map(sceneHtml).join('');icons();bind()};
    id&&($('#sDel',m).onclick=()=>{close();confirmBox('Delete this story?',()=>{S.stories=S.stories.filter(x=>x.id!==id);save('stories');go('stories')})});
    $('#sSave',m).onclick=()=>{const t=$('#sT',m).value.trim();if(!t)return toast('Please give the story a title');const sc=collect().filter(x=>x.t);if(!sc.length)return toast('Please write text for at least one scene');
     const q=$('#sQ',m).value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(x=>x.length>=3&&x[0]).map(x=>[x[0],x[1],x.slice(2).filter(Boolean)]);

// ================= WORKSHEET STUDIO =================
const WS_TYPES=[['vocab','Vocabulary – look and write'],['match','Match pictures to words'],['mcq','Multiple choice'],['missing','Missing letters'],['unscramble','Look and unscramble (Cambridge)'],['tickcross','Tick or cross (Starters R&W Part 1)'],['order','Sentence order'],['reading','Story reading comprehension'],['phonics','Phonics – circle the sound'],['speaking','Speaking cards (print and cut)'],['colouring','Colour and write'],['bingo','Class bingo cards'],['ai','Cambridge practice with AI']];
const WS={type:'vocab',title:'',set:'animals',ph:'a (cat)',story:'st-ball',n:8,diff:'mid',img:true,key:true,data:null,aiLevel:'Starters',aiTopic:'',aiKind:'Multiple choice',editId:null};
const PLURAL=['grapes','shoes','socks','jeans','glasses','scissors'],UNCOUNT=['milk','water','rice','bread','paint','rain','snow','wind','ice cream'];
function sentenceFor(word,setId){if(setId==='colours')return `It is ${word}.`;if(setId==='actions')return `She can ${word}.`;if(setId==='numbers')return `This is number ${word}.`;
  if(PLURAL.includes(word))return `These are ${word}.`;if(UNCOUNT.includes(word))return `This is ${word}.`;return `This is ${/^[aeiou]/i.test(word)?'an':'a'} ${word}.`}
const SPK=["What's this?",'Do you like it?','What colour is it?','Is it big or small?','Spell the word!','Make a sentence!'];
function wsGen(){const set=getSet(WS.set);const n=+WS.n||8;const ws=shuffle(set.words).slice(0,Math.min(n,set.words.length));const d={};
  switch(WS.type){
   case 'vocab':d.items=ws.map(w=>({w}));break;
   case 'match':d.items=ws.slice(0,Math.min(n,8));d.right=shuffle(d.items.map((_,i)=>i));break;
   case 'mcq':d.items=ws.map(w=>({w,opts:shuffle([w.en,...shuffle(set.words.filter(x=>x!==w)).slice(0,2).map(x=>x.en)])}));break;
   case 'missing':d.items=ws.map(w=>{const ch=[...w.en];const idx=[...ch.keys()].filter(i=>/[a-z]/i.test(ch[i]));const k=WS.diff==='easy'?1:WS.diff==='mid'?Math.max(1,Math.round(idx.length/3)):Math.max(2,Math.ceil(idx.length/2));const hide=shuffle(idx).slice(0,Math.min(k,idx.length));return {w,mask:ch.map((c,i)=>hide.includes(i)?'_':c).join('')}});break;
   case 'unscramble':d.items=ws.filter(w=>/^[a-z]+$/i.test(w.en)).map(w=>{let s,t=0;do{s=shuffle([...w.en.toLowerCase()]).join('')}while(s===w.en.toLowerCase()&&t++<10);return {w,s}});break;
   case 'tickcross':d.items=ws.map(w=>{const ok=Math.random()<.5;const other=pick(set.words.filter(x=>x!==w));return {w,ok,text:sentenceFor(ok?w.en:other.en,set.id)}});break;
   case 'order':d.items=shuffle(SENTS).slice(0,Math.min(n,10)).map(([s,e])=>({s,e,parts:shuffle(s.replace(/[.?!]$/,'').split(' '))}));break;
   case 'reading':{const st=allStories().find(s=>s.id===WS.story)||STORIES[0];d.story={title:st.title,cover:st.cover,text:st.scenes.map(s=>s.t)};d.q=(st.q||[]).map(q=>({q:q[0],a:q[1],opts:shuffle([q[1],...q[2]])}));
     d.gap=shuffle(st.scenes.map(s=>s.t)).slice(0,3).map(t=>{const ws2=t.split(' ');const cand=ws2.map((w,i)=>[w.replace(/[^\w]/g,''),i]).filter(([w])=>w.length>=4);if(!cand.length)return null;const [w,i]=pick(cand);ws2[i]=ws2[i].replace(w,'__________');return {t:ws2.join(' '),a:w}}).filter(Boolean);break}
   case 'phonics':{const target=PHONICS[WS.ph]||[];const others=Object.entries(PHONICS).filter(([k])=>k!==WS.ph).flatMap(([,v])=>v).filter(w=>!target.includes(w));const tg=shuffle(target).slice(0,Math.min(6,Math.max(3,Math.ceil(n/2))));d.items=shuffle([...tg.map(w=>({w,t:1})),...shuffle(others).slice(0,Math.max(3,n-tg.length)).map(w=>({w,t:0}))]);d.sound=WS.ph;break}
   case 'speaking':d.items=ws.slice(0,8).map(w=>({w,p:pick(SPK)}));break;
   case 'colouring':d.items=ws.slice(0,6);break;
   case 'bingo':d.cards=[...Array(4)].map(()=>shuffle(set.words).slice(0,9));d.call=set.words;break;
   case 'ai':d.items=WS.data?.items||[];d.instr=WS.data?.instr||'';break;
  }
  WS.data=d}
function wsTitleDefault(){const t=WS_TYPES.find(x=>x[0]===WS.type)?.[1]||'';const set=getSet(WS.set);return WS.type==='reading'?'Reading: '+(allStories().find(s=>s.id===WS.story)?.title||''):WS.type==='phonics'?'Phonics: '+WS.ph:WS.type==='order'?'Sentence building':(set.name+' – '+t.split('–')[0].trim())}

   case 'unscramble':body=`<p class="instr">Look at the pictures and the letters. Write the words.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">${d.items.map(({w,s},i)=>`<div class="q"><div class="row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b>${E(w)}<span style="font-size:22px;letter-spacing:8px">${esc(s)}</span></div><div style="margin-left:34px;margin-top:6px">${'<span style="display:inline-block;width:26px;border-bottom:2px solid #333;margin-right:6px;height:28px"></span>'.repeat(w.en.length)}</div></div>`).join('')}</div>`;key=d.items.map(({w},i)=>`${i+1}. ${w.en}`).join(' · ');break;
   case 'tickcross':body=`<p class="instr">Look and read. Put a tick (✓) or a cross (✗) in the box.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">${d.items.map(({w,text},i)=>`<div class="q row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b><span class="emo">${emo(w)}</span><span style="flex:1">${esc(text)}</span><span style="width:36px;height:36px;border:2px solid #333;border-radius:6px;display:inline-block"></span></div>`).join('')}</div>`;key=d.items.map(({ok},i)=>`${i+1} ${ok?'✓':'✗'}`).join(' · ');break;
   case 'order':body=`<p class="instr">Put the words in order. Write the sentences.</p>${d.items.map(({e,parts},i)=>`<div class="q"><div class="row" style="gap:10px"><b>${i+1}.</b>${img?`<span style="font-size:30px">${e}</span>`:''}<span style="font-size:19px">${parts.map(esc).join(' &nbsp;/&nbsp; ')}</span></div><div style="border-bottom:2px solid #333;height:34px;margin-left:30px"></div></div>`).join('')}`;key=d.items.map(({s},i)=>`${i+1}. ${esc(s)}`).join('<br>');break;
   case 'reading':body=`<p class="instr">Read the story.</p><div class="box" style="text-align:left;font-size:18px;line-height:1.7"><div style="text-align:center;font-size:40px">${esc(d.story.cover)}</div><b>${esc(d.story.title)}</b><br>${d.story.text.map(esc).join(' ')}</div>
     <p class="instr">A. Read and circle the correct answer.</p>${d.q.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q.q)}<div style="margin-left:24px">${q.opts.map((o,j)=>`${L[j]}) ${esc(o)}`).join('&nbsp;&nbsp;&nbsp;&nbsp;')}</div></div>`).join('')}
     ${d.gap.length?`<p class="instr">B. Read and complete the sentences.</p>${d.gap.map((g,i)=>`<div class="q"><b>${i+1}.</b> ${esc(g.t)}</div>`).join('')}`:''}`;
     key='A: '+d.q.map((q,i)=>`${i+1}${L[q.opts.indexOf(q.a)]}`).join(' · ')+(d.gap.length?' &nbsp; B: '+d.gap.map((g,i)=>`${i+1}. ${esc(g.a)}`).join(' · '):'');break;
   case 'phonics':{const snd=d.sound.split(' ')[0];body=`<p class="instr">Say the words. Circle the pictures with the sound "${esc(snd)}" ${esc(d.sound.includes('(')?d.sound.slice(d.sound.indexOf('(')):'')}.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">${d.items.map(({w})=>`<div class="box"><div style="font-size:56px">${PH_EMO[w]||'🔤'}</div><div style="font-size:18px">${cfg.diff==='hard'?'_'.repeat(w.length):esc(w)}</div></div>`).join('')}</div>`;key='With the sound "'+esc(snd)+'": '+d.items.filter(x=>x.t).map(x=>x.w).join(', ');break}
   case 'speaking':body=`<p class="instr">Speaking cards – cut and play in pairs. ✂</p><div class="cards">${d.items.map(({w,p})=>`<div class="scard"><div style="font-size:72px">${emo(w)}</div><b style="font-size:26px">${esc(w.en)}</b><span style="font-size:16px">${esc(p)}</span></div>`).join('')}</div>`;break;

     :`${greet}Here is ${nm}'s progress this week in ${c?.name||'class'}:\n• Attendance: ${at??'—'}%\n• Homework completed: ${h.rate??'—'}% (${h.done}/${h.total})\n${top.length?`• Strengths: ${topEn}.\n`:''}${low.length?`• To work on: ${lowEn}.\n`:''}${low[0]?`\nAt home, you could ${RECO_EN[low[0].k]}.\n`:''}${note}${sign}`;
   case 'feedback':return vi?`${greet}Cô ${T} muốn chia sẻ đôi điều về ${nm}.\n${top.length?`Con đang làm rất tốt phần ${topVi}, cô rất vui khi thấy con tiến bộ.\n`:''}${low.length?`Phần ${lowVi} con cần luyện thêm một chút. Ở lớp cô sẽ hỗ trợ con, ở nhà anh/chị có thể giúp con: ${RECO[low[0].k].charAt(0).toLowerCase()+RECO[low[0].k].slice(1)}\n`:''}${last?.note?`Nhận xét của cô: ${last.note}\n`:''}${note}${sign}`

const GUEST={stars:0,badges:[],done:{},watched:[],favV:[],favG:[],recent:[],playlist:[],day:{date:todayISO(),videos:0,games:0,words:0,claimed:[]},wins:0,stories:0,words:0,avatar:'bear'};
const kp=()=>KP()||GUEST;
function award(n,why,opts={}){const p=kp();n=Math.max(0,+n||0);p.stars=(p.stars||0)+n;
  if(why==='video'){p.day.videos++}if(why==='game'){p.day.games++}if(why==='words'){p.day.words+=opts.count||1;p.words+=opts.count||1}
  if(KS.ctx&&KS.ctx.kind===why){const key=KS.ctx.world+':'+KS.ctx.step;if(!p.done[key]){p.done[key]=todayISO();const w=WORLDS.find(x=>x.id===KS.ctx.world);n+=+S.settings.starsMission||3;p.stars+=+S.settings.starsMission||3;setTimeout(()=>toast(`Mission complete in ${w?.name||'your world'}!`),900);
    if(MISSIONS.every((_,i)=>p.done[KS.ctx.world+':'+i]))earnBadge('world-'+KS.ctx.world)}KS.ctx=null}
  const thr=[['first-star',1],['stars-10',10],['stars-50',50],['stars-100',100]];thr.forEach(([b,t])=>{if(p.stars>=t)earnBadge(b)});
  if(p.watched.length>=5)earnBadge('video-explorer');if(p.wins>=10)earnBadge('game-champ');if(p.stories>=3)earnBadge('bookworm');if(p.words>=30)earnBadge('word-wizard');
  if(n>0){starBurst(n)}if(KP())save('kidprogress');const sc=$('#kStars');if(sc)sc.textContent=p.stars}
function earnBadge(b){const p=kp();if(p.badges.includes(b))return;p.badges.push(b);const B=BADGES.find(x=>x[0]===b);if(B)setTimeout(()=>{if(!isKid())return;sfx('win');confetti(70);kidPop(`<div style="text-align:center">${mascot(p.avatar||'bear',110,'bob')}<h2 class="k-h2">New badge!</h2><div class="k-badge big">${ic(B[3])}</div><p class="k-lead"><b>${esc(B[1])}</b><br>${esc(B[2])}</p></div>`)},600)}
function starBurst(n){sfx('ok');const d=document.createElement('div');d.className='starburst';d.setAttribute('role','status');d.innerHTML=`${starSvg(30)} +${n}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}

function feedList(f){const p=kp();const all=vids().filter(v=>v.short||f==='stories');const day=Math.floor(Date.now()/864e5);const rot=a=>a.length?[...a.slice(day%a.length),...a.slice(0,day%a.length)]:a;
  let L;switch(f){case 'new':L=all.filter(v=>!p.watched.includes(v.id));break;case 'today':L=rot(all);break;case 'songs':L=all.filter(v=>['songs','rhymes','numbers','colors','alphabet'].includes(v.cat));break;case 'animals':L=all.filter(v=>v.cat==='animals'||v.col==='animals');break;case 'phonics':L=all.filter(v=>['phonics','alphabet','pronunciation'].includes(v.cat));break;case 'stories':L=vids().filter(v=>['stories'].includes(v.cat));break;case 'grapeseed':L=all.filter(v=>v.cat==='grapeseed'||v.col==='grapeseed');break;
   default:{const s=kidStu();const lv=s?.level;const assigned=s?S.homework.filter(h=>h.videoId&&hwTargets(h).includes(s.id)).map(h=>h.videoId):[];L=[...all.filter(v=>assigned.includes(v.id)),...rot(all.filter(v=>!assigned.includes(v.id)&&(!lv||!v.level||v.level===lv||v.level==='Pre-school'))),...all.filter(v=>lv&&v.level&&v.level!==lv&&v.level!=='Pre-school')]}}
  return [...new Map(L.map(v=>[v.id,v])).values()]}

    <div class="reel-count">${i+1} / ${list.length}</div></section>`).join('')}

  if(v&&Date.now()-KR.t0>15000){const p=kp();if(!p.watched.includes(v.id))p.watched.push(v.id);award(+S.settings.starsVideo||1,'video')}KR.playing=-1;icons()};

A.favV=id=>{const p=kp();p.favV=p.favV.includes(id)?p.favV.filter(x=>x!==id):[id,...p.favV];if(KP())save('kidprogress');toast(p.favV.includes(id)?'Saved to your favourites':'Removed from favourites');render()};
A.plV=id=>{const p=kp();p.playlist=p.playlist.includes(id)?p.playlist.filter(x=>x!==id):[...p.playlist,id];if(KP())save('kidprogress');toast(p.playlist.includes(id)?'Added to your playlist':'Removed from your playlist');render()};
VIEWS['kids-reels:after']=()=>{const r=$('#reels');if(!r)return;KR.playing=-1;
  const io=new IntersectionObserver(es=>es.forEach(e=>{const i=+e.target.dataset.i;if(e.isIntersecting&&e.intersectionRatio>.6){KR.i=i;KR.seen.add(i)}else if(i===KR.playing&&e.intersectionRatio<.4)A.reelStop()}),{root:r,threshold:[.4,.6,.9]});$$('.reel',r).forEach(s=>io.observe(s));
  r.onkeydown=e=>{if(['ArrowDown','PageDown','j'].includes(e.key)){e.preventDefault();A.reelGo(1)}else if(['ArrowUp','PageUp','k'].includes(e.key)){e.preventDefault();A.reelGo(-1)}else if(e.key===' '||e.key==='Enter'){if(e.target===r){e.preventDefault();KR.playing===KR.i?A.reelStop():A.reelPlay(KR.i)}}};
  r.focus({preventScroll:true})};

  const steps=MISSIONS.map(([k,t,i],j)=>({k,t,i,j,done:!!p.done[w.id+':'+j]}));const all=steps.every(s=>s.done);
  return `<a class="k-back" href="#kids-adventure">${ic('arrow-left')} All worlds</a><section class="k-colhead" style="background:${w.bg}">${mascot(w.m,120,'bob')}<div><h1 class="k-h1">${esc(w.name)}</h1><p class="k-lead">${esc(w.d)}</p><span class="k-pill">${ic('book-open')} Words: ${esc(getSet(w.set).name)}</span></div></section>
  <div class="k-steps">${steps.map(s=>`<div class="k-step ${s.done?'done':''}"><span class="k-stepn">${s.done?ic('check'):s.j+1}</span>${ic(s.i)}<b>${s.t}</b><small>${s.k==='watch'?esc(v?.title||''):s.k==='words'?'Flashcards: '+esc(getSet(w.set).name):s.k==='game'?esc(GAMES[w.game].t):s.k==='story'?esc(allStories().find(x=>x.id===w.story)?.title||''):'Multiple choice quiz'}</small>${s.done?'<span class="k-claimed">Done!</span>':`<button class="k-btn y sm" onclick="A.mStart('${w.id}',${s.j})">Start</button>`}</div>`).join('')}</div>
  ${all?`<div class="k-card" style="text-align:center">${mascot(w.m,100,'bob')}<h2 class="k-h2">You are the ${esc(w.name)} Hero!</h2><button class="k-btn y" onclick="A.cert('${w.id}')">${ic('award')} Download my certificate</button></div>`:''}`};
A.mStart=(wid,j)=>{const w=WORLDS.find(x=>x.id===wid);const kind=MISSIONS[j][0];const v=vids().find(x=>x.cat===w.cat&&canEmbed(x))||vids().find(x=>x.cat===w.cat)||vids()[0];
  const map={watch:['video','kids-video-'+(v?.id||'')],words:['words','kids-play-flash'],game:['game','kids-play-'+w.game],story:['story','kids-story-'+w.story],quiz:['game','kids-play-quiz']};const [k,r]=map[kind];
  KS.ctx={world:wid,step:j,kind:k,set:w.set};KG.set=w.set;GM.set=w.set;GM.st={};if(kind==='words')toast('Look and listen to 5 words to finish this mission');go(r)};
const _flMove=A.flMove;A.flMove=d=>{_flMove(d);if(isKid()){const st=GM.st;st.seen=(st.seen||0)+1;if(st.seen%5===0)award(1,'words',{count:5})}};
A.cert=wid=>{const w=WORLDS.find(x=>x.id===wid);const s=kidStu();const inner=`<div class="sheet" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:14px solid #FFD58A;font-family:'Fredoka','Baloo 2',sans-serif;gap:14px">${mascot(w.m,150)}<h1 style="font-size:46px;margin:0">Certificate of Achievement</h1><p style="font-size:22px;margin:0">This certificate is proudly presented to</p><p style="font-size:44px;font-weight:700;margin:0;color:#6B4FD8">${esc(kidName(s))}</p><p style="font-size:22px;margin:0">for completing every mission in <b>${esc(w.name)}</b></p><p style="font-size:18px;margin:10px 0 0">${fmtD(todayISO())}</p><p style="margin-top:50px;font-size:18px">______________________<br>Teacher ${esc(S.settings.teacher||'Flora')}</p><p style="font-size:14px;color:#888">Flora's Little English World</p></div>`;download(`certificate-${w.id}.html`,printable('Certificate',inner),'Certificate (open it → Print)')};
