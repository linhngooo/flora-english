VIEWS['tro-choi']=()=>{
  if(ARG&&GAMES[ARG])return gameStage(ARG);
  const sets=wordSets();
  return `${head('Trò chơi lớp học','Chọn bộ từ và số đội, rồi bấm vào trò chơi. Bấm nút toàn màn hình khi chiếu lên TV hoặc máy chiếu.')}
  <div class="panel"><div class="fgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
   <label class="f">Bộ từ vựng<select id="gSet">${opt(sets.map(s=>[s.id,s.name+' · '+s.words.length+' từ']),GM.set)}</select></label>
   <label class="f">Số đội<select id="gN">${opt([['1','1 (không chia đội)'],['2','2 đội'],['3','3 đội'],['4','4 đội']],String(GM.teams.length))}</select></label>
   <label class="f">Tên các đội (cách nhau dấu phẩy)<input id="gNames" value="${esc(GM.teams.map(t=>t.n).join(', '))}"></label>
  </div><p class="small muted" style="margin:10px 0 0">Muốn dùng từ của bài đang dạy? Vào <a href="#thu-vien">Thư viện</a> → "Bộ từ vựng mới", bộ từ sẽ hiện ở đây.</p></div>
  <div class="gametiles">${Object.entries(GAMES).map(([k,g])=>`<button class="gtile c-${g.c}" data-go="tro-choi-${k}"><span class="ge">${g.e}</span><b>${g.t}</b><span class="small" style="opacity:.85">${g.d}</span></button>`).join('')}</div>
  <div class="panel"><h2>Xem trước bộ từ: ${esc(getSet(GM.set).name)}</h2><div class="row" style="gap:8px">${getSet(GM.set).words.map(w=>`<button class="chip" style="border:1px solid var(--line);cursor:pointer;font-size:.9rem;padding:4px 10px" onclick="speak('${esc(w.en).replace(/'/g,"\\'")}')">${emo(w)} ${esc(w.en)}</button>`).join('')}</div></div>`;
};
VIEWS['tro-choi:after']=()=>{
  const s=$('#gSet');if(s){s.onchange=e=>{GM.set=e.target.value;GM.st={};render()};
    const sync=()=>{const n=+$('#gN').value;const names=$('#gNames').value.split(',').map(x=>x.trim()).filter(Boolean);GM.teams=[...Array(n)].map((_,i)=>({n:names[i]||['Đội Sao','Đội Mây','Đội Nắng','Đội Gió'][i],s:0}));GM.turn=0};
    $('#gN').onchange=()=>{sync();render()};$('#gNames').onchange=sync}
  if(ARG&&GAMES[ARG]&&GAMES[ARG].mount)GAMES[ARG].mount();
};
function teamsBar(){if(GM.teams.length<2&&GM.teams[0])return `<div class="teams"><div class="team turn"><span class="tn">${esc(GM.teams[0].n||'Cả lớp')}</span><button onclick="A.gScore(0,-1)" aria-label="Trừ điểm">−</button><span class="ts">${GM.teams[0].s}</span><button onclick="A.gScore(0,1)" aria-label="Cộng điểm">+</button></div></div>`;
  return `<div class="teams">${GM.teams.map((t,i)=>`<div class="team ${GM.turn===i?'turn':''}" onclick="if(!event.target.closest('button')){GM.turn=${i};render()}" style="cursor:pointer"><span class="tn">${esc(t.n)}</span><button onclick="A.gScore(${i},-1)" aria-label="Trừ điểm">−</button><span class="ts">${t.s}</span><button onclick="A.gScore(${i},1)" aria-label="Cộng điểm">+</button></div>`).join('')}</div>`}
A.gScore=(i,d)=>{GM.teams[i].s=Math.max(-99,GM.teams[i].s+d);sfx(d>0?'ok':'bad');render()};
A.gWin=(pts=1)=>{if(GM.teams[GM.turn])GM.teams[GM.turn].s+=pts;sfx('win');confetti(50)};
A.gNext=()=>{GM.turn=(GM.turn+1)%Math.max(1,GM.teams.length)};
A.gFs=()=>{GM.fs=!GM.fs;try{if(GM.fs&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!GM.fs&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}render()};
A.gReset=()=>{clearInterval(GM.st.iv);GM.st={};render()};
A.gResetScore=()=>{GM.teams.forEach(t=>t.s=0);GM.turn=0;render()};
function gameStage(k){const g=GAMES[k];if(GM.st._g!==k){clearInterval(GM.st.iv);GM.st={_g:k}}const set=getSet(GM.set);let body;try{body=GR[k](set)}catch(e){console.error(e);body='<p>Có lỗi khi mở trò chơi.</p>'}
  return `${GM.fs?'':`<div class="row" style="justify-content:space-between"><a href="#tro-choi" class="btn ghost sm" onclick="GM.st={}">${ic('arrow-left')} Tất cả trò chơi</a><span class="muted small">Bộ từ: <b>${esc(set.name)}</b></span></div>`}
  <div class="stage ${GM.fs?'fs':''}" id="stage"><div class="row" style="justify-content:space-between"><h2>${g.e} ${esc(g.t)}</h2><div class="row"><button class="sbtn" style="font-size:1rem;padding:6px 12px" onclick="A.gResetScore()">Điểm về 0</button><button class="sbtn y" style="font-size:1rem;padding:6px 12px" onclick="A.gReset()">Ván mới</button><button class="sbtn b" style="font-size:1rem;padding:6px 12px" onclick="A.gFs()">${GM.fs?'Thu nhỏ':'Toàn màn hình'}</button>${GM.fs?`<button class="sbtn" style="font-size:1rem;padding:6px 12px" onclick="GM.fs=false;GM.st={};go('tro-choi')">Thoát</button>`:''}</div></div>
  ${teamsBar()}<div style="flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center">${body}</div></div>`}

const GR={};
// --- wheel
GR.wheel=set=>{const st=GM.st;if(!st.items){
   const fromCls=GM.src==='students'&&GM.cls?studentsOf(GM.cls).map(s=>({label:s.eng||s.name.split(' ').pop(),full:s.name})):null;
   st.items=fromCls&&fromCls.length?fromCls:shuffle(set.words).slice(0,12).map(w=>({label:w.en,e:w.e}));st.rot=0;st.win=null}
  return `<div class="row" style="justify-content:center"><select id="wSrc" style="width:auto;font-family:var(--f-body)">${opt([['words','Quay từ vựng'],['students','Quay tên học sinh']],GM.src)}</select>${GM.src==='students'?`<select id="wCls" style="width:auto;font-family:var(--f-body)">${classOpts(GM.cls,'— Chọn lớp —')}</select>`:''}</div>
  <div class="wheelwrap"><div class="pin"></div><canvas id="wheel" width="600" height="600" style="transform:rotate(${st.rot}deg)"></canvas></div>
  <div style="text-align:center;min-height:90px">${st.win?`<div style="font-size:2.6rem;font-weight:800">${st.win.e?st.win.e+' ':''}${esc(st.win.label)}</div>${st.items.length>2?`<button class="sbtn" style="font-size:1rem" onclick="A.wRemove()">Bỏ khỏi vòng quay</button>`:''}`:'<div style="font-size:1.3rem;opacity:.7">Bấm QUAY để bắt đầu!</div>'}</div>
  <div style="text-align:center"><button class="sbtn y" style="font-size:1.6rem;padding:12px 40px" onclick="A.wSpin()" id="wBtn">QUAY 🎡</button></div>`};
GAMES.wheel.mount=()=>{const c=$('#wheel');if(!c)return;const st=GM.st;const x=c.getContext('2d');const n=st.items.length;const seg=Math.PI*2/n;const cols=['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'];
  x.clearRect(0,0,600,600);st.items.forEach((it,i)=>{const a0=-Math.PI/2+i*seg;x.beginPath();x.moveTo(300,300);x.arc(300,300,290,a0,a0+seg);x.closePath();x.fillStyle=cols[i%cols.length];if(n%6===1&&i===n-1)x.fillStyle=cols[2];x.fill();x.lineWidth=4;x.strokeStyle='#2B2340';x.stroke();
   x.save();x.translate(300,300);x.rotate(a0+seg/2);x.textAlign='right';x.fillStyle='#2B2340';const fs=n>10?24:30;x.font=`800 ${fs}px "Baloo 2", sans-serif`;x.fillText((it.e?it.e+' ':'')+it.label.slice(0,14),270,fs/3);x.restore()});
  x.beginPath();x.arc(300,300,34,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.lineWidth=5;x.stroke();
  const s=$('#wSrc');if(s)s.onchange=e=>{GM.src=e.target.value;GM.st={};render()};const cs=$('#wCls');if(cs)cs.onchange=e=>{GM.cls=e.target.value;GM.st={};render()}};
A.wSpin=()=>{const st=GM.st;const c=$('#wheel');if(!c||st.spinning)return;st.spinning=true;st.win=null;const add=360*5+Math.random()*360;st.rot+=add;c.style.transition='transform 4.2s cubic-bezier(.17,.67,.12,1)';c.style.transform=`rotate(${st.rot}deg)`;
  let ticks=0;const tk=setInterval(()=>{sfx('tick');if(++ticks>14)clearInterval(tk)},250);
  setTimeout(()=>{st.spinning=false;const n=st.items.length;const segD=360/n;const a=(360-(st.rot%360))%360;st.win=st.items[Math.floor(a/segD)%n];sfx('win');if(st.win&&!GM.src.startsWith('stu'))speak(st.win.label);else if(st.win)speak(st.win.label);render()},4300)};
A.wRemove=()=>{const st=GM.st;st.items=st.items.filter(i=>i!==st.win);st.win=null;render()};

// --- mystery boxes
GR.boxes=set=>{const st=GM.st;if(!st.boxes){const ws=shuffle(set.words);const specials=shuffle([{k:'gift',p:2},{k:'gift',p:3},{k:'bomb',p:-1},{k:'swap'}]);st.boxes=[...Array(12)].map((_,i)=>i<4?specials[i]:{k:'word',w:ws[i%ws.length]});st.boxes=shuffle(st.boxes);st.open=[];st.cur=null;st.ans=false}
  if(st.cur!==null){const b=st.boxes[st.cur];let inner;
    if(b.k==='word')inner=`<div class="bigemo">${emo(b.w)}</div><div style="text-align:center;font-size:1.5rem">${esc(GM.teams[GM.turn]?.n||'')}: What is it?</div><div style="text-align:center;font-size:3rem;font-weight:800;min-height:70px">${st.ans?esc(b.w.en):'? ? ?'}</div>
      <div class="row" style="justify-content:center">${st.ans?'':`<button class="sbtn b" onclick="GM.st.ans=true;speak('${esc(b.w.en).replace(/'/g,"\\'")}');render()">Hiện đáp án</button>`}<button class="sbtn g" onclick="A.boxDone(1)">Đúng +1 ⭐</button><button class="sbtn p" onclick="A.boxDone(0)">Chưa đúng</button></div>`;
    else if(b.k==='gift')inner=`<div class="bigemo">🎁</div><div style="text-align:center;font-size:3rem;font-weight:800">Quà! +${b.p} điểm</div><div style="text-align:center"><button class="sbtn g" onclick="A.boxDone(${b.p})">Nhận quà</button></div>`;
    else if(b.k==='bomb')inner=`<div class="bigemo">💣</div><div style="text-align:center;font-size:3rem;font-weight:800">Ôi, bom! −1 điểm</div><div style="text-align:center"><button class="sbtn p" onclick="A.boxDone(-1)">Tiếp tục</button></div>`;
    else inner=`<div class="bigemo">🔄</div><div style="text-align:center;font-size:2.4rem;font-weight:800">Đổi điểm với một đội khác!</div><div class="row" style="justify-content:center">${GM.teams.map((t,i)=>i===GM.turn?'':`<button class="sbtn v" onclick="A.boxSwap(${i})">Đổi với ${esc(t.n)}</button>`).join('')}<button class="sbtn" onclick="A.boxDone(0)">Bỏ qua</button></div>`;
    return inner}
  return `<div style="text-align:center;font-size:1.3rem">Lượt của <b>${esc(GM.teams[GM.turn]?.n||'')}</b> – chọn một hộp!</div><div class="boxes">${st.boxes.map((b,i)=>`<button class="mbox ${st.open.includes(i)?'open':''} c-${COLORS[i%6]}" style="background:${['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'][i%6]}" ${st.open.includes(i)?'disabled':''} onclick="A.boxOpen(${i})">${st.open.includes(i)?(b.k==='word'?emo(b.w):b.k==='gift'?'🎁':b.k==='bomb'?'💣':'🔄'):i+1}</button>`).join('')}</div>`};
A.boxOpen=i=>{GM.st.cur=i;GM.st.ans=false;GM.st.open.push(i);sfx('pop');render()};
A.boxDone=p=>{if(p&&GM.teams[GM.turn]){GM.teams[GM.turn].s+=p;p>0?(sfx('win'),confetti(30)):sfx('bad')}GM.st.cur=null;A.gNext();render()};
A.boxSwap=j=>{const a=GM.teams[GM.turn],b=GM.teams[j];[a.s,b.s]=[b.s,a.s];sfx('pop');GM.st.cur=null;A.gNext();render()};

// --- picture reveal
GR.reveal=set=>{const st=GM.st;if(!st.w||st.next){const pool=set.words.filter(w=>w!==st.w);st.w=pick(pool);st.opts=shuffle([st.w,...shuffle(pool.filter(w=>w!==st.w)).slice(0,3)]);st.gone=[];st.done=false;st.bad=[];st.next=false;st.tc=shuffle([...Array(16).keys()])}
  return `<div class="reveal"><span class="rv-emo">${emo(st.w)}</span><div class="tiles">${[...Array(16)].map((_,i)=>`<button class="${st.gone.includes(i)||st.done?'gone':''}" style="background:${['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'][i%6]}" onclick="A.rvTile(${i})">${i+1}</button>`).join('')}</div></div>
  <div class="opts">${st.opts.map((o,i)=>`<button class="sbtn ${st.done&&o===st.w?'right':st.bad.includes(i)?'wrong':''}" onclick="A.rvPick(${i})">${esc(o.en)}</button>`).join('')}</div>
  <div style="text-align:center">${st.done?`<button class="sbtn y" onclick="GM.st.next=true;render()">Hình tiếp theo ➜</button>`:`<span style="opacity:.75">Lượt của ${esc(GM.teams[GM.turn]?.n||'')} – mở 1 ô rồi đoán</span>`}</div>`};
A.rvTile=i=>{GM.st.gone.push(i);sfx('pop');render()};
A.rvPick=i=>{const st=GM.st;if(st.done)return;if(st.opts[i]===st.w){st.done=true;A.gWin(Math.max(1,Math.round((16-st.gone.length)/4)));speak(st.w.en)}else{st.bad.push(i);sfx('bad');A.gNext()}render()};

// --- memory
GR.memory=set=>{const st=GM.st;if(!st.cards){const n=window.innerWidth<700?6:8;const ws=shuffle(set.words).slice(0,n);st.cards=shuffle(ws.flatMap((w,i)=>[{p:i,t:'e',w},{p:i,t:'w',w}]));st.up=[];st.done=[];st.lock=false}
  const all=st.done.length===st.cards.length;
  return `${all?'<div style="text-align:center;font-size:2.4rem;font-weight:800">Hoàn thành! 🎉</div>':''}<div class="mgrid">${st.cards.map((c,i)=>`<div class="mcard ${st.up.includes(i)||st.done.includes(i)?'flip':''} ${st.done.includes(i)?'done':''}" onclick="A.memFlip(${i})"><div class="fr" style="background:${['#7FD3FF','#FFD447','#FF8FB1','#8EE59B'][i%4]}">?</div><div class="bk">${c.t==='e'?`<span style="font-size:clamp(2.2rem,6vw,4rem)">${emo(c.w)}</span>`:esc(c.w.en)}</div></div>`).join('')}</div>`};
A.memFlip=i=>{const st=GM.st;if(st.lock||st.up.includes(i)||st.done.includes(i))return;st.up.push(i);sfx('tick');
  if(st.up.length===2){const [a,b]=st.up.map(x=>st.cards[x]);if(a.p===b.p){st.done.push(...st.up);st.up=[];if(GM.teams[GM.turn])GM.teams[GM.turn].s++;sfx('ok');speak(a.w.en);if(st.done.length===st.cards.length)setTimeout(()=>{sfx('win');confetti(80)},300)}else{st.lock=true;setTimeout(()=>{st.up=[];st.lock=false;A.gNext();render()},1100)}}
  render()};

// --- listen and choose
GR.listen=set=>{const st=GM.st;if(!st.w||st.next){const pool=set.words;st.w=pick(pool.filter(w=>w!==st.w));st.opts=shuffle([st.w,...shuffle(pool.filter(w=>w!==st.w)).slice(0,3)]);st.done=false;st.bad=[];st.next=false;st.say=true}
  return `<div style="text-align:center"><button class="sbtn y" style="font-size:2rem;padding:16px 36px" onclick="speak('${esc(st.w.en).replace(/'/g,"\\'")}',{rate:.75})">🔊 Nghe lại</button></div>
  <div class="opts">${st.opts.map((o,i)=>`<button class="sbtn ${st.done&&o===st.w?'right':st.bad.includes(i)?'wrong':''}" style="font-size:clamp(3rem,9vw,5.5rem);padding:10px" onclick="A.lsPick(${i})" aria-label="Lựa chọn ${i+1}">${emo(o)}</button>`).join('')}</div>
  <div style="text-align:center;min-height:60px">${st.done?`<div style="font-size:2.4rem;font-weight:800">${esc(st.w.en)}</div><button class="sbtn y" onclick="GM.st.next=true;render()">Từ tiếp theo ➜</button>`:`<span style="opacity:.75">Lượt của ${esc(GM.teams[GM.turn]?.n||'')}</span>`}</div>`};
GAMES.listen.mount=()=>{if(GM.st.say){GM.st.say=false;setTimeout(()=>speak(GM.st.w.en,{rate:.75}),350)}};
A.lsPick=i=>{const st=GM.st;if(st.done)return;if(st.opts[i]===st.w){st.done=true;A.gWin()}else{st.bad.push(i);sfx('bad');A.gNext()}render()};

// --- hangman balloons
GR.hangman=set=>{const st=GM.st;if(!st.w||st.next){st.w=pick(set.words.filter(w=>w!==st.w&&/^[a-z ]+$/i.test(w.en)));st.g=[];st.miss=0;st.next=false;st.hint=false}
  const word=st.w.en.toLowerCase();const letters=[...new Set(word.replace(/ /g,''))];const won=letters.every(l=>st.g.includes(l));const lost=st.miss>=6;
  return `<div class="balloons">${[...Array(6)].map((_,i)=>`<span class="${i<st.miss?'pop':''}" style="${i<st.miss?'opacity:0':''}">🎈</span>`).join('')}</div>
  ${st.hint||won||lost?`<div style="text-align:center;font-size:4rem">${emo(st.w)}</div>`:''}
  <div class="blanks">${[...word].map(ch=>ch===' '?'<span style="border:0;width:24px"></span>':`<span>${st.g.includes(ch)||lost?ch:''}</span>`).join('')}</div>
  ${won?`<div style="text-align:center;font-size:2.4rem;font-weight:800">Giỏi quá! 🎉</div>`:lost?`<div style="text-align:center;font-size:2rem;font-weight:800">Bóng nổ hết rồi! Từ đúng là "${esc(st.w.en)}"</div>`:''}
  ${won||lost?`<div style="text-align:center"><button class="sbtn y" onclick="GM.st.next=true;render()">Từ tiếp theo ➜</button></div>`:`<div class="keys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(l=>`<button ${st.g.includes(l)?'disabled':''} onclick="A.hmGuess('${l}')">${l}</button>`).join('')}</div><div style="text-align:center"><button class="sbtn" style="font-size:1rem" onclick="GM.st.hint=true;render()">Gợi ý hình 💡</button></div>`}`};
A.hmGuess=l=>{const st=GM.st;st.g.push(l);const word=st.w.en.toLowerCase();if(word.includes(l)){sfx('ok');const letters=[...new Set(word.replace(/ /g,''))];if(letters.every(x=>st.g.includes(x))){A.gWin();speak(st.w.en)}}else{st.miss++;sfx('bad');A.gNext()}render()};

// --- spelling tiles
GR.spell=set=>{const st=GM.st;if(!st.w||st.next){st.w=pick(set.words.filter(w=>w!==st.w&&/^[a-z]+$/i.test(w.en)&&w.en.length<=10));let sh;do{sh=shuffle([...st.w.en.toLowerCase()])}while(sh.join('')===st.w.en.toLowerCase()&&st.w.en.length>1);st.pool=sh.map((c,i)=>({c,i}));st.ans=[];st.next=false;st.res=null}
  const full=st.ans.length===st.w.en.length;
  return `<div style="text-align:center;font-size:5rem">${emo(st.w)}</div>
  <div class="tilesrow">${st.w.en.split('').map((_,i)=>st.ans[i]?`<button class="ltile" style="${st.res==='ok'?'background:#8EE59B':st.res==='bad'?'background:#FF8A80':''}" onclick="A.spBack(${i})">${st.ans[i].c}</button>`:`<span class="ltile slot"></span>`).join('')}</div>
  <div class="tilesrow">${st.pool.map((t,i)=>st.ans.includes(t)?'<span style="width:58px"></span>':`<button class="ltile" style="background:#7FD3FF" onclick="A.spPick(${i})">${t.c}</button>`).join('')}</div>
  <div style="text-align:center">${st.res==='ok'?`<button class="sbtn y" onclick="GM.st.next=true;render()">Từ tiếp theo ➜</button>`:full?`<button class="sbtn g" onclick="A.spCheck()">Kiểm tra ✔</button>`:`<span style="opacity:.75">Lượt của ${esc(GM.teams[GM.turn]?.n||'')}</span>`}</div>`};
A.spPick=i=>{const st=GM.st;st.res=null;st.ans.push(st.pool[i]);sfx('tick');render()};
A.spBack=i=>{const st=GM.st;if(st.res==='ok')return;st.res=null;st.ans.splice(i,1);render()};
A.spCheck=()=>{const st=GM.st;if(st.ans.map(t=>t.c).join('')===st.w.en.toLowerCase()){st.res='ok';A.gWin();speak(st.w.en)}else{st.res='bad';sfx('bad');A.gNext()}render()};

// --- sentence builder
GR.sentence=()=>{const st=GM.st;if(!st.s||st.next){st.s=pick(SENTS.filter(x=>x!==st.s));const ws=st.s[0].split(' ');let sh;do{sh=shuffle(ws.map((w,i)=>({w,i})))}while(sh.every((t,i)=>t.i===i)&&ws.length>1);st.pool=sh;st.ans=[];st.res=null;st.next=false}
  const full=st.ans.length===st.pool.length;
  return `<div style="text-align:center;font-size:4.5rem">${st.s[1]}</div>
  <div class="tilesrow" style="min-height:76px;border-bottom:4px dashed #2B2340;padding-bottom:10px">${st.ans.map((t,i)=>`<button class="sbtn ${st.res==='ok'?'g':st.res==='bad'?'p':'y'}" onclick="A.snBack(${i})">${esc(t.w)}</button>`).join('')}</div>
  <div class="tilesrow">${st.pool.map((t,i)=>st.ans.includes(t)?'':`<button class="sbtn b" onclick="A.snPick(${i})">${esc(t.w)}</button>`).join('')}</div>
  <div style="text-align:center">${st.res==='ok'?`<button class="sbtn y" onclick="GM.st.next=true;render()">Câu tiếp theo ➜</button>`:full?`<button class="sbtn g" onclick="A.snCheck()">Kiểm tra ✔</button>`:''}</div>`};
A.snPick=i=>{const st=GM.st;st.res=null;st.ans.push(st.pool[i]);sfx('tick');render()};
A.snBack=i=>{const st=GM.st;if(st.res==='ok')return;st.res=null;st.ans.splice(i,1);render()};
A.snCheck=()=>{const st=GM.st;if(st.ans.map(t=>t.w).join(' ')===st.s[0]){st.res='ok';A.gWin();speak(st.s[0])}else{st.res='bad';sfx('bad');A.gNext()}render()};

// --- what's missing
GR.missing=set=>{const st=GM.st;if(!st.items||st.next){st.items=shuffle(set.words).slice(0,6);st.phase='look';st.gone=null;st.next=false}
  if(st.phase==='hide')return `<div class="bigemo">🙈</div><div style="text-align:center;font-size:3rem;font-weight:800">Close your eyes!</div>`;
  const shown=st.phase==='guess'?st.items.filter(w=>w!==st.gone):st.items;
  return `<div class="opts" style="grid-template-columns:repeat(3,minmax(0,1fr))">${shown.map(w=>`<div class="sbtn" style="cursor:default;text-align:center;box-shadow:none"><div style="font-size:clamp(2.6rem,7vw,4.4rem)">${emo(w)}</div>${esc(w.en)}</div>`).join('')}${st.phase==='guess'?`<div class="sbtn" style="cursor:default;text-align:center;box-shadow:none;border-style:dashed;display:grid;place-items:center;font-size:3rem">${st.reveal?emo(st.gone)+'<div style="font-size:1.3rem">'+esc(st.gone.en)+'</div>':'?'}</div>`:''}</div>
  <div class="row" style="justify-content:center">${st.phase==='look'?`<button class="sbtn y" onclick="A.msHide()">Nhắm mắt! 🙈</button>`:st.reveal?`<button class="sbtn g" onclick="A.gWin();GM.st.next=true;render()">Đội ${esc(GM.teams[GM.turn]?.n||'')} đúng +1</button><button class="sbtn y" onclick="GM.st.next=true;A.gNext();render()">Ván mới ➜</button>`:`<button class="sbtn b" onclick="GM.st.reveal=true;speak(GM.st.gone.en);render()">What's missing? Hiện đáp án</button>`}</div>`};
A.msHide=()=>{const st=GM.st;st.phase='hide';st.reveal=false;render();setTimeout(()=>{st.gone=pick(st.items);st.phase='guess';sfx('pop');render()},2500)};

// --- time bomb
GR.bomb=set=>{const st=GM.st;if(!st.w){st.w=pick(set.words);st.on=false;st.boom=false}
  if(st.boom)return `<div class="bigemo" style="animation:shake .4s 3">💥</div><div style="text-align:center;font-size:3rem;font-weight:800">BÙM! ${esc(GM.teams[GM.turn]?.n||'')} −1</div><div style="text-align:center"><button class="sbtn y" onclick="GM.st={};render()">Chơi lại</button></div>`;
  return `<div class="bigemo">${st.on?emo(st.w):'💣'}</div><div style="text-align:center;font-size:3rem;font-weight:800">${st.on?esc(st.w.en):'Sẵn sàng chưa?'}</div>
  <div style="text-align:center;opacity:.8;font-size:1.2rem">${st.on?`Lượt: <b>${esc(GM.teams[GM.turn]?.n||'')}</b> – nói một câu có từ này rồi bấm Chuyền!`:'Bom sẽ nổ vào lúc bất ngờ (10–30 giây).'}</div>
  <div style="text-align:center">${st.on?`<button class="sbtn g" style="font-size:2rem;padding:14px 40px" onclick="A.bmPass()">Chuyền! ➜</button>`:`<button class="sbtn p" style="font-size:2rem;padding:14px 40px" onclick="A.bmStart()">Bắt đầu 💣</button>`}</div>`};
A.bmStart=()=>{const st=GM.st;st.on=true;const total=10000+Math.random()*20000;const t0=Date.now();clearInterval(st.iv);
  st.iv=setInterval(()=>{if(ROUTE!=='tro-choi'||ARG!=='bomb'){clearInterval(st.iv);return}const left=total-(Date.now()-t0);sfx('tick');if(left<=0){clearInterval(st.iv);st.boom=true;if(GM.teams[GM.turn])GM.teams[GM.turn].s--;sfx('bad');sfx('bad');render()}},Math.max(180,600));render()};
A.bmPass=()=>{const st=GM.st;st.w=pick(getSet(GM.set).words.filter(w=>w!==st.w));A.gNext();sfx('pop');render()};

// --- flash cards
GR.flash=set=>{const st=GM.st;if(!st.list){st.list=shuffle(set.words);st.i=0;st.show=false;st.auto=false}
  const w=st.list[st.i%st.list.length];
  return `<div class="bigemo" style="cursor:pointer" onclick="GM.st.show=!GM.st.show;render()">${emo(w)}</div><div style="text-align:center;font-size:3.4rem;font-weight:800;min-height:80px">${st.show?esc(w.en):'<span style="opacity:.35">bấm vào hình để hiện chữ</span>'}</div>
  <div class="row" style="justify-content:center"><button class="sbtn" onclick="A.flMove(-1)">◀</button><button class="sbtn b" onclick="speak('${esc(w.en).replace(/'/g,"\\'")}');GM.st.show=true;render()">🔊 Đọc mẫu</button><button class="sbtn ${st.auto?'p':'g'}" onclick="A.flAuto()">${st.auto?'⏸ Dừng':'▶ Tự chạy'}</button><button class="sbtn" onclick="A.flMove(1)">▶</button></div>
  <div style="text-align:center;opacity:.7">${st.i%st.list.length+1}/${st.list.length}</div>`};
A.flMove=d=>{const st=GM.st;st.i=(st.i+d+st.list.length)%st.list.length;st.show=false;render()};
A.flAuto=()=>{const st=GM.st;st.auto=!st.auto;clearInterval(st.iv);if(st.auto){const step=()=>{if(ROUTE!=='tro-choi'||ARG!=='flash'||!st.auto){clearInterval(st.iv);return}const w=st.list[st.i%st.list.length];if(!st.show){st.show=true;speak(w.en)}else{st.i=(st.i+1)%st.list.length;st.show=false}render()};step();st.iv=setInterval(step,2200)}render()};

const PLURAL=['grapes','shoes','socks','jeans','glasses','scissors'],UNCOUNT=['milk','water','rice','bread','paint','rain','snow','wind','ice cream'];
function sentenceFor(word,setId){if(setId==='colours')return `It is ${word}.`;if(setId==='actions')return `She can ${word}.`;if(setId==='numbers')return `This is number ${word}.`;
  if(PLURAL.includes(word))return `These are ${word}.`;if(UNCOUNT.includes(word))return `This is ${word}.`;return `This is ${/^[aeiou]/i.test(word)?'an':'a'} ${word}.`}
const SPK=["What's this?",'Do you like it?','What colour is it?','Is it big or small?','Spell the word!','Make a sentence!'];
function wsGen(){const set=getSet(WS.set);const n=+WS.n||8;const ws=shuffle(set.words).slice(0,Math.min(n,set.words.length));const d={};
  switch(WS.type){
   case 'vocab':d.items=ws.map(w=>({w}));break;
   case 'match':d.items=ws.slice(0,Math.min(n,8));d.right=shuffle(d.items.map((_,i)=>i));break;
   case 'mcq':d.items=ws.map(w=>({w,opts:shuffle([w.en,...shuffle(set.words.filter(x=>x!==w)).slice(0,2).map(x=>x.en)])}));break;
   case 'missing':d.items=ws.map(w=>{const ch=[...w.en];const idx=[...ch.keys()].filter(i=>/[a-z]/i.test(ch[i]));const k=WS.diff==='de'?1:WS.diff==='vua'?Math.max(1,Math.round(idx.length/3)):Math.max(2,Math.ceil(idx.length/2));const hide=shuffle(idx).slice(0,Math.min(k,idx.length));return {w,mask:ch.map((c,i)=>hide.includes(i)?'_':c).join('')}});break;
   case 'unscramble':d.items=ws.filter(w=>/^[a-z]+$/i.test(w.en)).map(w=>{let s,t=0;do{s=shuffle([...w.en.toLowerCase()]).join('')}while(s===w.en.toLowerCase()&&t++<10);return {w,s}});break;
   case 'tickcross':d.items=ws.map(w=>{const ok=Math.random()<.5;const other=pick(set.words.filter(x=>x!==w));return {w,ok,text:sentenceFor(ok?w.en:other.en,set.id)}});break;
   case 'order':d.items=shuffle(SENTS).slice(0,Math.min(n,10)).map(([s,e])=>({s,e,parts:shuffle(s.replace(/[.?!]$/,'').split(' '))}));break;
   case 'reading':{const st=allStories().find(s=>s.id===WS.story)||STORIES[0];d.story={title:st.title,cover:st.cover,text:st.scenes.map(s=>s.t)};d.q=(st.q||[]).map(q=>({q:q[0],a:q[1],opts:shuffle([q[1],...q[2]])}));
     d.gap=shuffle(st.scenes.map(s=>s.t)).slice(0,3).map(t=>{const ws2=t.split(' ');const cand=ws2.map((w,i)=>[w.replace(/[^\w]/g,''),i]).filter(([w])=>w.length>=4);if(!cand.length)return null;const [w,i]=pick(cand);ws2[i]=ws2[i].replace(w,'__________');return {t:ws2.join(' '),a:w}}).filter(Boolean);break}
   case 'phonics':{const target=PHONICS[WS.ph]||[];const others=Object.entries(PHONICS).filter(([k])=>k!==WS.ph).flatMap(([,v])=>v).filter(w=>!target.includes(w));const tg=shuffle(target).slice(0,Math.min(6,Math.max(3,Math.ceil(n/2))));d.items=shuffle([...tg.map(w=>({w,t:1})),...shuffle(others).slice(0,Math.max(3,n-tg.length)).map(w=>({w,t:0}))]);d.sound=WS.ph;break}
   case 'speaking':d.items=ws.slice(0,8).map(w=>({w,p:pick(SPK)}));break;
   case 'colouring':d.items=ws.slice(0,6);break;
   case 'bingo':d.cards=[...Array(4)].map(()=>shuffle(set.words).slice(0,9));d.call=set.words;break;
   case 'ai':d.items=WS.data?.items||[];d.instr=WS.data?.instr||'';break;
  }
  WS.data=d}
function wsTitleDefault(){const t=WS_TYPES.find(x=>x[0]===WS.type)?.[1]||'';const set=getSet(WS.set);return WS.type==='reading'?'Reading: '+(allStories().find(s=>s.id===WS.story)?.title||''):WS.type==='phonics'?'Phonics: '+WS.ph:WS.type==='order'?'Sentence building':(set.name.split('–')[0].trim()+' – '+t.split('–')[0].trim())}
function wsHtml(cfg,d){const title=cfg.title||wsTitleDefault();const L='abcdefghij';const img=cfg.img!==false;let body='',key='';

   case 'match':body=`<p class="instr">Look, read and match.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 120px">${d.items.map((w,i)=>`<div class="q row" style="justify-content:space-between;flex-wrap:nowrap"><span><b>${i+1}.</b> ${img?`<span class="emo" style="font-size:46px">${emo(w)}</span>`:esc(w.vi)}</span><span>●</span></div><div class="q row" style="flex-wrap:nowrap;gap:10px"><span>●</span><b>${L[i]}.</b> <span style="font-size:22px">${esc(d.items[d.right[i]].en)}</span></div>`).join('')}</div>`;key=d.items.map((w,i)=>`${i+1}-${L[d.right.indexOf(i)]}`).join(' · ');break;
   case 'mcq':body=`<p class="instr">Look and circle the correct word.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">${d.items.map(({w,opts},i)=>`<div class="q row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b>${img?E(w):esc(w.vi)}<div>${opts.map((o,j)=>`<div>${L[j]}) ${esc(o)}</div>`).join('')}</div></div>`).join('')}</div>`;key=d.items.map(({w,opts},i)=>`${i+1}${L[opts.indexOf(w.en)]}`).join(' · ');break;
   case 'missing':body=`<p class="instr">Look and write the missing letters.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">${d.items.map(({w,mask},i)=>`<div class="q row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b>${E(w)}<span style="font-size:28px;letter-spacing:6px">${esc(mask)}</span></div>`).join('')}</div>`;key=d.items.map(({w},i)=>`${i+1}. ${w.en}`).join(' · ');break;
   case 'unscramble':body=`<p class="instr">Look at the pictures and the letters. Write the words.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">${d.items.map(({w,s},i)=>`<div class="q"><div class="row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b>${E(w)}<span style="font-size:22px;letter-spacing:8px">${esc(s)}</span></div><div style="margin-left:34px;margin-top:6px">${'<span style="display:inline-block;width:26px;border-bottom:2px solid #333;margin-right:6px;height:28px"></span>'.repeat(w.en.length)}</div></div>`).join('')}</div>`;key=d.items.map(({w},i)=>`${i+1}. ${w.en}`).join(' · ');break;
   case 'tickcross':body=`<p class="instr">Look and read. Put a tick (✓) or a cross (✗) in the box.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">${d.items.map(({w,text},i)=>`<div class="q row" style="flex-wrap:nowrap;gap:14px"><b>${i+1}.</b><span class="emo">${emo(w)}</span><span style="flex:1">${esc(text)}</span><span style="width:36px;height:36px;border:2px solid #333;border-radius:6px;display:inline-block"></span></div>`).join('')}</div>`;key=d.items.map(({ok},i)=>`${i+1} ${ok?'✓':'✗'}`).join(' · ');break;
   case 'order':body=`<p class="instr">Put the words in order. Write the sentences.</p>${d.items.map(({e,parts},i)=>`<div class="q"><div class="row" style="gap:10px"><b>${i+1}.</b>${img?`<span style="font-size:30px">${e}</span>`:''}<span style="font-size:19px">${parts.map(esc).join(' &nbsp;/&nbsp; ')}</span></div><div style="border-bottom:2px solid #333;height:34px;margin-left:30px"></div></div>`).join('')}`;key=d.items.map(({s},i)=>`${i+1}. ${esc(s)}`).join('<br>');break;
   case 'reading':body=`<p class="instr">Read the story.</p><div class="box" style="text-align:left;font-size:18px;line-height:1.7"><div style="text-align:center;font-size:40px">${esc(d.story.cover)}</div><b>${esc(d.story.title)}</b><br>${d.story.text.map(esc).join(' ')}</div>
     <p class="instr">A. Read and circle the correct answer.</p>${d.q.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q.q)}<div style="margin-left:24px">${q.opts.map((o,j)=>`${L[j]}) ${esc(o)}`).join('&nbsp;&nbsp;&nbsp;&nbsp;')}</div></div>`).join('')}
     ${d.gap.length?`<p class="instr">B. Read and complete the sentences.</p>${d.gap.map((g,i)=>`<div class="q"><b>${i+1}.</b> ${esc(g.t)}</div>`).join('')}`:''}`;
     key='A: '+d.q.map((q,i)=>`${i+1}${L[q.opts.indexOf(q.a)]}`).join(' · ')+(d.gap.length?' &nbsp; B: '+d.gap.map((g,i)=>`${i+1}. ${esc(g.a)}`).join(' · '):'');break;
   case 'phonics':{const snd=d.sound.split(' ')[0];body=`<p class="instr">Say the words. Circle the pictures with the sound "${esc(snd)}" ${esc(d.sound.includes('(')?d.sound.slice(d.sound.indexOf('(')):'')}.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">${d.items.map(({w})=>`<div class="box"><div style="font-size:56px">${PH_EMO[w]||'🔤'}</div><div style="font-size:18px">${cfg.diff==='kho'?'_'.repeat(w.length):esc(w)}</div></div>`).join('')}</div>`;key='Có âm "'+esc(snd)+'": '+d.items.filter(x=>x.t).map(x=>x.w).join(', ');break}
   case 'speaking':body=`<p class="instr">Speaking cards – cut and play in pairs. ✂</p><div class="cards">${d.items.map(({w,p})=>`<div class="scard"><div style="font-size:72px">${emo(w)}</div><b style="font-size:26px">${esc(w.en)}</b><span style="font-size:16px">${esc(p)}</span></div>`).join('')}</div>`;break;
   case 'colouring':body=`<p class="instr">Colour the pictures. Trace and write the words.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">${d.items.map(w=>`<div class="box" style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:96px;filter:grayscale(1) contrast(.6) brightness(1.5)">${emo(w)}</span><span style="font-size:44px;color:transparent;-webkit-text-stroke:1.6px #555;letter-spacing:3px;font-weight:800">${esc(w.en)}</span><span class="wline" style="min-width:220px"></span></div>`).join('')}</div>`;break;
   case 'bingo':body=`<p class="instr">BINGO! Listen and cross the pictures.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">${d.cards.map((c,ci)=>`<div style="border:3px solid #333;border-radius:14px;padding:8px"><div style="text-align:center;font-weight:800;font-size:22px">B I N G O · ${ci+1}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">${c.map(w=>`<div style="border:2px solid #999;border-radius:8px;text-align:center;padding:4px;aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center"><span style="font-size:38px">${emo(w)}</span><span style="font-size:13px">${esc(w.en)}</span></div>`).join('')}</div></div>`).join('')}</div>`;key='Danh sách gọi: '+d.call.map(w=>esc(w.en)).join(', ');break;
   case 'ai':body=`<p class="instr">${esc(d.instr||'Read and choose the correct answer.')}</p>${(d.items||[]).map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q.q)}${(q.opts||[]).length?`<div style="margin-left:24px">${q.opts.map((o,j)=>`${L[j]}) ${esc(o)}`).join('&nbsp;&nbsp;&nbsp;&nbsp;')}</div>`:'<div style="border-bottom:2px solid #333;height:30px;margin-left:24px"></div>'}</div>`).join('')||'<p>Chưa có câu hỏi. Bấm "Tạo bằng AI".</p>'}`;key=(d.items||[]).map((q,i)=>`${i+1}. ${(q.opts||[]).length&&q.opts.indexOf(q.a)>=0?L[q.opts.indexOf(q.a)]+') ':''}${esc(q.a||'')}`).join(' · ');break;
  }
  return `<div class="sheet"><h1>${esc(title)}</h1><div class="sh-meta"><span>Name: ______________________</span><span>Class: __________</span><span>Date: ___________</span></div>${body}${cfg.key&&key?`<div class="key"><b>Answer key</b> – ${key}</div>`:''}<div style="margin-top:22px;text-align:center;font-size:13px;color:#888;font-family:'Be Vietnam Pro',sans-serif">${esc(S.settings.school||("Teacher "+(S.settings.teacher||'Flora')+"'s English Class"))}</div></div>`}

const MSG_T=[['weekly','Báo cáo tiến bộ tuần'],['feedback','Nhận xét cá nhân'],['hw','Nhắc bài tập về nhà'],['absent','Thông báo vắng học'],['lesson','Tóm tắt buổi học'],['praise','Khen ngợi, động viên'],['home','Gợi ý luyện tập ở nhà']];
let PM={sid:'',type:'weekly',lang:'vi',note:'',text:'',date:todayISO()};

function msgDraft(){const s=stu(PM.sid);if(!s)return '';const vi=PM.lang==='vi';const nm=s.eng||s.name.split(' ').pop();const T=S.settings.teacher||'Flora';
  const last=latestAssess(s.id);const h=hwStats(s.id);const at=attRate(s.id);const c=cls(s.classId);
  const sk=last?SKILLS.map(([k,l])=>({k,l,v:last.scores?.[k]||0})).filter(x=>x.v):[];const top=sk.slice().sort((a,b)=>b.v-a.v).slice(0,2);const low=sk.slice().sort((a,b)=>a.v-b.v).filter(x=>x.v<4).slice(0,2);
  const missing=S.homework.filter(x=>{const r=x.records?.[s.id];return hwTargets(x).includes(s.id)&&(!r||r.status==='missing'||r.status==='partial'||(r.status==='pending'&&x.due<todayISO()))});
  const lesson=S.lessons.filter(l=>l.classId===s.classId&&l.date<=PM.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const note=PM.note?(vi?`\n${PM.note}\n`:`\n${PM.note}\n`):'';
  const greet=vi?`Kính gửi phụ huynh bé ${nm},\n`:`Dear parents of ${nm},\n`;const sign=vi?`\nCảm ơn anh/chị đã luôn đồng hành cùng con.\nCô ${T}`:`\nThank you for your support.\nTeacher ${T}`;
  const lowVi=low.map(x=>x.l.toLowerCase()).join(' và '),topVi=top.map(x=>x.l.toLowerCase()).join(' và ');
  const lowEn=low.map(x=>SKILL_EN[x.k]).join(' and '),topEn=top.map(x=>SKILL_EN[x.k]).join(' and ');
  switch(PM.type){
   case 'weekly':return vi?`${greet}Cô ${T} xin gửi anh/chị tình hình học tập tuần này của ${nm} ở lớp ${c?.name||''}:\n• Chuyên cần: ${at??'—'}%\n• Bài tập về nhà: hoàn thành ${h.rate??'—'}% (${h.done}/${h.total} bài)\n${top.length?`• Điểm mạnh: con làm tốt phần ${topVi}.\n`:''}${low.length?`• Cần cố gắng thêm: ${lowVi}.\n`:''}${s.strengths?`• Cô ghi nhận: ${s.strengths}\n`:''}${low[0]?`\nGợi ý ở nhà: ${RECO[low[0].k]}\n`:''}${note}${sign}`
     :`${greet}Here is ${nm}'s progress this week in ${c?.name||'class'}:\n• Attendance: ${at??'—'}%\n• Homework completed: ${h.rate??'—'}% (${h.done}/${h.total})\n${top.length?`• Strengths: ${topEn}.\n`:''}${low.length?`• To work on: ${lowEn}.\n`:''}${low[0]?`\nAt home, you could ${RECO_EN[low[0].k]}.\n`:''}${note}${sign}`;
   case 'feedback':return vi?`${greet}Cô ${T} muốn chia sẻ đôi điều về ${nm}.\n${top.length?`Con đang làm rất tốt phần ${topVi}, cô rất vui khi thấy con tiến bộ.\n`:''}${low.length?`Phần ${lowVi} con cần luyện thêm một chút. Ở lớp cô sẽ hỗ trợ con, ở nhà anh/chị có thể giúp con: ${RECO[low[0].k].charAt(0).toLowerCase()+RECO[low[0].k].slice(1)}\n`:''}${last?.note?`Nhận xét của cô: ${last.note}\n`:''}${note}${sign}`
     :`${greet}I'd like to share some feedback about ${nm}.\n${top.length?`${nm} is doing really well in ${topEn}.\n`:''}${low.length?`We will keep practising ${lowEn} in class. At home, you could ${RECO_EN[low[0].k]}.\n`:''}${note}${sign}`;
   case 'hw':return vi?`${greet}Cô ${T} nhắn để anh/chị nắm: ${missing.length?`${nm} còn ${missing.length} bài tập chưa hoàn thành:\n${missing.map(x=>`• ${x.title} (hạn ${fmtD(x.due)})`).join('\n')}\nAnh/chị nhắc con hoàn thành giúp cô trong buổi học tới nhé.`:`${nm} đã hoàn thành đầy đủ bài tập. Anh/chị khen con giúp cô nhé!`}\n${note}${sign}`
     :`${greet}${missing.length?`${nm} still has ${missing.length} homework task(s) to finish:\n${missing.map(x=>`• ${x.title} (due ${fmtD(x.due)})`).join('\n')}\nPlease remind ${nm} to complete them before our next lesson.`:`${nm} has completed all homework. Please give ${nm} a big well done!`}\n${note}${sign}`;
   case 'absent':return vi?`${greet}Hôm nay (${fmtD(PM.date)}) ${nm} vắng mặt ở lớp ${c?.name||''}. Cô mong con vẫn khoẻ ạ.\n${lesson?`Nội dung buổi học: ${lesson.title}${lesson.vocab?`\nTừ vựng: ${lesson.vocab}`:''}${lesson.homework?`\nBài tập: ${lesson.homework}`:''}\n`:''}Anh/chị cho con ôn lại giúp cô, buổi sau cô sẽ hỗ trợ thêm cho con.\n${note}${sign}`
     :`${greet}${nm} was absent from ${c?.name||'class'} today (${fmtD(PM.date)}). I hope ${nm} is well.\n${lesson?`Today's lesson: ${lesson.title}${lesson.vocab?`\nVocabulary: ${lesson.vocab}`:''}${lesson.homework?`\nHomework: ${lesson.homework}`:''}\n`:''}Please help ${nm} review at home and I will support ${nm} in our next lesson.\n${note}${sign}`;
   case 'lesson':return lesson?(vi?`${greet}Buổi học ${fmtD(lesson.date)} lớp ${c?.name||''} học bài "${lesson.title}".\n${lesson.objectives?`• Mục tiêu: ${lesson.objectives}\n`:''}${lesson.vocab?`• Từ vựng: ${lesson.vocab}\n`:''}${lesson.structures?`• Mẫu câu: ${lesson.structures}\n`:''}${lesson.homework?`• Bài tập về nhà: ${lesson.homework}\n`:''}Anh/chị hỏi con vài từ mới bằng tiếng Anh để con khoe với bố mẹ nhé!\n${note}${sign}`
     :`${greet}In our lesson on ${fmtD(lesson.date)}, ${c?.name||'the class'} studied "${lesson.title}".\n${lesson.vocab?`• Vocabulary: ${lesson.vocab}\n`:''}${lesson.structures?`• Sentence patterns: ${lesson.structures}\n`:''}${lesson.homework?`• Homework: ${lesson.homework}\n`:''}Ask ${nm} to teach you some new words!\n${note}${sign}`):(vi?'Lớp của con chưa có giáo án nào trước ngày đã chọn.':'There is no lesson plan for this class before the chosen date.');
   case 'praise':return vi?`${greet}Cô ${T} muốn khoe với anh/chị: hôm nay ${nm} ${top[0]?`làm rất tốt phần ${top[0].l.toLowerCase()}`:'học rất chăm chỉ'} và tích cực phát biểu trong lớp. Cô rất tự hào về con! 🌟\nAnh/chị khen con thật nhiều giúp cô nhé.\n${note}${sign}`
     :`${greet}I'm happy to share that ${nm} did a great job today${top[0]?` in ${SKILL_EN[top[0].k]}`:''} and took an active part in class. I'm very proud of ${nm}! 🌟\n${note}${sign}`;
   case 'home':{const ks=(low.length?low:sk.slice(0,2)).map(x=>x.k);const list=(ks.length?ks:['vocab','read']);return vi?`${greet}Để ${nm} tiến bộ đều, anh/chị có thể cùng con luyện tập ở nhà 10–15 phút mỗi ngày:\n${list.map(k=>`• ${RECO[k]}`).join('\n')}\n• Cho con nghe bài hát, truyện tiếng Anh con đã học ở lớp.\nĐiều quan trọng nhất là khen con khi con cố gắng.\n${note}${sign}`
     :`${greet}To help ${nm} keep improving, you could practise together for 10–15 minutes a day:\n${list.map(k=>`• ${RECO_EN[k].charAt(0).toUpperCase()+RECO_EN[k].slice(1)}`).join('\n')}\n• Listen to the English songs and stories we use in class.\nMost importantly, praise ${nm} for trying.\n${note}${sign}`}
  }return ''}

async function readSheet(file){const buf=await file.arrayBuffer();if(window.XLSX){const wb=XLSX.read(buf,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
  const txt=new TextDecoder().decode(buf).replace(/^\ufeff/,'');const lines=txt.split(/\r?\n/).filter(Boolean);const sep=lines[0].includes(';')&&!lines[0].includes(',')?';':',';const hd=lines[0].split(sep).map(s=>s.trim());return lines.slice(1).map(l=>{const c=l.split(sep);const o={};hd.forEach((h,i)=>o[h]=(c[i]||'').trim());return o})}
function mapRows(rows){const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');
  const find=(r,keys)=>{for(const k of Object.keys(r)){const n=norm(k);if(keys.some(x=>n===x||n.includes(x)))return String(r[k]).trim()}return ''};
  return rows.map(r=>({name:find(r,['hoten','hovaten','tenhocsinh','fullname','name','hocsinh']),eng:find(r,['tentienganh','englishname','tenta','eng']),age:find(r,['tuoi','age']),cls:find(r,['lop','class']),level:find(r,['trinhdo','level']),parent:find(r,['phuhuynh','parent']),phone:find(r,['sodienthoai','sdt','phone','zalo','dienthoai']),notes:find(r,['ghichu','note'])})).filter(r=>r.name)}
