<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Flora's Little English World – learn, play, explore and grow in English. A teaching workspace and kids learning world by Teacher Flora.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2255%22 r=%2240%22 fill=%22%23C98B5E%22/><circle cx=%2222%22 cy=%2222%22 r=%2214%22 fill=%22%23C98B5E%22/><circle cx=%2278%22 cy=%2222%22 r=%2214%22 fill=%22%23C98B5E%22/><circle cx=%2238%22 cy=%2250%22 r=%225%22 fill=%22%233A2E5C%22/><circle cx=%2262%22 cy=%2250%22 r=%225%22 fill=%22%233A2E5C%22/><ellipse cx=%2250%22 cy=%2268%22 rx=%2214%22 ry=%2210%22 fill=%22%23F2DCC2%22/></svg>">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flora's Little English World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: fixed left rail of tools (desktop) / drawer (phone); main canvas of paper-tinted panels. Class colours = soft pastels; one eucalyptus accent. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#EDF0E9; --ink:#1E2925; --muted:#65706A; --line:#DCE1D8;
  --accent:#3B6A58; --accent-ink:#FFFFFF; --accent-soft:#DDEAE2;
  --p-lilac:#E7E1F6; --p-peach:#FBE4D7; --p-sky:#DCEBF8; --p-butter:#F7EEC8; --p-rose:#F7DEE6; --p-mint:#D8F0E3;
  --p-ink:#2A2F3A;
  --good:#2F8656; --good-soft:#DCF0E3; --warn:#B57A12; --warn-soft:#F8ECCF; --bad:#BC4238; --bad-soft:#F8DFDC;
  --shadow:0 1px 2px rgba(30,41,37,.06),0 6px 20px rgba(30,41,37,.06);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-kid:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1B2220; --surface-2:#232B28; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2E3834;
  --accent:#86C3AA; --accent-ink:#10201A; --accent-soft:#233A31;
  --p-lilac:#3A3450; --p-peach:#4A372D; --p-sky:#2B3D50; --p-butter:#463F24; --p-rose:#4A2F38; --p-mint:#24443A; --p-ink:#EEF0F5;
  --good:#6BC796; --good-soft:#1F3A2C; --warn:#E3B055; --warn-soft:#3E3320; --bad:#EE8379; --bad-soft:#42241F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B2220; --surface-2:#232B28; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2E3834;
  --accent:#86C3AA; --accent-ink:#10201A; --accent-soft:#233A31;
  --p-lilac:#3A3450; --p-peach:#4A372D; --p-sky:#2B3D50; --p-butter:#463F24; --p-rose:#4A2F38; --p-mint:#24443A; --p-ink:#EEF0F5;
  --good:#6BC796; --good-soft:#1F3A2C; --warn:#E3B055; --warn-soft:#3E3320; --bad:#EE8379; --bad-soft:#42241F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
[data-lucide]{width:18px;height:18px;stroke-width:1.9;flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.2}
.navgrp{margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.topbar{display:none}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2,.panel > .ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{color:var(--muted);font-size:.85rem}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
a.btn{color:var(--ink);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.search{position:relative;flex:1;min-width:180px}
.search [data-lucide]{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.c-lilac{background:var(--p-lilac)} .c-peach{background:var(--p-peach)} .c-sky{background:var(--p-sky)} .c-butter{background:var(--p-butter)} .c-rose{background:var(--p-rose)} .c-mint{background:var(--p-mint)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}

/* tables & lists */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--p-ink);flex:none}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hover{cursor:pointer;transition:transform .15s,box-shadow .15s}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.classhead{border-radius:9px;padding:12px;color:var(--p-ink)}

/* shields (Cambridge YLE style 1–5) */
.shields{display:inline-flex;gap:3px}
.shield{width:16px;height:18px;display:inline-block}
.shield path{fill:var(--surface-2);stroke:var(--line)}
.shield.on path{fill:var(--warn);stroke:var(--warn)}
.shpick{display:inline-flex;gap:4px}
.shpick button{border:0;background:none;padding:2px;cursor:pointer}
.shpick .shield{width:22px;height:24px}

/* week schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.day.today{outline:2px solid var(--accent)}
.day .dh{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.slot{border-radius:8px;padding:6px 8px;font-size:.8rem;color:var(--p-ink);line-height:1.3}
.slot b{display:block}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,19,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(1000px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100% - 32px)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.88rem;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* worksheet A4 */
.sheetwrap{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:20px}
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#1b1b1b;padding:48px 56px;box-shadow:0 2px 14px rgba(0,0,0,.12);font-family:var(--f-kid);font-size:17px}
.sheet h1{font-family:var(--f-kid);font-size:30px;color:#1b1b1b;text-align:center;margin-bottom:4px}
.sheet .sh-meta{display:flex;justify-content:space-between;border-bottom:2px dashed #bbb;padding-bottom:10px;margin-bottom:18px;font-size:16px;gap:20px}
.sheet .instr{font-weight:700;margin:10px 0 14px;font-size:18px}
.sheet .q{margin:0 0 16px;break-inside:avoid}
.sheet .emo{font-size:54px;line-height:1}
.sheet .wline{display:inline-block;border-bottom:2px solid #333;min-width:160px;height:30px;vertical-align:bottom}
.sheet .box{border:2px solid #333;border-radius:14px;padding:12px;text-align:center}
.sheet .key{margin-top:30px;border-top:2px solid #ddd;padding-top:12px;font-size:14px;color:#444;font-family:var(--f-body)}
.sheet .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sheet .scard{border:2px dashed #888;border-radius:16px;padding:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}

/* games: projector stage, deliberately one bright world in both themes */
.stage{background:#FFF8E9;color:#2B2340;border-radius:18px;padding:22px;font-family:var(--f-kid);position:relative;overflow:hidden;min-height:540px;display:flex;flex-direction:column;gap:16px;border:3px solid #2B2340}
.stage.fs{position:fixed;inset:0;border-radius:0;z-index:60;padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));overflow:auto}
.stage h2{font-family:var(--f-kid);font-size:2rem;color:#2B2340}
.stage .sbtn{font-family:var(--f-kid);font-weight:700;font-size:1.25rem;border:3px solid #2B2340;border-radius:16px;padding:10px 20px;background:#fff;color:#2B2340;cursor:pointer;box-shadow:0 4px 0 #2B2340;transition:transform .08s}
.stage .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2B2340}
.stage .sbtn.y{background:#FFD447}.stage .sbtn.p{background:#FF8FB1}.stage .sbtn.b{background:#7FD3FF}.stage .sbtn.g{background:#8EE59B}.stage .sbtn.o{background:#FFAE5C}.stage .sbtn.v{background:#C3A6FF}
.stage .sbtn.right,.story .sbtn.right{background:#8EE59B!important;animation:pop .4s}
.stage .sbtn.wrong,.story .sbtn.wrong{background:#FF8A80!important;animation:shake .4s}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1;min-width:130px;border:3px solid #2B2340;border-radius:16px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;color:#2B2340}
.team.turn{box-shadow:0 0 0 5px #FFD447}
.team .tn{font-weight:800;font-size:1.05rem}
.team .ts{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.team button{width:30px;height:30px;border-radius:50%;border:2px solid #2B2340;background:#fff;color:#2B2340;font-weight:800;cursor:pointer}
.bigemo{font-size:clamp(90px,18vw,200px);line-height:1;text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mbox{aspect-ratio:1/0.8;border:3px solid #2B2340;border-radius:18px;font-size:2.4rem;font-weight:800;cursor:pointer;color:#2B2340;box-shadow:0 5px 0 #2B2340;display:grid;place-items:center;font-family:var(--f-kid)}
.mbox.open{box-shadow:none;transform:translateY(4px);opacity:.35;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;perspective:800px}
.mcard{aspect-ratio:1/1;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip{transform:rotateY(180deg)}
.mcard > div{position:absolute;inset:0;backface-visibility:hidden;border:3px solid #2B2340;border-radius:16px;display:grid;place-items:center;text-align:center;padding:4px}
.mcard .fr{background:#7FD3FF;font-size:2.2rem;font-weight:800}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:clamp(1rem,2.6vw,1.6rem);font-weight:800}
.mcard.done .bk{background:#8EE59B}
.reveal{position:relative;width:min(420px,80vw);aspect-ratio:1/1;margin:0 auto;border:4px solid #2B2340;border-radius:22px;overflow:hidden;background:#fff;display:grid;place-items:center}
.reveal .rv-emo{font-size:min(260px,52vw)}
.reveal .tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.reveal .tiles button{border:2px solid #FFF8E9;font-family:var(--f-kid);font-size:1.6rem;font-weight:800;color:#2B2340;cursor:pointer;transition:opacity .35s}
.reveal .tiles button.gone{opacity:0;pointer-events:none}
.balloons{display:flex;gap:6px;font-size:2.6rem;justify-content:center;min-height:56px}
.balloons span.pop{animation:popout .5s forwards}
.blanks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.blanks span{width:52px;height:64px;border-bottom:5px solid #2B2340;font-size:2.6rem;font-weight:800;text-align:center;text-transform:uppercase}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.keys button{width:46px;height:50px;border:3px solid #2B2340;border-radius:12px;background:#fff;font-family:var(--f-kid);font-size:1.4rem;font-weight:800;cursor:pointer;color:#2B2340}
.keys button:disabled{opacity:.3}
.tilesrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:70px}
.ltile{width:58px;height:64px;border:3px solid #2B2340;border-radius:14px;background:#FFD447;font-size:2rem;font-weight:800;cursor:pointer;color:#2B2340;font-family:var(--f-kid);box-shadow:0 4px 0 #2B2340}
.ltile.slot{background:#fff;box-shadow:none;border-style:dashed}
.wheelwrap{position:relative;width:min(460px,86vw);margin:0 auto}
.wheelwrap canvas{width:100%;height:auto;display:block}
.wheelwrap .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #2B2340;z-index:2}
.gametiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gtile{border-radius:16px;padding:18px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--p-ink);text-align:left;transition:transform .15s}
.gtile:hover{transform:translateY(-3px)}
.gtile .ge{font-size:2.4rem;line-height:1}
.gtile b{font-family:var(--f-display);font-size:1.08rem}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:90;animation:fall 1.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}

/* story player */
.story{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;max-height:72vh;width:100%;color:#2B2340;font-family:var(--f-kid);border:3px solid #2B2340}
.story.fs{position:fixed;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;z-index:60;border:0}
.story .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .5s}
.story .deco{position:absolute;font-size:clamp(28px,6vw,64px);opacity:.9}
.story .actors{position:absolute;left:0;right:0;top:12%;bottom:34%;display:flex;justify-content:center;align-items:flex-end;gap:4%}
.story .actor{font-size:clamp(56px,13vw,150px);line-height:1;display:inline-block}
.a-bounce{animation:bounce 1.4s ease-in-out infinite}.a-float{animation:float 3s ease-in-out infinite}.a-walk{animation:walk 2.2s ease-in-out infinite alternate}.a-wiggle{animation:wiggle 1.2s ease-in-out infinite}.a-enter{animation:enter .9s ease-out both}
@keyframes bounce{50%{transform:translateY(-14%)}}
@keyframes float{50%{transform:translateY(-8%) rotate(-3deg)}}
@keyframes walk{from{transform:translateX(-20%)}to{transform:translateX(20%)}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes enter{from{transform:translateX(-120%) scale(.6);opacity:0}}
.story .caption{position:relative;margin:0 4% 4%;background:rgba(255,255,255,.93);border:3px solid #2B2340;border-radius:18px;padding:12px 18px;font-size:clamp(1.05rem,2.8vw,2rem);font-weight:700;line-height:1.35;text-align:center}
.story .caption .w{border-radius:6px;padding:0 2px;transition:background .15s}
.story .caption .w.hl{background:#FFD447}
.story .sctl{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.story .sctl button{width:42px;height:42px;border-radius:50%;border:2px solid #2B2340;background:#fff;color:#2B2340;display:grid;place-items:center;cursor:pointer}
.story .pg{position:absolute;top:14px;left:16px;background:#fff;border:2px solid #2B2340;border-radius:99px;padding:2px 12px;font-weight:700}
.bg-park{background:linear-gradient(#A8E0FF 0 62%,#9BD77F 62%)}
.bg-garden{background:linear-gradient(#CFF0FF 0 58%,#B5E39A 58%)}
.bg-house{background:linear-gradient(#FFE9C7 0 70%,#D9A877 70%)}
.bg-kitchen{background:linear-gradient(#FDF3DA 0 66%,#E8C9A0 66%)}
.bg-sea{background:linear-gradient(#7FC8F8 0%,#2E86C1 100%)}
.bg-night{background:linear-gradient(#1F2A5A 0%,#3B3F8F 100%);color:#fff}
.bg-rain{background:linear-gradient(#B9C3D0 0 62%,#8FB98A 62%)}
.bg-school{background:linear-gradient(#FFF1D6 0 64%,#C9D9E8 64%)}
.bg-farm{background:linear-gradient(#BDE6FF 0 55%,#E6C86E 55%)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:.84rem;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

.split.ws{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media (max-width:1100px){.split.ws{grid-template-columns:minmax(0,1fr)}}
/* month calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calc{min-height:92px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0;color:var(--ink)}
.calc:hover{background:var(--surface-2)}
.calc.out{opacity:.45}
.calc.today{outline:2px solid var(--accent)}
.calc.sel{background:var(--accent-soft)}
.calev{font-size:.7rem;border-radius:5px;padding:1px 5px;color:var(--p-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media (max-width:640px){.calc{min-height:58px;padding:4px}.calev{font-size:0;height:6px;padding:0}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}.gametiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .rail.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  main{padding-block:18px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g3,.g2,.fgrid{grid-template-columns:minmax(0,1fr)}
  .boxes,.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:1.45rem}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.gametiles{grid-template-columns:minmax(0,1fr)}.opts{grid-template-columns:1fr}.stat .v{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ============ KIDS LEARNING WORLD ============ */
:root{--k-ink:#3A2E5C;--k-muted:#6E6488;--k-bg:#FFF9F1;--k-card:#FFFFFF;--k-line:#EFE6FA;
  --k-lilac:#CDBBFF;--k-peach:#FFC9A8;--k-sky:#AEDBFF;--k-butter:#FFE58F;--k-rose:#FFB8CC;--k-mint:#A9EBC6;--k-sun:#FFD447;--k-grape:#7C5CE0;
  --f-kidh:"Fredoka","Baloo 2",system-ui,sans-serif;--f-kidb:"Nunito","Be Vietnam Pro",system-ui,sans-serif;
  --k-shadow:0 2px 0 rgba(58,46,92,.06),0 12px 28px -10px rgba(91,70,160,.22)}
body.kidsmode{background:var(--k-bg);color:var(--k-ink);font-family:var(--f-kidb);font-size:16px;color-scheme:light}
body.kidsmode .toast{background:var(--k-ink);color:#fff;font-family:var(--f-kidb);border-radius:16px}
#kids{min-height:100vh;min-height:100dvh;background:radial-gradient(1200px 500px at 10% -10%,#FFE3EE 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#DDF1FF 0,transparent 55%),var(--k-bg)}
#kids a{color:inherit;text-decoration:none}
#kids button{font-family:inherit}
.mascot{flex:none;display:block;overflow:visible}
.bob{animation:kbob 3.2s ease-in-out infinite}
.stretch{animation:kstretch 2.4s ease-in-out infinite}
@keyframes kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes kstretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08) translateY(-4px)}}
@keyframes kfloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
@keyframes kdrift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
@keyframes ktwinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes kspin{to{transform:rotate(360deg)}}
@keyframes kburst{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.k-h1{font-family:var(--f-kidh);font-weight:700;font-size:clamp(1.8rem,4.5vw,2.8rem);line-height:1.1;margin:0 0 6px;color:var(--k-ink)}
.k-h2{font-family:var(--f-kidh);font-weight:600;font-size:clamp(1.3rem,3vw,1.7rem);margin:0 0 12px;color:var(--k-ink)}
.k-h3{font-family:var(--f-kidh);font-weight:600;font-size:1.2rem;margin:14px 0 8px;color:var(--k-ink)}
.k-lead{font-size:1.08rem;line-height:1.5;color:var(--k-muted);margin:0 0 10px}
.k-eyebrow{font-family:var(--f-kidh);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:600;color:var(--k-grape);margin:0 0 4px}
.k-note{font-size:.88rem;color:var(--k-muted);display:inline-flex;align-items:center;gap:6px}
.k-note svg{width:16px;height:16px}
.k-link{font-weight:800;color:var(--k-grape)!important}
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-kidh)!important;font-weight:600;font-size:1.05rem;padding:10px 18px;border-radius:999px;border:2px solid var(--k-ink);background:#fff;color:var(--k-ink)!important;cursor:pointer;box-shadow:0 4px 0 var(--k-ink);transition:transform .1s,box-shadow .1s;min-height:44px;text-decoration:none;white-space:nowrap}
.k-btn:hover{transform:translateY(-1px)}
.k-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--k-ink)}
.k-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.k-btn.y{background:var(--k-sun)}
.k-btn.sm{font-size:.95rem;padding:6px 14px;min-height:38px;box-shadow:0 3px 0 var(--k-ink)}
.k-btn svg{width:18px;height:18px}
.k-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--k-line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;color:var(--k-ink)}
.k-pill svg{width:18px;height:18px}
.k-chip{display:inline-block;background:var(--k-lilac);color:var(--k-ink);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.8rem}
.k-card{background:var(--k-card);border-radius:24px;padding:18px;box-shadow:var(--k-shadow);border:2px solid var(--k-line);display:flex;flex-direction:column;gap:8px;min-width:0}
.k-card>b{font-family:var(--f-kidh);font-weight:600;font-size:1.05rem;line-height:1.25}
.k-card>small{color:var(--k-muted)}
.hover{transition:transform .15s,box-shadow .15s}
.hover:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 34px -12px rgba(91,70,160,.35)}
.k-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,240px);gap:14px;overflow-x:auto;padding:4px 4px 12px;scroll-snap-type:x mandatory}
.k-row>*{scroll-snap-align:start}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.k-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.k-back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--k-grape)!important;padding:6px 0}
.k-back svg{width:18px;height:18px}
.k-loading{position:absolute;inset:auto 0 50% 0;text-align:center;color:#fff;font-weight:800;z-index:-1}
/* top bar */
.k-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(255,249,241,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid var(--k-line)}
.k-logo{display:flex;align-items:center;gap:8px;line-height:1.05}
.k-logo b{font-family:var(--f-kidh);font-weight:700;font-size:1.05rem;display:block}
.k-logo small{font-family:var(--f-kidh);font-size:.82rem;color:var(--k-grape);font-weight:600}
.k-nav{display:flex;gap:4px;margin:0 auto}
.k-nav a{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-family:var(--f-kidh);font-weight:600;color:var(--k-muted)!important}
.k-nav a svg{width:18px;height:18px}
.k-nav a:hover{background:#fff}
.k-nav a.on{background:var(--k-ink);color:#fff!important}
.k-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.k-me{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--k-line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;color:var(--k-ink)}
.k-mename{font-weight:800;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-star{display:flex;align-items:center;gap:4px;background:#FFF4CC;border-radius:999px;padding:2px 8px;font-weight:900}
.k-teacher{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--k-muted)!important}
.k-teacher svg{width:18px;height:18px}
.k-teacher:hover{background:#fff}
.k-main{max-width:1180px;margin:0 auto;padding:22px 16px 110px;display:flex;flex-direction:column;gap:26px}
.k-bottom{display:none}
/* welcome */
.k-welcome{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:linear-gradient(180deg,#CFEAFF 0%,#E8E0FF 45%,#FFE6EF 75%,#FFF6E4 100%);padding:40px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:40px;perspective:900px}
.k-welcome::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-120px;height:260px;background:radial-gradient(ellipse at 50% 0,#BDEBC9 0,#9EDDB0 60%);border-radius:50%;z-index:0}
.k-hero{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;max-width:760px}
.k-hero3d{transition:transform .2s ease-out;transform-style:preserve-3d;filter:drop-shadow(0 22px 18px rgba(91,70,160,.25));margin-bottom:6px}
.k-title{font-family:var(--f-kidh);font-weight:700;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1;margin:4px 0 10px;color:var(--k-ink);text-shadow:0 4px 0 #fff,0 8px 0 rgba(124,92,224,.18)}
.k-tag{font-size:clamp(1.05rem,2.6vw,1.35rem);font-weight:800;color:var(--k-grape);margin:0 0 26px}
.k-doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(620px,100%)}
.k-door{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 16px;border-radius:28px;border:3px solid var(--k-ink);box-shadow:0 6px 0 var(--k-ink);background:#fff;transition:transform .12s}
.k-door:hover{transform:translateY(-3px) rotate(-1deg)}
.k-door:active{transform:translateY(4px);box-shadow:0 2px 0 var(--k-ink)}
.k-door.kid{background:var(--k-sun)}
.k-door b{font-family:var(--f-kidh);font-weight:700;font-size:1.35rem}
.k-door small{color:var(--k-ink);opacity:.75;font-weight:700}
.k-doorico{display:grid;place-items:center;height:68px}
.k-doorico svg:not(.mascot){width:48px;height:48px}
.k-float{position:absolute;z-index:1;animation:kfloat 6s ease-in-out infinite;transition:translate .25s ease-out;filter:drop-shadow(0 12px 10px rgba(91,70,160,.2))}
.k-float.f1{left:6%;top:18%}.k-float.f2{right:7%;top:14%;animation-delay:-2s}.k-float.f3{left:10%;top:58%;animation-delay:-4s}.k-float.f4{right:10%;top:56%;animation-delay:-1s}
.k-cloud{position:absolute;z-index:0;width:140px;height:44px;background:#fff;border-radius:999px;opacity:.85;animation:kdrift 60s linear infinite}
.k-cloud::before,.k-cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.k-cloud::before{width:60px;height:60px;left:22px;top:-28px}.k-cloud::after{width:44px;height:44px;left:70px;top:-18px}
.k-cloud.c1{top:8%;animation-duration:70s}.k-cloud.c2{top:30%;animation-duration:90s;animation-delay:-40s;transform:scale(.7)}.k-cloud.c3{top:46%;animation-duration:80s;animation-delay:-20s}
.k-spark{position:absolute;z-index:1;color:#FFC93C;font-size:26px;animation:ktwinkle 2.6s ease-in-out infinite}
.k-spark.s1{left:24%;top:10%}.k-spark.s2{right:26%;top:24%;animation-delay:-1s}.k-spark.s3{left:46%;top:4%;animation-delay:-2s}
.k-meet{position:relative;z-index:2;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.92);border:2px solid var(--k-line);border-radius:30px;padding:18px 24px 18px 18px;box-shadow:var(--k-shadow);max-width:640px;width:100%}
.k-photo{flex:none;width:130px;height:130px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 0 0 4px var(--k-rose),var(--k-shadow);background:#F1EAFB}
.k-photo img{width:100%;height:100%;object-fit:cover;transform-origin:center;display:block}
/* home */
.k-hello{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,#FFE7F0,#E9E1FF 55%,#DDF1FF);border-radius:32px;padding:26px 28px;border:2px solid #fff;box-shadow:var(--k-shadow)}
.k-hellomascot{position:relative;display:flex;flex-direction:column;align-items:center}
.k-bubble{background:#fff;border-radius:18px;padding:8px 14px;font-family:var(--f-kidh);font-weight:600;box-shadow:var(--k-shadow);position:relative;margin-top:6px;text-align:center}
.k-missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.k-mission{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--k-line);border-radius:22px;padding:14px;box-shadow:var(--k-shadow)}
.k-mission.done{border-color:var(--k-mint);background:#F2FFF7}
.k-mission small{color:var(--k-muted);font-weight:800}
.k-micon{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--k-lilac);flex:none}
.k-micon svg{width:24px;height:24px}
.k-prog{height:10px;background:#F0EAFB;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.k-prog i{display:block;height:100%;background:linear-gradient(90deg,#FFC93C,#FF9EBB);border-radius:99px;transition:width .4s}
.k-claimed{display:inline-flex;align-items:center;gap:4px;font-weight:900;color:#2F8656}
.k-claimed svg{width:18px;height:18px}
.k-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.k-tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 10px;border-radius:26px;border:2px solid rgba(255,255,255,.8);box-shadow:var(--k-shadow);transition:transform .15s}
.k-tile:hover{transform:translateY(-5px) rotate(-1deg)}
.k-tile .mascot{transition:transform .3s}
.k-tile:hover .mascot{transform:scale(1.1) rotate(-6deg)}
.k-tile b{font-family:var(--f-kidh);font-weight:600;font-size:1.15rem}
.k-tile small{color:var(--k-muted);font-weight:700}
.t-sky{background:linear-gradient(160deg,#DDF1FF,#AEDBFF)}.t-butter{background:linear-gradient(160deg,#FFF6CC,#FFE58F)}.t-peach{background:linear-gradient(160deg,#FFE9DC,#FFC9A8)}.t-lav{background:linear-gradient(160deg,#F0EAFF,#CDBBFF)}.t-mint{background:linear-gradient(160deg,#E2FAEC,#A9EBC6)}
.k-card.wod{align-items:center;text-align:center;background:linear-gradient(160deg,#FFF6CC,#fff)}
.k-wod{font-size:80px;line-height:1.1}
.k-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.k-minicard{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.9rem;line-height:1.25}
.k-minicard span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.k-thumb{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.k-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.k-thumb.big{border-radius:0;height:100%;aspect-ratio:auto}
.thumbmascot{opacity:.9}
.k-pagehead{display:flex;align-items:center;gap:18px}
.k-pagehead .k-lead{margin:0}
.k-pagehead .row{margin-top:10px}
/* chips */
.k-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.k-chips::-webkit-scrollbar{display:none}
.k-chips button{flex:none;border:2px solid var(--k-line);background:#fff;color:var(--k-ink);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:.92rem;min-height:40px}
.k-chips button.on{background:var(--k-ink);border-color:var(--k-ink);color:#fff}
/* reels */
.reels-wrap{display:flex;flex-direction:column;gap:10px;position:relative;margin:-8px auto 0;width:100%;max-width:1000px}
.reels{height:calc(100dvh - 170px);min-height:460px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:28px;background:#2C2346;outline:none;overscroll-behavior:contain;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reels:focus-visible{box-shadow:0 0 0 4px var(--k-sun)}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0;color:#fff;overflow:hidden}
.reel-media{position:relative;background:#000;min-height:0}
.reel-media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.reel-poster{position:absolute;inset:0;display:grid}
.reel-poster>.k-thumb{grid-area:1/1}
.reel-poster>.k-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(20,14,40,.55))}
.reel-play{grid-area:1/1;place-self:center;z-index:2;width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:rgba(255,212,71,.95);color:var(--k-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.reel-play:hover{transform:scale(1.08)}
.reel-play svg{width:42px;height:42px;margin-left:5px;fill:currentColor}
.reel-ext{grid-area:1/1;place-self:end center;z-index:2;margin:0 12px 20px;background:rgba(255,255,255,.95);color:var(--k-ink);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:360px}
.reel-info{padding:26px 76px 26px 24px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;background:linear-gradient(180deg,#3B2F63,#2C2346)}
.reel-info h2{font-family:var(--f-kidh);font-weight:600;font-size:1.6rem;margin:0;line-height:1.15}
.reel-info p{margin:0;color:#E4DCFF;line-height:1.45}
.reel-meta{display:flex;flex-wrap:wrap;gap:10px 14px;font-weight:800;font-size:.9rem;color:#E4DCFF}
.reel-meta span{display:inline-flex;align-items:center;gap:5px}
.reel-meta svg{width:16px;height:16px}
.reel-vocab{display:flex;flex-wrap:wrap;gap:8px}
.reel-vocab button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.reel-vocab button:hover{background:var(--k-sun);color:var(--k-ink)}
.reel-vocab.big button{background:#F3EEFF;color:var(--k-ink);font-size:1.05rem;padding:8px 14px}
.reel-vocab.big button svg{width:16px;height:16px}
.reel-obj{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;font-weight:700}
.reel-obj svg{width:18px;height:18px;flex:none;margin-top:2px}
.reel-src{font-size:.82rem;opacity:.8}
.reel-side{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:3}
.reel-side>*{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:#fff!important;cursor:pointer;font-weight:800;font-size:.72rem}
.reel-side svg{width:24px;height:24px;padding:11px;box-sizing:content-box;border-radius:50%;background:rgba(255,255,255,.16);transition:transform .15s}
.reel-side>*:hover svg{transform:scale(1.1)}
.reel-side .on svg{background:#FF6F91;fill:#fff}
.reel-count{position:absolute;left:14px;top:12px;z-index:3;background:rgba(0,0,0,.45);border-radius:999px;padding:4px 10px;font-weight:900;font-size:.85rem}
.reel-end{display:grid;grid-template-columns:1fr;place-items:center;padding:20px;background:linear-gradient(160deg,#FFE7F0,#E9E1FF)}
.reel-end .k-card{color:var(--k-ink);align-items:center}
.reel-nav{position:absolute;right:-64px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.reel-nav button{width:48px;height:48px;border-radius:50%;border:2px solid var(--k-ink);background:#fff;color:var(--k-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 var(--k-ink)}
.reels-wrap>.reel-nav{right:-64px}
/* watch */
.k-collections{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.k-col{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:26px;min-height:200px;border:2px solid rgba(255,255,255,.8);box-shadow:var(--k-shadow);overflow:hidden}
.k-col b{font-family:var(--f-kidh);font-weight:600;font-size:1.3rem;margin-top:auto}
.k-col small{color:var(--k-ink);opacity:.75;font-weight:700}
.colm{margin-bottom:6px}
.k-colmeta{font-size:.82rem;font-weight:900;color:var(--k-grape)}
.k-colhead{display:flex;align-items:center;gap:22px;border-radius:30px;padding:24px;box-shadow:var(--k-shadow)}
.k-colhead .k-lead{color:var(--k-ink);opacity:.8}
.k-obj{display:flex;gap:8px;align-items:center;font-weight:800;margin:10px 0 0}
.k-obj svg{width:18px;height:18px}
.k-seen{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:900;color:#2F8656}
.k-seen svg{width:16px;height:16px}
.k-vid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.k-player{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#2C2346;box-shadow:var(--k-shadow)}
.k-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.k-q{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:2px dashed var(--k-line)}
.k-q:first-of-type{border-top:0}
.k-opt{border:2px solid var(--k-ink);background:#fff;color:var(--k-ink);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--k-ink);min-height:42px}
.k-opt.right{background:var(--k-mint);animation:pop .4s}
.k-opt.wrong{background:#FFB4AB;animation:shake .4s}
.k-teachnote{background:#fff;border:2px dashed var(--k-line);border-radius:18px;padding:10px 16px}
.k-teachnote summary{cursor:pointer;font-weight:800;color:var(--k-muted);display:flex;align-items:center;gap:6px}
.k-teachnote summary svg{width:16px;height:16px}
/* games */
.k-gamebar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.k-search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--k-line);border-radius:999px;padding:4px 16px}
.k-search svg{width:18px;height:18px;color:var(--k-muted)}
.k-search input{border:0;outline:0;background:none;font:inherit;font-weight:700;color:var(--k-ink);padding:8px 0;width:100%}
.k-setpick{display:flex;align-items:center;gap:8px;font-weight:800;background:#fff;border:2px solid var(--k-line);border-radius:999px;padding:4px 6px 4px 14px}
.k-setpick svg{width:18px;height:18px}
.k-setpick select{border:0;background:#F3EEFF;border-radius:999px;padding:8px 12px;font:inherit;font-weight:800;color:var(--k-ink);width:auto}
.k-ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.k-gcard{--gc:#fff;position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:26px;background:linear-gradient(180deg,var(--gc,#F3EEFF) 0 92px,#fff 92px);border:2px solid var(--k-line);box-shadow:var(--k-shadow);transition:transform .15s}
.k-gcard:hover{transform:translateY(-4px) rotate(-.5deg)}
.k-gcard .k-gico{display:grid;place-items:center;width:76px;height:76px;border-radius:24px;background:#fff;font-size:44px;box-shadow:var(--k-shadow);margin-bottom:8px}
.k-gcard .k-gico svg{width:36px;height:36px}
.k-gcard b{font-family:var(--f-kidh);font-weight:600;font-size:1.15rem;line-height:1.2}
.k-gcard small{color:var(--k-muted);line-height:1.4;flex:1}
.k-gcard .k-btn{align-self:flex-start;margin-top:6px}
.k-gcard.sm{flex-direction:row;align-items:center;padding:10px 14px;background:var(--gc,#F3EEFF)}
.k-gcard.sm .k-gico{width:48px;height:48px;font-size:28px;margin:0;border-radius:16px}
.k-gcard.sm b{font-size:1rem}
.k-gcard.ext{background:linear-gradient(180deg,var(--k-sky) 0 92px,#fff 92px)}
.k-gmeta{display:flex;gap:6px;flex-wrap:wrap}
.k-gmeta span{background:#F3EEFF;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:800}
.k-fav{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--k-muted);cursor:pointer;display:grid;place-items:center}
.k-fav svg{width:20px;height:20px}
.k-fav.on{color:#FF4F7B}.k-fav.on svg{fill:#FF4F7B}
.k-embed{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#F3EEFF}
.k-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage.kidstage{background:linear-gradient(180deg,#FFFBF2,#FFF3E0);border:3px solid var(--k-ink);border-radius:30px;box-shadow:0 8px 0 var(--k-ink);min-height:480px}
.stage.kidstage h2{font-family:var(--f-kidh);font-weight:600;font-size:clamp(1.3rem,3vw,1.9rem);margin:0}
.kid-how{margin:0;font-weight:700;color:var(--k-muted);font-size:1.05rem}
.matchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.matchcol{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.matchcol .sbtn{min-height:76px}
.sbtn:disabled{opacity:.7;cursor:default}
.clues{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:8px;max-width:520px;font-size:1.25rem;font-weight:700}
.clues li{background:#fff;border:2px solid var(--k-line);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.seqrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:20px}
.sbtn.seq{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;min-height:130px;font-size:1rem;position:relative}
.sbtn.seq>b{position:absolute;left:8px;top:4px;font-size:.9rem;opacity:.6}
.sbtn.slot{border-style:dashed;background:transparent;box-shadow:none;opacity:.6;display:grid;place-items:center}
.chests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px;width:100%;margin:0 auto}
.chest{aspect-ratio:1.2;border-radius:20px;border:3px solid var(--k-ink);background:linear-gradient(180deg,#FFD58A,#E8A24C);box-shadow:0 5px 0 var(--k-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--k-ink);font-weight:800;transition:transform .12s}
.chest span{font-size:clamp(2rem,6vw,3rem);line-height:1}
.chest:hover:not(:disabled){transform:translateY(-3px) rotate(-2deg)}
.chest.open{background:#fff;cursor:default}
.chest.win{background:var(--k-sun);animation:pop .5s}
/* stories */
.k-storycover{aspect-ratio:16/10;border-radius:18px;display:grid;place-items:center;font-size:56px;overflow:hidden}
.kidstory>.row:first-child{display:none}
.kidstory .story{border-radius:28px}
/* adventure */
.k-map{display:flex;flex-direction:column;gap:14px;position:relative;max-width:820px;margin:0 auto;width:100%}
.k-map::before{content:"";position:absolute;left:50%;top:20px;bottom:20px;border-left:6px dotted #D9CCF8;transform:translateX(-50%);z-index:0}
.k-world{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:28px;border:3px solid #fff;box-shadow:var(--k-shadow);width:88%;color:var(--k-ink)}
.k-world.r{align-self:flex-end}
.k-world b{font-family:var(--f-kidh);font-weight:600;font-size:1.3rem;display:block}
.k-world small{display:block;font-weight:700;opacity:.8}
.k-world>svg:last-child{width:28px;height:28px;flex:none}
.k-wnum{position:absolute;left:-12px;top:-12px;width:36px;height:36px;border-radius:50%;background:var(--k-ink);color:#fff;font-family:var(--f-kidh);font-weight:700;display:grid;place-items:center;border:3px solid #fff}
.k-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.k-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:#fff;border:2px solid var(--k-line);border-radius:24px;padding:16px 10px;box-shadow:var(--k-shadow)}
.k-step>svg{width:30px;height:30px;color:var(--k-grape)}
.k-step b{font-family:var(--f-kidh);font-weight:600}
.k-step small{color:var(--k-muted);font-weight:700;flex:1;line-height:1.3}
.k-step.done{background:#F2FFF7;border-color:var(--k-mint)}
.k-stepn{width:34px;height:34px;border-radius:50%;background:var(--k-butter);display:grid;place-items:center;font-weight:900}
.k-stepn svg{width:18px;height:18px}
.k-step.done .k-stepn{background:var(--k-mint)}
/* me / badges */
.k-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.k-badgewrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.k-badgewrap b{font-family:var(--f-kidh);font-weight:600;line-height:1.2}
.k-badgewrap small{color:var(--k-muted);font-size:.8rem;line-height:1.3}
.k-badgewrap.locked{opacity:.45;filter:grayscale(1)}
.k-badge{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF4C2,#FFC93C);border:4px solid #fff;box-shadow:0 0 0 3px #FFC93C,var(--k-shadow);color:#8A5A00}
.k-badge svg{width:34px;height:34px}
.k-badge.big{width:110px;height:110px;margin:10px auto}.k-badge.big svg{width:52px;height:52px}
.k-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.k-pickbtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2px solid var(--k-line);border-radius:22px;padding:12px 6px;cursor:pointer;color:var(--k-ink);font-weight:800;transition:transform .12s}
.k-pickbtn:hover{transform:translateY(-3px)}
.k-pickbtn.on{border-color:var(--k-grape);background:#F3EEFF;box-shadow:0 0 0 3px var(--k-lilac)}
.k-pickbtn b{font-size:.9rem;line-height:1.2}
.modal.kidmodal{background:var(--k-bg);color:var(--k-ink);font-family:var(--f-kidb);border-radius:30px;border:3px solid var(--k-ink)}
.modal.kidmodal header,.modal.kidmodal footer{border-color:var(--k-line)}
.modal.kidmodal header h2,.modal.kidmodal header h3{font-family:var(--f-kidh);font-weight:600}
.modal.kidmodal .icon-btn{color:var(--k-ink)}
.k-break{position:fixed;inset:0;z-index:70;background:rgba(58,46,92,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}
.k-breakcard{background:var(--k-bg);border-radius:32px;padding:28px;max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid var(--k-ink);box-shadow:0 8px 0 var(--k-ink);color:var(--k-ink)}
.starburst{position:fixed;left:50%;top:22%;z-index:90;display:flex;align-items:center;gap:8px;background:#fff;color:var(--k-ink);font-family:var(--f-kidh);font-weight:700;font-size:2rem;padding:10px 22px;border-radius:999px;border:3px solid var(--k-ink);box-shadow:0 6px 0 var(--k-ink);animation:kburst 1.5s ease forwards;pointer-events:none}
#kids .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#kids .grow{flex:1;min-width:0}
/* teacher-side profile + misc */
.banner.info{background:var(--p-sky);color:var(--p-ink)}
.profcard{display:flex;flex-direction:column;gap:14px}
.profphoto{width:220px;height:220px;border-radius:50%;overflow:hidden;margin:0 auto;border:6px solid var(--surface);box-shadow:0 0 0 3px var(--p-rose),var(--shadow);background:var(--surface-2)}
.profphoto img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.navkids{display:flex;align-items:center;gap:10px;margin:10px 4px 0;padding:10px 12px;border-radius:12px;background:linear-gradient(120deg,#FFE7F0,#E9E1FF);color:#3A2E5C!important;font-weight:700;text-decoration:none}
.navkids svg{width:18px;height:18px}
/* responsive */
@media (max-width:1180px){.reel-nav{display:none}}
@media (max-width:980px){.k-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.k-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.k-vid{grid-template-columns:1fr}.k-nav a span{display:none}.k-nav a{padding:10px}}
@media (max-width:760px){
  .k-nav{display:none}.k-mename{display:none}
  .k-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:2px solid var(--k-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .k-bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:800;color:var(--k-muted)!important;padding:4px 6px;border-radius:14px;min-width:52px}
  .k-bottom a svg{width:22px;height:22px}
  .k-bottom a.on{color:var(--k-grape)!important;background:#F3EEFF}
  .k-main{padding:16px 16px 100px;gap:20px}
  .k-hello{flex-direction:column-reverse;text-align:center;padding:20px}.k-hello .row{justify-content:center}
  .k-missions{grid-template-columns:1fr}.k-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.k-tiles>:last-child{grid-column:1/-1}
  .k-split{grid-template-columns:1fr}.k-mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .k-pagehead{flex-direction:column;text-align:center}.k-pagehead .row{justify-content:center}
  .k-colhead{flex-direction:column;text-align:center;padding:20px}.k-colhead .row{justify-content:center}
  .k-doors{grid-template-columns:1fr}.k-meet{flex-direction:column;text-align:center}
  .k-float{transform:scale(.6)}.k-float.f3,.k-float.f4{display:none}
  .reels{height:calc(100dvh - 210px);border-radius:22px}
  .reel{grid-template-columns:1fr;grid-template-rows:minmax(0,1.1fr) minmax(0,1fr)}
  .reel-info{padding:16px 70px 16px 16px;gap:8px}.reel-info h2{font-size:1.25rem}
  .reel-side{top:auto;bottom:16px;transform:none;right:8px}
  .reel-side svg{padding:9px;width:22px;height:22px}
  .reel-play{width:74px;height:74px}
  .k-world{width:100%}.k-map::before{display:none}
  .k-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .matchgrid{gap:10px}.matchcol{grid-template-columns:1fr}
  .seqrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage.kidstage{padding:16px;min-height:420px}
}
@media (prefers-reduced-motion:reduce){.bob,.stretch,.k-float,.k-cloud,.k-spark,.starburst{animation:none!important}.hover:hover,.k-tile:hover,.k-gcard:hover{transform:none}}

</style>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ic=(n,extra='')=>`<i data-lucide="${n}" ${extra}></i>`;
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${+d} ${MON[+m-1]} ${y}`};
const fmtDs=iso=>{if(!iso)return '';const dt=new Date(iso+'T00:00');return `${DOW[dt.getDay()]} ${+iso.slice(8)} ${MON[+iso.slice(5,7)-1]}`};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const initials=n=>(n||'?').split(' ').filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase();
const COLORS=['lilac','peach','sky','butter','rose','mint'];
const LEVELS=['Pre-school','Starters','Movers','Flyers','KET','GrapeSEED','Phonics'];
const SKILLS=[['vocab','Vocabulary'],['pron','Pronunciation'],['fluency','Speaking fluency'],['listen','Listening'],['read','Reading'],['write','Writing'],['grammar','Grammar'],['partic','Participation'],['hw','Homework']];
const HW_ST={done:['Submitted','good'],partial:['Incomplete','warn'],missing:['Missing','bad'],pending:['Not graded','']};

// ---------- state & persistence ----------
const KEYS=['classes','students','lessons','homework','assessments','attendance','library','stories','worksheets','messages','activity','videos','extgames','gsunits','observations','kidprogress'];
const S={settings:{}}; KEYS.forEach(k=>S[k]=[]);
let DB=null, CAP={sample:null,downloads:null,assets:null}, storeMode='loading';
const LS='flora-ws-v1';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
const pend={}, chains={};
function save(...keys){lsSave();keys.forEach(k=>{clearTimeout(pend[k]);pend[k]=setTimeout(()=>flush(k),500)});setSaveState('Saving…')}
// Private per-teacher storage: data/users/<id>/<key>; big lists split into parts under 256 KiB.
let ME=null; const PARTS={};
const docRef=k=>DB.collection('data/users/'+ME).doc(k);
function chunks(items){const out=[[]];let size=0;for(const it of items){const n=JSON.stringify(it).length+1;if(size+n>150000&&out[out.length-1].length){out.push([]);size=0}out[out.length-1].push(it);size+=n}return out}
async function writeKey(k){
  if(k==='settings'){await docRef('settings').set({...S.settings});return}
  const parts=chunks(S[k]);
  for(let i=1;i<parts.length;i++)await docRef(k+'~'+i).set({items:parts[i]});
  await docRef(k).set({items:parts[0],parts:parts.length});
  for(let i=parts.length;i<(PARTS[k]||1);i++){try{await docRef(k+'~'+i).delete()}catch(e){}}
  PARTS[k]=parts.length;
}
async function readKey(k){const s=await docRef(k).get();if(!s.exists)return null;const d=s.data();if(k==='settings')return {...d};
  let items=[...(d.items||[])];const n=d.parts||1;PARTS[k]=n;for(let i=1;i<n;i++){const p=await docRef(k+'~'+i).get();if(p.exists)items=items.concat(p.data().items||[])}return JSON.parse(JSON.stringify(items))}
function flush(k){
  if(!DB){setSaveState(storeMode==='local'?'Saved in this browser':'');return}
