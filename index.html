<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Flora's Teaching Workspace">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flora's Teaching Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: fixed left rail of tools (desktop) / drawer (phone); main canvas of paper-tinted panels. Class colours = soft pastels; one eucalyptus accent. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#EDF0E9; --ink:#1E2925; --muted:#65706A; --line:#DCE1D8;
  --accent:#3B6A58; --accent-ink:#FFFFFF; --accent-soft:#DDEAE2;
  --p-lilac:#E7E1F6; --p-peach:#FBE4D7; --p-sky:#DCEBF8; --p-butter:#F7EEC8; --p-rose:#F7DEE6; --p-mint:#D8F0E3;
  --p-ink:#2A2F3A;
  --good:#2F8656; --good-soft:#DCF0E3; --warn:#B57A12; --warn-soft:#F8ECCF; --bad:#BC4238; --bad-soft:#F8DFDC;
  --shadow:0 1px 2px rgba(30,41,37,.06),0 6px 20px rgba(30,41,37,.06);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-kid:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --surface:#1B2220; --surface-2:#232B28; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2E3834;
  --accent:#86C3AA; --accent-ink:#10201A; --accent-soft:#233A31;
  --p-lilac:#3A3450; --p-peach:#4A372D; --p-sky:#2B3D50; --p-butter:#463F24; --p-rose:#4A2F38; --p-mint:#24443A; --p-ink:#EEF0F5;
  --good:#6BC796; --good-soft:#1F3A2C; --warn:#E3B055; --warn-soft:#3E3320; --bad:#EE8379; --bad-soft:#42241F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B2220; --surface-2:#232B28; --ink:#E5ECE8; --muted:#9BA6A0; --line:#2E3834;
  --accent:#86C3AA; --accent-ink:#10201A; --accent-soft:#233A31;
  --p-lilac:#3A3450; --p-peach:#4A372D; --p-sky:#2B3D50; --p-butter:#463F24; --p-rose:#4A2F38; --p-mint:#24443A; --p-ink:#EEF0F5;
  --good:#6BC796; --good-soft:#1F3A2C; --warn:#E3B055; --warn-soft:#3E3320; --bad:#EE8379; --bad-soft:#42241F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
[data-lucide]{width:18px;height:18px;stroke-width:1.9;flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.2}
.navgrp{margin:12px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.topbar{display:none}
main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2,.panel > .ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{color:var(--muted);font-size:.85rem}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
a.btn{color:var(--ink);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.search{position:relative;flex:1;min-width:180px}
.search [data-lucide]{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.c-lilac{background:var(--p-lilac)} .c-peach{background:var(--p-peach)} .c-sky{background:var(--p-sky)} .c-butter{background:var(--p-butter)} .c-rose{background:var(--p-rose)} .c-mint{background:var(--p-mint)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}

/* tables & lists */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--p-ink);flex:none}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hover{cursor:pointer;transition:transform .15s,box-shadow .15s}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.classhead{border-radius:9px;padding:12px;color:var(--p-ink)}

/* shields (Cambridge YLE style 1–5) */
.shields{display:inline-flex;gap:3px}
.shield{width:16px;height:18px;display:inline-block}
.shield path{fill:var(--surface-2);stroke:var(--line)}
.shield.on path{fill:var(--warn);stroke:var(--warn)}
.shpick{display:inline-flex;gap:4px}
.shpick button{border:0;background:none;padding:2px;cursor:pointer}
.shpick .shield{width:22px;height:24px}

/* week schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(108px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface-2);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.day.today{outline:2px solid var(--accent)}
.day .dh{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.slot{border-radius:8px;padding:6px 8px;font-size:.8rem;color:var(--p-ink);line-height:1.3}
.slot b{display:block}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,19,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(1000px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);animation:fade .2s;max-width:calc(100% - 32px)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:.88rem;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* worksheet A4 */
.sheetwrap{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:20px}
.sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#1b1b1b;padding:48px 56px;box-shadow:0 2px 14px rgba(0,0,0,.12);font-family:var(--f-kid);font-size:17px}
.sheet h1{font-family:var(--f-kid);font-size:30px;color:#1b1b1b;text-align:center;margin-bottom:4px}
.sheet .sh-meta{display:flex;justify-content:space-between;border-bottom:2px dashed #bbb;padding-bottom:10px;margin-bottom:18px;font-size:16px;gap:20px}
.sheet .instr{font-weight:700;margin:10px 0 14px;font-size:18px}
.sheet .q{margin:0 0 16px;break-inside:avoid}
.sheet .emo{font-size:54px;line-height:1}
.sheet .wline{display:inline-block;border-bottom:2px solid #333;min-width:160px;height:30px;vertical-align:bottom}
.sheet .box{border:2px solid #333;border-radius:14px;padding:12px;text-align:center}
.sheet .key{margin-top:30px;border-top:2px solid #ddd;padding-top:12px;font-size:14px;color:#444;font-family:var(--f-body)}
.sheet .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sheet .scard{border:2px dashed #888;border-radius:16px;padding:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}

/* games: projector stage, deliberately one bright world in both themes */
.stage{background:#FFF8E9;color:#2B2340;border-radius:18px;padding:22px;font-family:var(--f-kid);position:relative;overflow:hidden;min-height:540px;display:flex;flex-direction:column;gap:16px;border:3px solid #2B2340}
.stage.fs{position:fixed;inset:0;border-radius:0;z-index:60;padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));overflow:auto}
.stage h2{font-family:var(--f-kid);font-size:2rem;color:#2B2340}
.stage .sbtn{font-family:var(--f-kid);font-weight:700;font-size:1.25rem;border:3px solid #2B2340;border-radius:16px;padding:10px 20px;background:#fff;color:#2B2340;cursor:pointer;box-shadow:0 4px 0 #2B2340;transition:transform .08s}
.stage .sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2B2340}
.stage .sbtn.y{background:#FFD447}.stage .sbtn.p{background:#FF8FB1}.stage .sbtn.b{background:#7FD3FF}.stage .sbtn.g{background:#8EE59B}.stage .sbtn.o{background:#FFAE5C}.stage .sbtn.v{background:#C3A6FF}
.stage .sbtn.right,.story .sbtn.right{background:#8EE59B!important;animation:pop .4s}
.stage .sbtn.wrong,.story .sbtn.wrong{background:#FF8A80!important;animation:shake .4s}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1;min-width:130px;border:3px solid #2B2340;border-radius:16px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;color:#2B2340}
.team.turn{box-shadow:0 0 0 5px #FFD447}
.team .tn{font-weight:800;font-size:1.05rem}
.team .ts{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.team button{width:30px;height:30px;border-radius:50%;border:2px solid #2B2340;background:#fff;color:#2B2340;font-weight:800;cursor:pointer}
.bigemo{font-size:clamp(90px,18vw,200px);line-height:1;text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mbox{aspect-ratio:1/0.8;border:3px solid #2B2340;border-radius:18px;font-size:2.4rem;font-weight:800;cursor:pointer;color:#2B2340;box-shadow:0 5px 0 #2B2340;display:grid;place-items:center;font-family:var(--f-kid)}
.mbox.open{box-shadow:none;transform:translateY(4px);opacity:.35;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;perspective:800px}
.mcard{aspect-ratio:1/1;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip{transform:rotateY(180deg)}
.mcard > div{position:absolute;inset:0;backface-visibility:hidden;border:3px solid #2B2340;border-radius:16px;display:grid;place-items:center;text-align:center;padding:4px}
.mcard .fr{background:#7FD3FF;font-size:2.2rem;font-weight:800}
.mcard .bk{background:#fff;transform:rotateY(180deg);font-size:clamp(1rem,2.6vw,1.6rem);font-weight:800}
.mcard.done .bk{background:#8EE59B}
.reveal{position:relative;width:min(420px,80vw);aspect-ratio:1/1;margin:0 auto;border:4px solid #2B2340;border-radius:22px;overflow:hidden;background:#fff;display:grid;place-items:center}
.reveal .rv-emo{font-size:min(260px,52vw)}
.reveal .tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.reveal .tiles button{border:2px solid #FFF8E9;font-family:var(--f-kid);font-size:1.6rem;font-weight:800;color:#2B2340;cursor:pointer;transition:opacity .35s}
.reveal .tiles button.gone{opacity:0;pointer-events:none}
.balloons{display:flex;gap:6px;font-size:2.6rem;justify-content:center;min-height:56px}
.balloons span.pop{animation:popout .5s forwards}
.blanks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.blanks span{width:52px;height:64px;border-bottom:5px solid #2B2340;font-size:2.6rem;font-weight:800;text-align:center;text-transform:uppercase}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.keys button{width:46px;height:50px;border:3px solid #2B2340;border-radius:12px;background:#fff;font-family:var(--f-kid);font-size:1.4rem;font-weight:800;cursor:pointer;color:#2B2340}
.keys button:disabled{opacity:.3}
.tilesrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:70px}
.ltile{width:58px;height:64px;border:3px solid #2B2340;border-radius:14px;background:#FFD447;font-size:2rem;font-weight:800;cursor:pointer;color:#2B2340;font-family:var(--f-kid);box-shadow:0 4px 0 #2B2340}
.ltile.slot{background:#fff;box-shadow:none;border-style:dashed}
.wheelwrap{position:relative;width:min(460px,86vw);margin:0 auto}
.wheelwrap canvas{width:100%;height:auto;display:block}
.wheelwrap .pin{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #2B2340;z-index:2}
.gametiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gtile{border-radius:16px;padding:18px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--p-ink);text-align:left;transition:transform .15s}
.gtile:hover{transform:translateY(-3px)}
.gtile .ge{font-size:2.4rem;line-height:1}
.gtile b{font-family:var(--f-display);font-size:1.08rem}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:90;animation:fall 1.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes popout{to{transform:scale(1.6);opacity:0}}

/* story player */
.story{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;max-height:72vh;width:100%;color:#2B2340;font-family:var(--f-kid);border:3px solid #2B2340}
.story.fs{position:fixed;inset:0;aspect-ratio:auto;max-height:none;border-radius:0;z-index:60;border:0}
.story .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .5s}
.story .deco{position:absolute;font-size:clamp(28px,6vw,64px);opacity:.9}
.story .actors{position:absolute;left:0;right:0;top:12%;bottom:34%;display:flex;justify-content:center;align-items:flex-end;gap:4%}
.story .actor{font-size:clamp(56px,13vw,150px);line-height:1;display:inline-block}
.a-bounce{animation:bounce 1.4s ease-in-out infinite}.a-float{animation:float 3s ease-in-out infinite}.a-walk{animation:walk 2.2s ease-in-out infinite alternate}.a-wiggle{animation:wiggle 1.2s ease-in-out infinite}.a-enter{animation:enter .9s ease-out both}
@keyframes bounce{50%{transform:translateY(-14%)}}
@keyframes float{50%{transform:translateY(-8%) rotate(-3deg)}}
@keyframes walk{from{transform:translateX(-20%)}to{transform:translateX(20%)}}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes enter{from{transform:translateX(-120%) scale(.6);opacity:0}}
.story .caption{position:relative;margin:0 4% 4%;background:rgba(255,255,255,.93);border:3px solid #2B2340;border-radius:18px;padding:12px 18px;font-size:clamp(1.05rem,2.8vw,2rem);font-weight:700;line-height:1.35;text-align:center}
.story .caption .w{border-radius:6px;padding:0 2px;transition:background .15s}
.story .caption .w.hl{background:#FFD447}
.story .sctl{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.story .sctl button{width:42px;height:42px;border-radius:50%;border:2px solid #2B2340;background:#fff;color:#2B2340;display:grid;place-items:center;cursor:pointer}
.story .pg{position:absolute;top:14px;left:16px;background:#fff;border:2px solid #2B2340;border-radius:99px;padding:2px 12px;font-weight:700}
.bg-park{background:linear-gradient(#A8E0FF 0 62%,#9BD77F 62%)}
.bg-garden{background:linear-gradient(#CFF0FF 0 58%,#B5E39A 58%)}
.bg-house{background:linear-gradient(#FFE9C7 0 70%,#D9A877 70%)}
.bg-kitchen{background:linear-gradient(#FDF3DA 0 66%,#E8C9A0 66%)}
.bg-sea{background:linear-gradient(#7FC8F8 0%,#2E86C1 100%)}
.bg-night{background:linear-gradient(#1F2A5A 0%,#3B3F8F 100%);color:#fff}
.bg-rain{background:linear-gradient(#B9C3D0 0 62%,#8FB98A 62%)}
.bg-school{background:linear-gradient(#FFF1D6 0 64%,#C9D9E8 64%)}
.bg-farm{background:linear-gradient(#BDE6FF 0 55%,#E6C86E 55%)}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:.84rem;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

.split.ws{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media (max-width:1100px){.split.ws{grid-template-columns:minmax(0,1fr)}}
/* month calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calc{min-height:92px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0;color:var(--ink)}
.calc:hover{background:var(--surface-2)}
.calc.out{opacity:.45}
.calc.today{outline:2px solid var(--accent)}
.calc.sel{background:var(--accent-soft)}
.calev{font-size:.7rem;border-radius:5px;padding:1px 5px;color:var(--p-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media (max-width:640px){.calc{min-height:58px;padding:4px}.calev{font-size:0;height:6px;padding:0}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}.gametiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .rail.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  main{padding-block:18px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g3,.g2,.fgrid{grid-template-columns:minmax(0,1fr)}
  .boxes,.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:1.45rem}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.gametiles{grid-template-columns:minmax(0,1fr)}.opts{grid-template-columns:1fr}.stat .v{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</head><body>

<div class="app" id="app">
  <aside class="rail" id="rail">
    <div class="brand"><div class="mark">F</div><div><b>Cô Flora</b><span class="muted small">English Workspace</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div style="flex:1"></div>
    <div class="muted small" id="saveState" style="padding:8px 10px"></div>
  </aside>
  <div style="min-width:0">
    <div class="topbar"><button class="icon-btn" id="menuBtn" aria-label="Mở menu"><i data-lucide="menu"></i></button><b style="font-family:var(--f-display)">Cô Flora · English</b></div>
    <main id="main"><div class="page"><div class="empty">Đang mở lớp học của cô Flora…</div></div></main>
  </div>
</div>
<div id="layer"></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ================= CORE =================
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ic=(n,extra='')=>`<i data-lucide="${n}" ${extra}></i>`;
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const DOW=['CN','T2','T3','T4','T5','T6','T7'];
const fmtD=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const fmtDs=iso=>{if(!iso)return '';const dt=new Date(iso+'T00:00');return `${DOW[dt.getDay()]} ${iso.slice(8)}/${iso.slice(5,7)}`};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const initials=n=>(n||'?').split(' ').filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase();
const COLORS=['lilac','peach','sky','butter','rose','mint'];
const LEVELS=['Pre-school','Starters','Movers','Flyers','KET','GrapeSEED','Phonics'];
const SKILLS=[['vocab','Từ vựng'],['pron','Phát âm'],['fluency','Nói lưu loát'],['listen','Nghe hiểu'],['read','Đọc'],['write','Viết'],['grammar','Ngữ pháp'],['partic','Tham gia lớp'],['hw','Bài tập về nhà']];
const HW_ST={done:['Đã nộp','good'],partial:['Chưa đủ','warn'],missing:['Chưa nộp','bad'],pending:['Chưa chấm','']};

// ---------- state & persistence ----------
const KEYS=['classes','students','lessons','homework','assessments','attendance','library','stories','worksheets','messages','activity'];
const S={settings:{}}; KEYS.forEach(k=>S[k]=[]);
let DB=null, CAP={sample:null,downloads:null,assets:null}, storeMode='loading';
const LS='flora-ws-v1';
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');return v}catch(e){return null}}
const pend={}, chains={};
function save(...keys){
  lsSave();
  keys.forEach(k=>{clearTimeout(pend[k]);pend[k]=setTimeout(()=>flush(k),500)});
  setSaveState('Đang lưu…');
}
// Private per-teacher storage: data/users/<id>/<key>; big lists split into parts under 256 KiB.
let ME=null; const PARTS={};
const docRef=k=>DB.collection('data/users/'+ME).doc(k);
function chunks(items){const out=[[]];let size=0;for(const it of items){const n=JSON.stringify(it).length+1;if(size+n>150000&&out[out.length-1].length){out.push([]);size=0}out[out.length-1].push(it);size+=n}return out}
async function writeKey(k){
  if(k==='settings'){await docRef('settings').set({...S.settings});return}
  const parts=chunks(S[k]);
  for(let i=1;i<parts.length;i++)await docRef(k+'~'+i).set({items:parts[i]});
  await docRef(k).set({items:parts[0],parts:parts.length});
  for(let i=parts.length;i<(PARTS[k]||1);i++){try{await docRef(k+'~'+i).delete()}catch(e){}}
  PARTS[k]=parts.length;
}
async function readKey(k){const s=await docRef(k).get();if(!s.exists)return null;const d=s.data();if(k==='settings')return {...d};
  let items=[...(d.items||[])];const n=d.parts||1;PARTS[k]=n;for(let i=1;i<n;i++){const p=await docRef(k+'~'+i).get();if(p.exists)items=items.concat(p.data().items||[])}return JSON.parse(JSON.stringify(items))}
function flush(k){
  if(!DB){setSaveState(storeMode==='local'?'Đã lưu trên trình duyệt này':'');return}
  chains[k]=(chains[k]||Promise.resolve()).then(()=>writeKey(k)).then(()=>setSaveState('Đã lưu ✓')).catch(e=>{
    setSaveState('Chưa lưu được');
    toast(e&&e.code==='quota_exceeded'?'Bộ nhớ đã đầy, hãy xoá bớt tệp hoặc dữ liệu cũ.':'Chưa lưu được lên máy chủ. Dữ liệu vẫn còn trên trình duyệt này.');
  });
}
function setSaveState(t){const el=$('#saveState');if(el)el.innerHTML=t?ic('cloud')+' '+esc(t):'';el&&window.lucide&&lucide.createIcons({nameAttr:'data-lucide'})}
function log(text,icon='sparkles'){S.activity.unshift({id:uid('a'),date:new Date().toISOString(),text,icon});S.activity=S.activity.slice(0,60);save('activity')}

async function boot(){
  render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const local=lsLoad();if(local){KEYS.forEach(k=>{if(Array.isArray(local[k]))S[k]=local[k]});S.settings={...(local.settings||{})};applyTheme();render()}
  const [smp,dl,as,db,usr]=await Promise.all([use('sample'),use('downloads'),use('assets'),use('db'),use('user')]);
  CAP.sample=smp;CAP.downloads=dl;CAP.assets=as;
  try{ME=usr?await usr.id():null}catch(e){ME=null}
  DB=db&&ME?db:null;
  let loaded=false;
  if(DB){
    try{
      const timeout=new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000));
      const vals=await Promise.race([Promise.all([...KEYS,'settings'].map(readKey)),timeout]);
      vals.forEach((v,i)=>{const k=[...KEYS,'settings'][i];if(v!==null){loaded=true;if(k==='settings')S.settings=v;else S[k]=v}});
      storeMode='db';
      if(!loaded&&local){KEYS.forEach(k=>save(k));save('settings');loaded=true}
      setSaveState('Đã đồng bộ ✓');
    }catch(e){console.warn(e);DB=null;storeMode='local';setSaveState('Đang lưu trên trình duyệt này')}
  }else{storeMode='local';setSaveState('Đang lưu trên trình duyệt này')}
  if(!loaded&&!local&&!S.settings.started){const smp2=makeSample();KEYS.forEach(k=>S[k]=smp2[k]||[]);S.settings={teacher:'Flora',sample:true,started:true};KEYS.forEach(k=>save(k));save('settings')}
  applyTheme();render();
}

// ---------- lookups ----------
const cls=id=>S.classes.find(c=>c.id===id);
const stu=id=>S.students.find(s=>s.id===id);
const studentsOf=cid=>S.students.filter(s=>s.classId===cid);
const clsName=id=>cls(id)?.name||'—';
function latestAssess(sid){return S.assessments.filter(a=>a.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function avgScore(a){if(!a)return null;const v=Object.values(a.scores||{}).filter(x=>x>0);return v.length?avg(v):null}
function hwStats(sid){let done=0,partial=0,missing=0,total=0;S.homework.forEach(h=>{const r=h.records?.[sid];if(!r)return;if(r.status==='pending')return;total++;if(r.status==='done')done++;else if(r.status==='partial')partial++;else missing++});return {done,partial,missing,total,rate:total?Math.round((done+partial*.5)/total*100):null}}
function attRate(sid){const s=stu(sid);if(!s)return null;let p=0,t=0;S.attendance.filter(a=>a.classId===s.classId).forEach(a=>{const r=a.records?.[sid];if(!r)return;t++;if(r!=='absent')p++});return t?Math.round(p/t*100):null}
function needsSupport(s){const a=avgScore(latestAssess(s.id));const h=hwStats(s.id);const reasons=[];if(a!==null&&a<3)reasons.push('Điểm kỹ năng thấp');if(h.missing>=2)reasons.push(`${h.missing} bài chưa nộp`);const at=attRate(s.id);if(at!==null&&at<75)reasons.push('Hay vắng');return reasons}
function hwTargets(h){return h.scope==='students'?(h.studentIds||[]):studentsOf(h.classId).map(s=>s.id)}

// ---------- UI helpers ----------
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function icons(){window.lucide&&lucide.createIcons()}
function shieldSvg(on){return `<svg class="shield ${on?'on':''}" viewBox="0 0 16 18" aria-hidden="true"><path d="M8 1 15 3.5v5.2c0 4-3 7-7 8.3C4 15.7 1 12.7 1 8.7V3.5z" stroke-width="1.2"/></svg>`}
function shields(n){n=Math.round(n||0);let h='';for(let i=1;i<=5;i++)h+=shieldSvg(i<=n);return `<span class="shields" title="${n}/5 khiên">${h}</span>`}
function avatar(s,big){const c=cls(s.classId)?.color||COLORS[(s.name||'').length%6];return `<span class="avatar c-${c}" ${big?'style="width:56px;height:56px;font-size:1.2rem"':''}>${esc(initials(s.name))}</span>`}
function bar(pct,color){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct||0))}%;${color?`background:${color}`:''}"></i></div>`}
function opt(list,val,empty){return (empty!==undefined?`<option value="">${esc(empty)}</option>`:'')+list.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`}).join('')}
const classOpts=(val,empty)=>opt(S.classes.map(c=>[c.id,c.name]),val,empty);

function modal({title,body,wide,footer,onMount}){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><header><h2>${esc(title)}</h2><button class="icon-btn" data-x aria-label="Đóng">${ic('x')}</button></header><div class="mb">${body}</div>${footer?`<footer>${footer}</footer>`:''}</div>`;
  const close=()=>{bg.remove();document.removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-x]'))close()});
  $('#layer').appendChild(bg);icons();
  onMount&&onMount(bg.querySelector('.modal'),close);
  return close;
}
function confirmBox(text,onYes,yes='Xoá'){
  modal({title:'Xác nhận',body:`<p style="margin:0">${esc(text)}</p>`,footer:`<button class="btn" data-x>Huỷ</button><button class="btn pri" id="cfYes">${esc(yes)}</button>`,onMount:(m,close)=>{$('#cfYes',m).onclick=()=>{close();onYes()}}});
}
// generic form: fields [{k,label,type,opts,full,ph}]
function formModal({title,fields,data={},onSave,wide,extraFooter=''}){
  const f=fields.map(x=>{
    const v=data[x.k]??x.def??'';const cl=x.full?'full':'';
    let inp;
    if(x.type==='select')inp=`<select id="f_${x.k}">${x.opts(v)}</select>`;
    else if(x.type==='textarea')inp=`<textarea id="f_${x.k}" rows="${x.rows||3}" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
    else if(x.type==='days')inp=`<div class="row">${[1,2,3,4,5,6,0].map(d=>`<label class="chip" style="cursor:pointer"><input type="checkbox" data-day="${d}" ${(v||[]).includes(d)?'checked':''}> ${DOW[d]}</label>`).join('')}</div>`;
    else if(x.type==='color')inp=`<div class="row">${COLORS.map(c=>`<label style="cursor:pointer"><input type="radio" name="f_color" value="${c}" ${v===c?'checked':''}> <span class="dot c-${c}" style="width:22px;height:22px"></span></label>`).join('')}</div>`;
    else inp=`<input id="f_${x.k}" type="${x.type||'text'}" value="${esc(v)}" placeholder="${esc(x.ph||'')}">`;
    return `<label class="f ${cl}">${esc(x.label)}${inp}</label>`}).join('');
  modal({title,wide,body:`<form class="fgrid" id="fm">${f}<button type="submit" hidden></button></form>`,footer:`${extraFooter}<button class="btn" data-x>Huỷ</button><button class="btn pri" id="fmSave">${ic('check')} Lưu</button>`,onMount:(m,close)=>{
    const go=e=>{e&&e.preventDefault();const out={...data};fields.forEach(x=>{
      if(x.type==='days')out[x.k]=$$('[data-day]',m).filter(i=>i.checked).map(i=>+i.dataset.day);
      else if(x.type==='color')out[x.k]=($('[name=f_color]:checked',m)||{}).value||COLORS[0];
      else{let v=$('#f_'+x.k,m).value;if(x.type==='number')v=v===''?'':+v;out[x.k]=v}});
      if(fields[0]&&!String(out[fields[0].k]||'').trim()){toast('Hãy điền '+fields[0].label.toLowerCase());return}
      close();onSave(out)};
    $('#fm',m).onsubmit=go;$('#fmSave',m).onclick=go;}});
}
async function download(filename,data,label){
  if(!CAP.downloads){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(filename)?'text/html;charset=utf-8':/\.json$/.test(filename)?'application/json':'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast((label||'Tệp')+' đã được tải về')}catch(e){toast('Chưa tải được tệp trong chế độ xem này')}return}
  try{await CAP.downloads.save({filename,data});toast((label||'Tệp')+' đã sẵn sàng')}catch(e){if(e&&e.code!=='cancelled')toast('Chưa tải được tệp: '+(e.message||''))}
}
function csv(rows){return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n')}
function printable(title,inner,extraCss=''){
  const css=[...document.styleSheets].map(ss=>{try{return [...ss.cssRules].map(r=>r.cssText).join('\n')}catch(e){return ''}}).join('\n');
  return `<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>${esc(title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Baloo+2:wght@600;700;800&display=swap"><style>${css}
@page{size:A4;margin:0}body{background:#fff;margin:0}.sheet{box-shadow:none;margin:0 auto;page-break-after:always}${extraCss}</style></head><body>${inner}<script>window.onload=()=>setTimeout(()=>window.print(),600)<\/script></body></html>`;
}
function speak(text,opts={}){
  try{if(!('speechSynthesis' in window))return null;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=opts.rate||.85;u.pitch=opts.pitch||1.05;
    const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));const pref=v.find(x=>/female|samantha|zira|aria|jenny|google us/i.test(x.name))||v[0];if(pref)u.voice=pref;
    if(opts.onboundary)u.onboundary=opts.onboundary;if(opts.onend)u.onend=opts.onend;speechSynthesis.speak(u);return u}catch(e){return null}
}
let AC=null;
function sfx(type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;const notes={ok:[523,659,784],bad:[220,180],pop:[880],tick:[660],win:[523,659,784,1047]}[type]||[440];
  notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.18,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.22);o.connect(g);g.connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.25)})}catch(e){}}
function confetti(n=60){const cs=['#FFD447','#FF8FB1','#7FD3FF','#8EE59B','#C3A6FF','#FFAE5C'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=pick(cs);d.style.animationDelay=Math.random()*.5+'s';d.style.animationDuration=1.2+Math.random()+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}

let ROUTE='tong-quan', ARG='';
function parseHash(){const h=(location.hash||'').slice(1);const r=ROUTES.find(x=>x[0]!=='grp'&&(h===x[0]||h.startsWith(x[0]+'-')));ROUTE=r?r[0]:'tong-quan';ARG=r&&h.length>r[0].length?h.slice(r[0].length+1):''}
function go(h){if(location.hash==='#'+h)render();else location.hash=h}
function render(){
  $('#nav').innerHTML=ROUTES.map(r=>r[0]==='grp'?`<div class="navgrp eyebrow">${r[1]}</div>`:`<a href="#${r[0]}" class="${ROUTE===r[0]?'on':''}">${ic(r[2])}<span>${r[1]}</span></a>`).join('');
  const main=$('#main');
  try{main.innerHTML=`<div class="page">${(VIEWS[ROUTE]||VIEWS['tong-quan'])()}</div>`}catch(e){console.error(e);main.innerHTML=`<div class="page"><div class="empty">Có lỗi khi hiển thị trang này: ${esc(e.message)}</div></div>`}
  icons();
  (VIEWS[ROUTE+':after']||(()=>{}))();
}
window.addEventListener('hashchange',()=>{parseHash();$('#rail').classList.remove('open');render();window.scrollTo(0,0)});
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
function sampleBanner(){return S.settings.sample?`<div class="banner">${ic('info')}<span>Đây là <b>dữ liệu mẫu</b> để cô xem thử. Khi sẵn sàng, vào <a href="#du-lieu">Dữ liệu & Sao lưu</a> để xoá mẫu và nhập học sinh thật.</span></div>`:''}
function head(title,sub,actions=''){return `<div class="pagehead"><div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div><div class="row">${actions}</div></div>`}

VIEWS['tong-quan']=()=>{
  const t=todayISO();
  const active=S.classes.filter(c=>c.active!==false);
  const upcoming=S.lessons.filter(l=>l.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  let done=0,tot=0;S.homework.forEach(h=>hwTargets(h).forEach(sid=>{const r=h.records?.[sid];if(r&&r.status!=='pending'){tot++;if(r.status==='done')done++;else if(r.status==='partial')done+=.5}}));
  const rate=tot?Math.round(done/tot*100):0;
  const support=S.students.map(s=>({s,r:needsSupport(s)})).filter(x=>x.r.length).slice(0,6);
  // week grid from Monday
  const d0=new Date(t+'T00:00');const mon=addDays(t,-((d0.getDay()+6)%7));
  const week=[...Array(7)].map((_,i)=>{const iso=addDays(mon,i);const dow=new Date(iso+'T00:00').getDay();
    const slots=active.filter(c=>(c.days||[]).includes(dow)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    return `<div class="day ${iso===t?'today':''}"><div class="dh"><span>${DOW[dow]}</span><span class="num">${iso.slice(8)}/${iso.slice(5,7)}</span></div>${slots.map(c=>{const l=S.lessons.find(x=>x.classId===c.id&&x.date===iso);return `<div class="slot c-${c.color}" ${l?`data-go="giao-an-${l.id}" style="cursor:pointer"`:''}><b>${esc(c.time||'')} · ${esc(c.name)}</b>${l?esc(l.title):'<span style="opacity:.7">Chưa có giáo án</span>'}</div>`}).join('')||'<span class="muted small">Nghỉ</span>'}</div>`}).join('');
  const hello=new Date().getHours()<11?'Chào buổi sáng':new Date().getHours()<17?'Chào buổi chiều':'Chào buổi tối';
  const acts=S.activity.slice(0,7);
  return `${head(`${hello}, cô ${esc(S.settings.teacher||'Flora')}`,`Hôm nay là ${fmtDs(t)}. Đây là những việc cần để ý trong tuần.`,`<button class="btn" data-go="tro-choi">${ic('gamepad-2')} Mở trò chơi</button><button class="btn pri" onclick="A.newLesson()">${ic('plus')} Soạn giáo án</button>`)}
  ${sampleBanner()}
  <div class="grid g4">
    <div class="stat"><span class="v">${S.students.length}</span><span class="l">Học sinh</span></div>
    <div class="stat"><span class="v">${active.length}</span><span class="l">Lớp đang dạy</span></div>
    <div class="stat"><span class="v">${S.lessons.filter(l=>l.date>=t&&l.date<=addDays(t,7)).length}</span><span class="l">Buổi học trong 7 ngày tới</span></div>
    <div class="stat"><span class="v">${rate}%</span><span class="l">Tỉ lệ nộp bài tập về nhà</span>${bar(rate,rate<60?'var(--bad)':rate<80?'var(--warn)':'var(--good)')}</div>
  </div>
  <div class="panel"><div class="ph"><h2>Lịch dạy tuần này</h2><a class="btn sm ghost" href="#lop-hoc">${ic('settings-2')} Sửa lịch lớp</a></div><div class="week">${week}</div></div>
  <div class="split">
    <div class="panel"><div class="ph"><h2>Buổi học sắp tới</h2><a class="btn sm ghost" href="#giao-an">Tất cả giáo án ${ic('arrow-right')}</a></div>
      <div class="list">${upcoming.map(l=>{const c=cls(l.classId);return `<div class="li" style="cursor:pointer" data-go="giao-an-${l.id}"><span class="dot c-${c?.color||'mint'}" style="width:12px;height:12px"></span><div class="grow"><b class="ellip" style="display:block">${esc(l.title)}</b><span class="muted small">${esc(c?.name||'')} · ${esc(l.template||'')}</span></div><span class="chip num">${fmtDs(l.date)} ${esc(l.time||'')}</span></div>`}).join('')||'<div class="empty">Chưa có buổi học nào sắp tới. Bấm "Soạn giáo án" để bắt đầu.</div>'}</div></div>
    <div class="panel"><div class="ph"><h2>Học sinh cần hỗ trợ thêm</h2></div>
      <div class="list">${support.map(({s,r})=>`<div class="li" style="cursor:pointer" data-go="lop-hoc-hs-${s.id}">${avatar(s)}<div class="grow"><b>${esc(s.name)}</b><div class="row" style="gap:4px;margin-top:2px">${r.map(x=>`<span class="chip warn">${esc(x)}</span>`).join('')}</div></div></div>`).join('')||'<div class="empty">Cả lớp đang theo kịp. Tuyệt vời!</div>'}</div></div>
  </div>
  <div class="split">
    <div class="panel"><h2>Công cụ hay dùng</h2>
      <div class="grid g3">${[['Điểm danh','calendar-check','lop-hoc'],['Giao bài tập','clipboard-plus','bai-tap'],['Tạo phiếu bài tập','file-text','phieu'],['Chiếu phim truyện','clapperboard','phim-truyen'],['Nhắn phụ huynh','message-circle-heart','phu-huynh'],['Hỏi trợ lý AI','sparkles','tro-ly']].map(([l,i,r])=>`<button class="btn" style="justify-content:flex-start;padding:12px" data-go="${r}">${ic(i)} ${l}</button>`).join('')}</div></div>
    <div class="panel"><h2>Hoạt động gần đây</h2><div class="list">${acts.map(a=>`<div class="li">${ic(a.icon||'dot')}<div class="grow small">${esc(a.text)}</div><span class="muted small num">${fmtD(a.date.slice(0,10)).slice(0,5)}</span></div>`).join('')||'<div class="empty">Chưa có hoạt động.</div>'}</div></div>
  </div>`;
};

  ${list.map(s=>{const a=avgScore(latestAssess(s.id));const h=hwStats(s.id);return `<tr class="click" data-go="lop-hoc-hs-${s.id}"><td><div class="row" style="flex-wrap:nowrap">${avatar(s)}<div><b>${esc(s.name)}</b><div class="muted small">${esc(s.eng||'')}</div></div></div></td><td>${esc(clsName(s.classId))}</td><td class="num">${esc(s.age||'')}</td><td>${esc(s.level||'')}</td><td>${a!==null?shields(a):'<span class="muted small">Chưa đánh giá</span>'}</td><td class="num">${h.rate!==null?h.rate+'%':'—'}</td><td><button class="icon-btn" onclick="event.stopPropagation();A.editStudent('${s.id}')" aria-label="Sửa">${ic('pencil')}</button></td></tr>`}).join('')||'<tr><td colspan="7"><div class="empty">Không tìm thấy học sinh.</div></td></tr>'}

    {k:'name',label:'Tên lớp',ph:'VD: Movers 2A'},{k:'level',label:'Trình độ / Chương trình',type:'select',opts:v=>opt(LEVELS,v)},
    {k:'days',label:'Ngày học trong tuần',type:'days',full:true},{k:'time',label:'Giờ bắt đầu',type:'time'},{k:'duration',label:'Thời lượng (phút)',type:'number'},
    {k:'room',label:'Phòng học / Địa điểm'},{k:'color',label:'Màu lớp',type:'color'},{k:'note',label:'Ghi chú',type:'textarea',full:true}],

function studentProfile(id){const s=stu(id);if(!s)return '<div class="empty">Không tìm thấy học sinh.</div>';
  const as=S.assessments.filter(a=>a.studentId===id).sort((a,b)=>a.date.localeCompare(b.date));const last=as[as.length-1];

    ${as.length>1?`<h3 style="margin:16px 0 8px">Tiến bộ theo thời gian</h3>${lineChart(as)}`:''}</div>
   <div style="display:flex;flex-direction:column;gap:16px">

A.addHist=id=>{const v=$('#histIn').value.trim();if(!v)return;const s=stu(id);(s.history=s.history||[]).push({date:todayISO(),text:v});save('students');render()};

function lineChart(as){const W=560,H=200,P=30;const xs=i=>P+(as.length===1?0:i*(W-P*2)/(as.length-1));const ys=v=>H-24-(v-1)/4*(H-48);
  const avgPts=as.map((a,i)=>[xs(i),ys(avgScore(a)||1)]);
  const keys=[['vocab','var(--accent)'],['pron','#C98AD6'],['listen','#4F9BD9'],['write','#E0894F']];
  const lines=keys.map(([k,c])=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" stroke-opacity=".55" points="${as.map((a,i)=>xs(i)+','+ys(a.scores?.[k]||1)).join(' ')}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${[1,2,3,4,5].map(v=>`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="6" y="${ys(v)+4}">${v}</text>`).join('')}
  ${lines}<polygon fill="var(--accent-soft)" opacity=".6" points="${P},${ys(1)} ${avgPts.map(p=>p.join(',')).join(' ')} ${xs(as.length-1)},${ys(1)}"/><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${avgPts.map(p=>p.join(',')).join(' ')}"/>${avgPts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===avgPts.length-1?5:3}" fill="var(--accent)"/><text x="${p[0]}" y="${H-6}" text-anchor="middle">${fmtD(as[i].date).slice(0,5)}</text>`).join('')}</svg>
  <div class="row small muted"><span><span class="dot" style="background:var(--accent)"></span> Trung bình</span>${keys.slice(1).map(([k,c])=>`<span><span class="dot" style="background:${c}"></span> ${SKILLS.find(s=>s[0]===k)[1]}</span>`).join('')}<span><span class="dot" style="background:var(--accent);opacity:.55"></span> Từ vựng</span></div></div>`}
const RECO={vocab:'Ôn từ vựng 10 phút/ngày bằng thẻ hình; chơi "Hình gì đây?" và "Lật thẻ trí nhớ" ở lớp.',pron:'Luyện âm đầu bằng bài phonics ngắn, cho con nghe – nhắc lại (shadowing) với truyện có đọc to.',fluency:'Cho con trả lời câu hỏi bằng câu đầy đủ; dùng thẻ nói (speaking cards) theo cặp.',listen:'Nghe truyện 2 lần: lần 1 xem tranh, lần 2 trả lời câu hỏi; chơi "Nghe và chọn".',read:'Đọc to 1 đoạn ngắn mỗi tối, chỉ tay theo chữ; đoán nghĩa từ qua tranh.',write:'Viết 3 câu mẫu theo khung "I like… / I can…"; luyện chép chính tả từ khoá.',grammar:'Ôn 1 mẫu câu mỗi buổi qua trò xếp câu; sửa lỗi nhẹ nhàng bằng cách nhắc lại câu đúng.',partic:'Giao vai trò nhỏ (phát thẻ, đếm điểm đội), khen ngay khi con giơ tay.',hw:'Nhắn phụ huynh nhắc lịch BTVN; chia bài thành phần ngắn 10–15 phút.'};
function recos(s,last){if(!last)return '<p class="muted small" style="margin:0">Gợi ý sẽ xuất hiện sau lần đánh giá đầu tiên.</p>';
  const low=SKILLS.map(([k,l])=>({k,l,v:last.scores?.[k]||0})).filter(x=>x.v>0).sort((a,b)=>a.v-b.v).slice(0,3);
  const top=SKILLS.map(([k,l])=>({k,l,v:last.scores?.[k]||0})).sort((a,b)=>b.v-a.v)[0];
  return `<div class="list">${low.map(x=>`<div class="li" style="align-items:flex-start"><span class="chip ${x.v<3?'warn':'acc'}">${x.l}</span><div class="grow small">${RECO[x.k]}</div></div>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Thế mạnh: <b>${top.l}</b> – hãy giao con làm “trợ giảng nhí” ở phần này.</p>`}
A.addAssess=(sid,aid)=>{const a=aid?S.assessments.find(x=>x.id===aid):{studentId:sid,date:todayISO(),type:'Đánh giá định kỳ',scores:{...(latestAssess(sid)?.scores||{})}};
  const sc={...a.scores};
  modal({title:(aid?'Sửa đánh giá – ':'Đánh giá – ')+(stu(sid)?.name||''),body:`<div class="fgrid"><label class="f">Ngày<input type="date" id="asD" value="${a.date}"></label><label class="f">Loại đánh giá<select id="asT">${opt(['Đánh giá định kỳ','Kiểm tra giữa kỳ','Kiểm tra cuối kỳ','Mock test Cambridge','Quan sát trên lớp'],a.type)}</select></label></div>
   <p class="small muted" style="margin:0">Chấm theo thang 5 khiên như chứng chỉ Cambridge Young Learners.</p>
   <div class="list">${SKILLS.map(([k,l])=>`<div class="li"><span style="width:140px">${l}</span><span class="shpick" data-k="${k}">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}" aria-label="${i} khiên">${shieldSvg(i<=(sc[k]||0))}</button>`).join('')}</span></div>`).join('')}</div>
   <label class="f">Nhận xét<textarea id="asN">${esc(a.note||'')}</textarea></label>`,
   footer:`${aid?`<button class="btn danger" style="margin-right:auto" id="asDel">${ic('trash-2')} Xoá</button>`:''}<button class="btn" data-x>Huỷ</button><button class="btn pri" id="asSave">${ic('check')} Lưu đánh giá</button>`,
   onMount:(m,close)=>{$$('.shpick',m).forEach(p=>p.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=p.dataset.k;sc[k]=+b.dataset.v;$$('button',p).forEach((x,i)=>x.innerHTML=shieldSvg(i<sc[k]))});
    $('#asSave',m).onclick=()=>{Object.assign(a,{date:$('#asD',m).value,type:$('#asT',m).value,note:$('#asN',m).value,scores:sc});if(!aid){a.id=uid('e');S.assessments.push(a);log(`Đánh giá ${stu(sid)?.name}`,'trending-up')}save('assessments');close();render();toast('Đã lưu đánh giá')};
    aid&&($('#asDel',m).onclick=()=>{S.assessments=S.assessments.filter(x=>x.id!==aid);save('assessments');close();render()})}})};
A.reportStudent=id=>{const s=stu(id);const last=latestAssess(id);const h=hwStats(id);const at=attRate(id);
  const inner=`<div class="sheet" style="font-family:'Be Vietnam Pro',sans-serif;font-size:15px"><h1 style="font-family:'Baloo 2'">Báo cáo học tập</h1><p style="text-align:center;margin:0 0 20px">Lớp tiếng Anh của cô ${esc(S.settings.teacher||'Flora')} · ${fmtD(todayISO())}</p>
  <table style="width:100%;margin-bottom:16px"><tr><td><b>Học sinh:</b> ${esc(s.name)} (${esc(s.eng||'')})</td><td><b>Lớp:</b> ${esc(clsName(s.classId))}</td></tr><tr><td><b>Chuyên cần:</b> ${at??'—'}%</td><td><b>Hoàn thành BTVN:</b> ${h.rate??'—'}%</td></tr></table>
  <h3>Kỹ năng (thang 5 khiên)</h3><table style="width:100%">${SKILLS.map(([k,l])=>`<tr><td style="width:40%">${l}</td><td>${'★'.repeat(last?.scores?.[k]||0)}${'☆'.repeat(5-(last?.scores?.[k]||0))}</td></tr>`).join('')}</table>
  <h3 style="margin-top:16px">Điểm mạnh</h3><p>${esc(s.strengths||'—')}</p><h3>Cần cải thiện</h3><p>${esc(s.weaknesses||'—')}</p><h3>Nhận xét của cô</h3><p>${esc(last?.note||s.notes||'—')}</p>
  <h3>Gợi ý luyện tập ở nhà</h3><ul>${last?SKILLS.map(([k])=>({k,v:last.scores?.[k]||0})).filter(x=>x.v).sort((a,b)=>a.v-b.v).slice(0,3).map(x=>`<li>${RECO[x.k]}</li>`).join(''):'<li>Đọc truyện tiếng Anh cùng con 10 phút mỗi ngày.</li>'}</ul><p style="margin-top:40px;text-align:right">Cô ${esc(S.settings.teacher||'Flora')}</p></div>`;
  download(`bao-cao-${(s.eng||s.name).replace(/\s+/g,'-')}.html`,printable('Báo cáo '+s.name,inner),'Bản in báo cáo (mở tệp → In → Lưu PDF)')};

let lesQ='',lesCls='',lesTpl='';
VIEWS['giao-an']=()=>{
  if(ARG)return lessonView(ARG);

   {k:'status',label:'Trạng thái',type:'select',opts:v=>opt([['planned','Sắp dạy'],['taught','Đã dạy']],v)}],

function lessonView(id){const l=S.lessons.find(x=>x.id===id);if(!l)return '<div class="empty">Không tìm thấy giáo án.</div>';const c=cls(l.classId);

A.lessonStatus=id=>{const l=S.lessons.find(x=>x.id===id);l.status=l.status==='taught'?'planned':'taught';if(l.status==='taught')log(`Đã dạy "${l.title}"`,'check-circle');save('lessons');render()};
A.dupLesson=id=>{const l=S.lessons.find(x=>x.id===id);const n={...l,id:uid('l'),title:l.title+' (bản sao)',status:'planned',reflection:'',date:addDays(l.date,7)};S.lessons.push(n);save('lessons');go('giao-an-'+n.id);toast('Đã nhân bản giáo án sang tuần sau')};

A.printLesson=id=>{const l=S.lessons.find(x=>x.id===id);const inner=`<div class="sheet" style="font-family:'Be Vietnam Pro',sans-serif;font-size:14px"><h1 style="font-family:'Baloo 2'">${esc(l.title)}</h1><p style="text-align:center;margin:0 0 16px">${esc(l.template)} · ${esc(clsName(l.classId))} · ${fmtD(l.date)} ${esc(l.time||'')}</p>${LES_FIELDS.map(([k,lb])=>l[k]?`<h3 style="margin:14px 0 4px">${lb}</h3><div style="white-space:pre-wrap">${esc(l[k])}</div>`:'').join('')}</div>`;download(`giao-an-${l.date}.html`,printable(l.title,inner),'Bản in giáo án')};

// ---------- Homework ----------
let hwCls='',hwView='list';
VIEWS['bai-tap']=()=>{
  if(ARG)return hwDetail(ARG);
  const t=todayISO();
  const list=S.homework.filter(h=>!hwCls||h.classId===hwCls).sort((a,b)=>b.due.localeCompare(a.due));
  const rows=list.map(h=>{const ids=hwTargets(h);const c={done:0,partial:0,missing:0,pending:0};ids.forEach(i=>c[h.records?.[i]?.status||'pending']++);return {h,ids,c}});
  const missingAll=[];rows.forEach(({h,ids})=>ids.forEach(i=>{const st=h.records?.[i]?.status;if((st==='missing'||st==='partial')||(!st||st==='pending')&&h.due<t)missingAll.push({h,s:stu(i),st:st||'pending'})}));
  return `${head('Bài tập về nhà','Giao bài cho cả lớp hoặc từng bạn, theo dõi ai đã nộp, chấm điểm và nhận xét.',`<button class="btn" onclick="A.hwReport()">${ic('file-spreadsheet')} Xuất báo cáo</button><button class="btn pri" onclick="A.editHw()">${ic('plus')} Giao bài mới</button>`)}
  <div class="row"><select id="hwCls" style="width:auto">${classOpts(hwCls,'Tất cả lớp')}</select></div>
  <div class="split"><div class="panel"><h2>Danh sách bài đã giao</h2><div class="list">${rows.map(({h,ids,c})=>{const pct=ids.length?Math.round((c.done+c.partial*.5)/ids.length*100):0;const late=h.due<t;return `<div class="li" style="cursor:pointer" data-go="bai-tap-${h.id}"><div class="grow"><b class="ellip" style="display:block">${esc(h.title)}</b><span class="muted small">${esc(clsName(h.classId))}${h.scope==='students'?' · '+ids.length+' bạn':''} · Hạn ${fmtDs(h.due)}</span><div class="row" style="margin-top:6px;flex-wrap:nowrap"><div style="flex:1">${bar(pct,pct<60?'var(--bad)':pct<85?'var(--warn)':'var(--good)')}</div><span class="small num">${c.done}/${ids.length}</span></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${c.missing?`<span class="chip bad">${c.missing} chưa nộp</span>`:''}${c.pending?`<span class="chip ${late?'warn':''}">${c.pending} chưa chấm</span>`:''}</div></div>`}).join('')||'<div class="empty">Chưa giao bài nào.</div>'}</div></div>
  <div class="panel"><h2>Còn thiếu / chưa hoàn chỉnh</h2><div class="list">${missingAll.slice(0,14).map(({h,s,st})=>s?`<div class="li">${avatar(s)}<div class="grow"><b>${esc(s.name)}</b><div class="muted small ellip">${esc(h.title)}</div></div><span class="chip ${HW_ST[st][1]||'warn'}">${HW_ST[st][0]}</span></div>`:'').join('')||'<div class="empty">Không có bài nào bị thiếu.</div>'}</div></div></div>`;
};
VIEWS['bai-tap:after']=()=>{const s=$('#hwCls');if(s)s.onchange=e=>{hwCls=e.target.value;render()}};
A.editHw=(id,pre={})=>{const h=id?S.homework.find(x=>x.id===id):{classId:hwCls||S.classes[0]?.id,assigned:todayISO(),due:addDays(todayISO(),3),scope:'class',studentIds:[],records:{},...pre};
  const stuList=cid=>studentsOf(cid).map(s=>`<label class="chip" style="cursor:pointer"><input type="checkbox" data-sid="${s.id}" ${(h.studentIds||[]).includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('');
  modal({title:id?'Sửa bài tập':'Giao bài tập mới',body:`<div class="fgrid"><label class="f full">Tên bài<input id="hT" value="${esc(h.title||'')}" placeholder="VD: Workbook trang 12–13"></label>
   <label class="f">Lớp<select id="hC">${classOpts(h.classId)}</select></label><label class="f">Theo giáo án<select id="hL">${opt(S.lessons.filter(l=>l.classId===h.classId).map(l=>[l.id,l.title]),h.lessonId,'— Không —')}</select></label>
   <label class="f">Ngày giao<input type="date" id="hA" value="${h.assigned}"></label><label class="f">Hạn nộp<input type="date" id="hD" value="${h.due}"></label>
   <label class="f full">Giao cho<select id="hS"><option value="class" ${h.scope==='class'?'selected':''}>Cả lớp</option><option value="students" ${h.scope==='students'?'selected':''}>Chọn từng học sinh</option></select></label>
   <div class="full row" id="hStu" ${h.scope==='class'?'hidden':''}>${stuList(h.classId)}</div>
   <label class="f full">Nội dung / hướng dẫn<textarea id="hDesc">${esc(h.desc||'')}</textarea></label></div>`,
   footer:`${id?`<button class="btn danger" style="margin-right:auto" id="hDel">${ic('trash-2')} Xoá</button>`:''}<button class="btn" data-x>Huỷ</button><button class="btn pri" id="hSave">${ic('check')} Lưu</button>`,
   onMount:(m,close)=>{$('#hS',m).onchange=e=>{$('#hStu',m).hidden=e.target.value==='class'};$('#hC',m).onchange=e=>{h.classId=e.target.value;$('#hStu',m).innerHTML=stuList(e.target.value);$('#hL',m).innerHTML=opt(S.lessons.filter(l=>l.classId===e.target.value).map(l=>[l.id,l.title]),'','— Không —')};
    id&&($('#hDel',m).onclick=()=>{close();confirmBox('Xoá bài tập này và kết quả chấm?',()=>{S.homework=S.homework.filter(x=>x.id!==id);save('homework');go('bai-tap')})});
    $('#hSave',m).onclick=()=>{const t=$('#hT',m).value.trim();if(!t){toast('Hãy nhập tên bài');return}Object.assign(h,{title:t,classId:$('#hC',m).value,lessonId:$('#hL',m).value,assigned:$('#hA',m).value,due:$('#hD',m).value,scope:$('#hS',m).value,desc:$('#hDesc',m).value,studentIds:$$('[data-sid]',m).filter(i=>i.checked).map(i=>i.dataset.sid)});
     if(!id){h.id=uid('h');S.homework.push(h);log(`Giao bài "${t}" cho ${clsName(h.classId)}`,'clipboard-plus')}save('homework');close();go('bai-tap-'+h.id)}}})};
A.hwFromLesson=id=>{const l=S.lessons.find(x=>x.id===id);A.editHw(null,{title:'BTVN – '+l.title,classId:l.classId,lessonId:l.id,desc:l.homework||'',assigned:l.date,due:addDays(l.date,3)})};
function hwDetail(id){const h=S.homework.find(x=>x.id===id);if(!h)return '<div class="empty">Không tìm thấy bài tập.</div>';const ids=hwTargets(h);const L=S.lessons.find(l=>l.id===h.lessonId);
  return `<div><a href="#bai-tap" class="btn ghost sm">${ic('arrow-left')} Tất cả bài tập</a></div>
  <div class="pagehead"><div><span class="eyebrow">${esc(clsName(h.classId))} · Giao ${fmtD(h.assigned)} · Hạn ${fmtD(h.due)}</span><h1>${esc(h.title)}</h1>${L?`<p class="muted">Theo giáo án: <a href="#giao-an-${L.id}">${esc(L.title)}</a></p>`:''}</div><div class="row"><button class="btn" onclick="A.hwMarkAll('${id}')">${ic('check-check')} Đánh dấu cả lớp đã nộp</button><button class="btn" data-go="phu-huynh">${ic('bell')} Nhắc phụ huynh</button><button class="btn pri" onclick="A.editHw('${id}')">${ic('pencil')} Sửa</button></div></div>
  ${h.desc?`<div class="panel"><span class="eyebrow">Hướng dẫn</span><p style="margin:6px 0 0;white-space:pre-wrap">${esc(h.desc)}</p></div>`:''}
  <div class="tablewrap"><table><thead><tr><th>Học sinh</th><th>Trạng thái</th><th>Điểm /10</th><th>Nhận xét của cô</th></tr></thead><tbody>${ids.map(sid=>{const s=stu(sid);if(!s)return '';const r=h.records?.[sid]||{status:'pending',score:'',comment:''};return `<tr><td><div class="row" style="flex-wrap:nowrap">${avatar(s)}<b>${esc(s.name)}</b></div></td><td><select data-hw="${sid}" data-f="status" style="width:auto">${opt(Object.entries(HW_ST).map(([k,v])=>[k,v[0]]),r.status)}</select></td><td><input type="number" min="0" max="10" step="0.5" data-hw="${sid}" data-f="score" value="${esc(r.score??'')}" style="width:80px"></td><td><input data-hw="${sid}" data-f="comment" value="${esc(r.comment||'')}" placeholder="VD: Viết đẹp, cần đọc lại từ mới"></td></tr>`}).join('')}</tbody></table></div>`}
document.addEventListener('change',e=>{const el=e.target.closest('[data-hw]');if(!el||ROUTE!=='bai-tap')return;const h=S.homework.find(x=>x.id===ARG);if(!h)return;h.records=h.records||{};const r=h.records[el.dataset.hw]=h.records[el.dataset.hw]||{status:'pending',score:'',comment:''};r[el.dataset.f]=el.dataset.f==='score'&&el.value!==''?+el.value:el.value;if(el.dataset.f==='score'&&el.value!==''&&r.status==='pending')r.status='done';save('homework');if(el.dataset.f!=='comment')render()});
A.hwMarkAll=id=>{const h=S.homework.find(x=>x.id===id);h.records=h.records||{};hwTargets(h).forEach(s=>{h.records[s]={...(h.records[s]||{score:'',comment:''}),status:'done'}});save('homework');render()};
A.hwReport=()=>{const rows=[['Bài tập','Lớp','Hạn nộp','Học sinh','Trạng thái','Điểm','Nhận xét']];S.homework.filter(h=>!hwCls||h.classId===hwCls).forEach(h=>hwTargets(h).forEach(sid=>{const r=h.records?.[sid]||{status:'pending'};rows.push([h.title,clsName(h.classId),fmtD(h.due),stu(sid)?.name||'',HW_ST[r.status]?.[0],r.score??'',r.comment||''])}));download('bao-cao-bai-tap.csv',csv(rows),'Báo cáo bài tập (mở bằng Excel)')};

function wordSets(){const b=Object.entries(VOCAB).map(([k,v])=>({id:k,name:v.name,level:v.level,words:v.w.map(([en,e,vi])=>({en,e,vi}))}));
  const c=S.library.filter(x=>x.type==='vocab'&&(x.words||[]).length).map(x=>({id:'lib-'+x.id,name:x.title+' (của cô)',level:x.level||'',words:x.words}));return [...c,...b]}
function getSet(id){return wordSets().find(s=>s.id===id)||wordSets().find(s=>s.id==='animals')}
function emo(w){return w.e||'🔤'}
